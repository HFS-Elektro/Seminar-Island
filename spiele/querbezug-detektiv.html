<html lang="de" data-kind="game">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; manifest-src 'self'; worker-src 'self'; script-src 'self' 'sha256-qEgRZaYQ6bIdklrUaUVXQ8IZBNwJtiohGCitRI5Yh3g='">

<title>Querbezug-Detektiv</title>
<meta name="description" content="Noir-Lernspiel: Unterrichtsfälle ermitteln, Spuren auf der Pinnwand mit Theorien aus Pädagogik und Pädagogischer Psychologie verbinden und den Querbezug formulieren.">
<script src="../assets/app.js"></script>
<script src="../assets/music.js"></script>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root{--bg:#16120f;--bg2:#221b16;--bg3:#2e251e;--paper:#f2e7cd;--paper2:#e4d3ad;--ink:#2a2018;--txt:#efe6d6;--muted:#bcae98;--line:#4a3d31;--red:#c0392b;--red2:#ff6b5b;--gold:#e8bf62;--good:#46b874;--up:#3d8fc0;--psy:#a55fc9;
 --f-type:"Special Elite","Courier New",Courier,monospace;--f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 var(--f-body)}
body{background:radial-gradient(1200px 600px at 70% -10%,#3a2c20 0,transparent 60%),var(--bg)}
button{font:inherit;cursor:pointer}
a{color:var(--gold)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 80px}
/* Kopf mit Regen */
.top{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(#0e0b09,#1c1612)}
.top::before{content:"";position:absolute;inset:-100px 0 0;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(200,210,230,.10) 14px 15px);animation:rain .6s linear infinite;pointer-events:none}
@keyframes rain{to{transform:translateY(100px) translateX(-27px)}}
@media (prefers-reduced-motion:reduce){.top::before{animation:none}}
.top .wrap{position:relative;display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.logo{font-family:var(--f-type);font-size:clamp(22px,4vw,32px);color:var(--gold);letter-spacing:.02em;margin:0;line-height:1.1;text-shadow:0 0 18px rgba(232,191,98,.25)}
.logo small{display:block;font-size:13px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-family:var(--f-body);font-weight:800}
.tbtn{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg3);color:var(--txt);padding:8px 13px;border-radius:10px;font-weight:800;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);color:#241a0e;border-color:var(--gold)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.file:focus-visible,.note:focus-visible,.theo:focus-visible,.loc:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2.h{font-family:var(--f-type);font-weight:400;color:var(--gold);font-size:clamp(22px,3.4vw,28px);margin:34px 0 10px}
.mut{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* Büro */
.desk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-top:26px;background:linear-gradient(180deg,var(--bg2),var(--bg3));border:1px solid var(--line);border-radius:18px;padding:20px}
.desk img{width:120px;height:auto;filter:sepia(.25) contrast(1.05)}
.desk h2{font-family:var(--f-type);font-weight:400;color:var(--gold);margin:0 0 4px;font-size:26px}
.desk p{margin:4px 0}
@media (max-width:620px){.desk{grid-template-columns:1fr;text-align:left}.desk img{width:90px}}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.file{position:relative;text-align:left;border:0;background:var(--paper);color:var(--ink);border-radius:4px 14px 6px 6px;padding:26px 16px 14px;min-height:150px;box-shadow:0 10px 22px -12px #000;transition:transform .15s;display:flex;flex-direction:column;gap:4px}
.file::before{content:"";position:absolute;left:0;top:-10px;width:44%;height:14px;background:var(--paper2);border-radius:6px 10px 0 0}
.file:hover{transform:translateY(-3px) rotate(-.4deg)}
.file .no{font-family:var(--f-type);font-size:13px;color:#7a6650}
.file b{font-family:var(--f-type);font-weight:400;font-size:19px;line-height:1.2}
.file .sub{font-size:14px;color:#5e4d3c}
.file .st{margin-top:auto;font-size:15px;color:#7a5a20;font-weight:800}
.stamp{position:absolute;right:10px;bottom:30px;font-style:normal;font-family:var(--f-type);color:var(--red);border:3px solid var(--red);padding:2px 8px;transform:rotate(-12deg);opacity:.85;font-size:17px;letter-spacing:.08em}
/* Fallansicht */
.casehead{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin-top:24px}
.casehead h2{font-family:var(--f-type);font-weight:400;color:var(--gold);margin:0;font-size:clamp(22px,3.6vw,30px)}
.steps{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
.steps span{font-size:13px;font-weight:800;padding:5px 11px;border-radius:99px;background:var(--bg3);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--gold);color:#241a0e;border-color:var(--gold)}
.steps span.ok{color:var(--good);border-color:var(--good)}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:22px 22px 18px;box-shadow:0 12px 30px -16px #000;position:relative;font-family:var(--f-type);font-size:17px;line-height:1.6}
.paper h3{margin:0 0 8px;font-weight:400;font-size:20px}
.paper .lbl{font-size:13px;color:#7a6650;letter-spacing:.12em;text-transform:uppercase}
.clip{position:absolute;top:-12px;right:28px;width:22px;height:46px;border:4px solid #9aa3ad;border-radius:12px;border-bottom:none}
/* Ermitteln */
.inv{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.inv{grid-template-columns:1fr}}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.loc{border:1px solid var(--line);background:var(--bg2);color:var(--txt);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.loc:hover{border-color:var(--gold)}
.loc .pic{width:64px;height:64px;display:grid;place-items:center;font-size:38px;background:var(--bg3);border-radius:12px;overflow:hidden}
.loc .pic img{width:64px;height:64px;image-rendering:pixelated}
.loc b{font-size:15px}
.loc small{color:var(--muted);font-weight:700}
.loc.done{opacity:.75}
.loc.done small{color:var(--good)}
.notebook{background:#f6efd9;color:var(--ink);border-radius:8px;padding:16px 16px 10px 40px;position:relative;background-image:repeating-linear-gradient(#f6efd9 0 27px,#c9d6e6 27px 28px);box-shadow:0 12px 30px -16px #000;min-height:180px}
.notebook::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:2px;background:#e09a8f}
.notebook h3{font-family:var(--f-type);font-weight:400;margin:0 0 6px;font-size:18px}
.notebook ol{margin:0;padding-left:18px;font-size:15px;line-height:28px}
.notebook li.new{animation:flash 1.2s}
@keyframes flash{from{background:#ffe58a}to{background:transparent}}
/* Pinnwand */
.board{position:relative;border-radius:14px;padding:18px;border:10px solid #5a3b22;background:#b98a58;background-image:radial-gradient(#a37645 1px,transparent 1.5px),radial-gradient(#c99c69 1px,transparent 1.5px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:30px;position:relative;z-index:1}
@media (max-width:760px){.bgrid{grid-template-columns:1fr;gap:26px}}
.col h4{margin:0 0 8px;font-family:var(--f-type);font-weight:400;color:#2a1a0c;background:rgba(255,245,220,.75);display:inline-block;padding:2px 10px;border-radius:4px;font-size:15px}
.notes{display:grid;gap:12px}
.note{position:relative;text-align:left;border:0;background:#fff7c8;color:var(--ink);padding:14px 12px 10px;font-size:15px;line-height:1.4;box-shadow:0 6px 12px -6px rgba(0,0,0,.6);transform:rotate(var(--r,0deg));transition:transform .12s,box-shadow .12s}
.note::before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#a3241a);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.note.sel{box-shadow:0 0 0 3px var(--gold),0 6px 12px -6px rgba(0,0,0,.6);transform:rotate(0) scale(1.02)}
.note.locked{background:#e3f6da}
.note.locked::before{background:radial-gradient(circle at 35% 35%,#8ff0a8,#1f7a3c)}
.note .to{display:block;margin-top:6px;font-size:12px;font-weight:800;color:#8a2a1e}
.note.locked .to{color:#1f6a36}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.theos{display:grid;gap:10px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.theo{text-align:left;border:0;background:var(--paper);color:var(--ink);padding:10px 12px 10px 14px;border-left:6px solid var(--up);border-radius:4px;font-size:14px;line-height:1.35;box-shadow:0 6px 12px -6px rgba(0,0,0,.6)}
.theo b{display:block;font-size:15px;margin-bottom:2px}
.theo.psy{border-left-color:var(--psy)}
.theo.bin{border-left-color:#555;background:#d9d2c3}
.theo.hot{box-shadow:0 0 0 3px var(--gold),0 6px 12px -6px rgba(0,0,0,.6)}
.theo small{color:#5e4d3c}
.side{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6a5640}
svg.strings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.boardbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.msg{font-weight:800}
.msg.ok{color:var(--good)}.msg.no{color:var(--red2)}
/* Anklage */
.court{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
.court>img{width:120px;height:auto}
@media (max-width:620px){.court{grid-template-columns:1fr}.court>img{width:84px}}
.q{font-weight:800;font-size:18px;margin:0 0 10px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg2);color:var(--txt);padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.right{border-color:var(--good);background:#173322}
.opt.wrong{border-color:var(--red2);background:#3a1a16}
.expl{margin:10px 0;color:var(--muted)}
/* Ergebnis */
.result{text-align:center;padding:26px 16px}
.result .stars{font-size:44px;letter-spacing:6px}
.result .bigstamp{display:inline-block;font-family:var(--f-type);color:var(--red2);border:5px solid var(--red2);padding:6px 18px;font-size:34px;transform:rotate(-8deg);letter-spacing:.1em;animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.formel{background:var(--bg2);border:1px dashed var(--gold);border-radius:14px;padding:16px;text-align:left;margin:18px auto;max-width:760px}
.formel b{color:var(--gold)}
/* Dialog */
#talk{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(10,8,6,.35);padding:16px}
#talk.on{display:flex}
#talk .panel{display:flex;gap:14px;align-items:flex-end;max-width:820px;width:100%;cursor:pointer}
#talk .panel img{width:118px;height:auto;flex:0 0 auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6))}
#talk .panel img.px{width:96px;image-rendering:pixelated;background:var(--bg3);border-radius:12px;padding:4px}
#talk .bub{flex:1;background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px 10px;box-shadow:0 18px 40px -12px #000;min-height:96px;position:relative}
#talk .bub b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#7a4a1e;margin-bottom:2px}
#talk .bub p{margin:0;font-family:var(--f-type);font-size:17px;line-height:1.5;white-space:pre-line}
#talk .nx{display:block;text-align:right;font-size:12px;font-weight:800;color:#8a6a40;margin-top:4px}
#talk.erz .bub{background:#1c1713;color:var(--txt);border:1px solid var(--line)}
#talk.erz .bub p{color:var(--txt);font-style:italic}
@media (max-width:620px){#talk .panel img{width:72px}#talk .panel img.px{width:64px}#talk .bub p{font-size:16px}}
/* Modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,8,6,.7);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
#modal.on{display:flex}
#modal .card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:760px;width:100%;position:relative}
#modal .card h2{font-family:var(--f-type);font-weight:400;color:var(--gold);margin:0 0 10px}
#modal .x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--txt);font-size:26px;line-height:1}
.tlist{display:grid;gap:10px;margin:10px 0}
.tlist div{background:var(--bg3);border-radius:10px;padding:10px 12px;border-left:5px solid var(--up)}
.tlist div.psy{border-left-color:var(--psy)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:#241a0e;font-weight:800;padding:10px 16px;border-radius:12px;z-index:60;box-shadow:0 10px 30px -10px #000;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <h1 class="logo">Querbezug-Detektiv<small>Detektei Reffi &amp; Jäger · Pädagogik ↔ Päd. Psychologie</small></h1>
 <div class="tbtn"><button class="btn" id="bOffice">🗄️ Aktenwand</button><button class="btn" id="bNote">📓 Notizbuch</button><button class="btn" id="bMus" data-music aria-pressed="false" title="Musik an/aus">🎷</button><button class="btn" id="bMute" aria-pressed="false">🔊</button><button class="btn" id="bFs" hidden>⛶</button><a class="btn" href="../index.html">← Launcher</a></div>
</div></header>
<main class="wrap" id="app"></main>
<div id="talk" role="dialog" aria-live="polite" tabindex="-1"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>
<div class="toast" id="toast" role="status"></div>

 clues:{a:["Seit es Sticker gibt, arbeiten die SuS nur noch gegen Belohnung.","korrump"],b:["Justin fand das Thema früher spannend – jetzt zählt nur noch der Sticker.","korrump"],c:["Immer dieselben Arbeitsblätter, keinerlei Wahlmöglichkeit.","sdt"],d:["„Wozu brauch ich das? Im Betrieb ist das ganz anders.“","sinn"],e:["Rückmeldung nur „richtig/falsch“ – kein Hinweis auf Lernfortschritt.","sdt"],f:["Der Raum wurde in den Ferien mintgrün gestrichen.",null]},
 theo:["korrump","sdt","sinn"],dist:["kounin","valid","spacing"],
 hint:"Fragen Sie sich: Was brauchen Menschen, um etwas von sich aus zu wollen?\nUnd was passiert, wenn man ihnen dafür etwas gibt?",
 ak:{q:"Kommissar Eisele: „Formulieren Sie den Querbezug.“",o:["Die äußere Belohnung verdrängt die Motivation (Korrumpierungseffekt). Nach Deci & Ryan fehlen Autonomie- und Kompetenzerleben – und didaktisch ist der Sinn für die SuS nicht geklärt (Klafki: Gegenwarts- und Zukunftsbedeutung).","Die SuS sind faul – mehr Sticker würden das Problem lösen.","Das ist ein klarer Fall von Pygmalion-Effekt, weil die Wände frisch gestrichen sind."],e:"Motivationspsychologie plus Klafkis Frage nach der Bedeutung – zwei Seiten derselben Medaille."},
 mn:{q:"Kommissar Eisele: „Und was raten Sie?“",o:["Sticker schrittweise auslaufen lassen, echten Bezug zum Betrieb herstellen (z. B. Kundenauftrag), Wahlaufgaben anbieten und informativ zum Lernfortschritt rückmelden.","Die Sticker durch Geld ersetzen.","Schlechtere Noten androhen, bis alle wieder mitmachen."],e:"Autonomie, Kompetenzerleben und Sinn stärken – statt äußerer Anreize."},
 formel:"Das hängt mit der <b>Selbstbestimmungstheorie</b> zusammen: Intrinsische Motivation braucht Autonomie, Kompetenz und Eingebundenheit – äußere Belohnungen können sie sogar verdrängen. Für die Planung heißt das: beim <b>Klären von Sinn und Bedeutung</b> den Lebenswelt- und Berufsbezug herausarbeiten und Wahlmöglichkeiten einplanen. – Soll ich das ausführen?",
 outro:[["jaeger","Ich habe übrigens auch einen Sticker für Sie, Reffi.\n… Nein. Das wäre jetzt pädagogisch inkonsequent."],["eisele","Das Interesse ist wieder aufgetaucht. Akte geschlossen."]]},

{id:"c3",title:"Das Phantom der Klassenarbeit",sub:"Lernziele ↔ Leistungsmessung",
 akte:"Klassenarbeit zum Thema Schutzmaßnahmen: Schnitt 4,1. Die Klasse protestiert geschlossen: „Das haben wir nie gemacht!“\n\nDie Lehrkraft schwört: „Alles kam im Unterricht vor.“ Beide Seiten sagen die Wahrheit. Wie kann das sein?",
 intro:[["raffi","Zwei Aussagen. Beide wahr. Und trotzdem eine Vier.\nIn dieser Stadt lügen nicht die Menschen. Es lügen die Lernziele."],["jaeger","Sehr poetisch. Und vermutlich messtheoretisch korrekt."]],
 locs:[
  {icon:"📄",label:"Unterrichtsentwurf durchsuchen",lines:[["raffi","Lernziel im Entwurf: „Die SuS sollen die Schutzmaßnahmen kennen.“\n„Kennen.“ Das Lieblingswort aller ungelösten Fälle."],["raffi","Stundenverlauf: Tafelbild abschreiben, Lückentext ausfüllen. Jede Stunde."]],clues:["a","b"]},
  {icon:"📝",label:"Klassenarbeit untersuchen",lines:[["raffi","Aufgabe 3: „Beurteilen Sie, ob der RCD in diesem Fall ausreicht.“\nBeurteilen. Anforderungsbereich III. Im Unterricht: nie geübt."],["raffi","Und gedruckt auf grünem Papier. Hm."]],clues:["c","d"]},
  {who:"sophie",label:"Zeugin Sophie befragen",lines:[["sophie","Wir wussten gar nicht, was drankommt.\nEin Erwartungshorizont? Kriterien? Nie gesehen."]],clues:["e"]}],
 clues:{a:["Lernziel: „Die SuS sollen die Schutzmaßnahmen kennen.“","lernziel"],b:["Im Unterricht wurde nur reproduziert: abschreiben, Lückentext.","lernziel"],c:["Die Klassenarbeit verlangt „Beurteilen“ (AFB III) – nie geübt.","valid"],d:["Die Arbeit war auf grünes Papier gedruckt.",null],e:["Keine Kriterien, kein Erwartungshorizont – die SuS wussten nicht, was geprüft wird.","evaluation"]},
 theo:["lernziel","valid","evaluation"],dist:["cogload","gruppe","sdt"],
 hint:"Eine Prüfung soll messen, was sie zu messen vorgibt.\nVergleichen Sie, was gelernt und was geprüft wurde.",
 ak:{q:"Kommissar Eisele: „Formulieren Sie den Querbezug.“",o:["Ziele, Unterricht und Prüfung passen nicht zusammen: „Kennen“ ist unpräzise und bleibt auf AFB I, geprüft wurde AFB III. Damit ist die Arbeit nicht inhaltsvalide – präzise Ziele legen fest, was und auf welchem Niveau geprüft wird.","Die Klasse hat einfach nicht gelernt – Gütekriterien spielen hier keine Rolle.","Grünes Papier senkt nachweislich die Leistung."],e:"Lernziele ↔ Validität: Was im Ziel steht, wird unterrichtet und geprüft."},
 mn:{q:"Kommissar Eisele: „Und was raten Sie?“",o:["Ziele mit Operator und Niveau formulieren (I-B-H), alle Anforderungsbereiche im Unterricht üben und Kriterien bzw. Erwartungshorizont vorher transparent machen.","Einfach den Notenschlüssel absenken.","Künftig nur noch Aufgaben aus AFB I stellen."],e:"Ziel, Unterricht und Prüfung aufeinander abstimmen."},
 formel:"Das hängt mit den <b>Gütekriterien der Leistungsmessung</b> zusammen: Valide ist eine Prüfung nur, wenn sie misst, was unterrichtet wurde. Für die Planung heißt das: <b>Lernziele präzise mit Operator und Niveau</b> formulieren und die Evaluation gleich mitplanen. – Soll ich das ausführen?",
 outro:[["jaeger","Das Phantom war also … ein unpräzises Verb.\nIch hatte auf den Hausmeister getippt."],["eisele","Kennen Sie den Unterschied zwischen „kennen“ und „erklären“? – Sie schon. Akte geschlossen."]]},

{id:"c4",title:"Chaos in Raum 0.08",sub:"Verlaufsplan ↔ Klassenführung",
 akte:"Freitag, 5. Stunde. Die Lautstärke steigt langsam, aber stetig. Nach 20 Minuten fliegt ein Radiergummi durch den Raum.\n\nDie Lehrkraft: „Ich hab das überhaupt nicht kommen sehen.“",
 intro:[["raffi","Raum 0.08. Ein Radiergummi im Flug.\nAber der Radiergummi ist nie der Täter. Er ist nur das Symptom."],["jaeger","Wenn ich das in meinen Vorlesungen sage, schreiben alle mit.\nBei Ihnen klingt es nach Film."]],
 locs:[
  {who:"kevin",label:"Zeuge Kevin befragen",lines:[["kevin","Der Lehrer stand die ganze Zeit bei Gruppe 3.\nDa haben wir halt Karten gespielt. Hat ja keiner gemerkt."],["kevin","Und als er den Radiergummi gesehen hat, hat er zehn Minuten mit der ganzen Klasse geschimpft.\nDanach war die Stunde gelaufen."]],clues:["a","b"]},
  {icon:"🗒️",label:"Verlaufsplan untersuchen",lines:[["raffi","Der Verlaufsplan. Materialausgabe: kein Eintrag.\nIn Wirklichkeit hat das Austeilen acht Minuten gedauert."],["raffi","Arbeitsauftrag: nur mündlich. Danach riefen alle gleichzeitig nach Hilfe.\nEine vereinbarte Routine dafür? Fehlanzeige."]],clues:["c","d"]},
  {who:"lena",label:"Zeugin Lena befragen",lines:[["lena","Regeln? Ja, wir haben mal welche aufgehängt. Im September.\nSeitdem hat keiner mehr draufgeschaut."],["lena","Und die Tafel hat 'nen Kratzer. Das nervt mich voll."]],clues:["e","f"]}],
 clues:{a:["Die Lehrkraft war nur bei einer Gruppe – der Rest der Klasse lief unbemerkt aus dem Ruder.","kounin"],b:["Auf den Radiergummi folgen zehn Minuten Strafpredigt für alle – der Schwung ist weg.","kounin"],c:["Materialausgabe ungeplant: Austeilen dauerte acht Minuten.","verlauf"],d:["Keine vereinbarte Routine, wie man Hilfe bekommt – alle rufen gleichzeitig.","regeln"],e:["Die Klassenregeln hängen seit September unbeachtet an der Wand.","regeln"],f:["Die Tafel hat einen Kratzer.",null]},
 theo:["kounin","regeln","verlauf"],dist:["mobbing","sdt","attrib"],
 hint:"Gute Klassenführung sieht man nicht – man merkt nur, wenn sie fehlt.\nAchten Sie auf Lücken im Ablauf und auf den Blick der Lehrkraft.",
 ak:{q:"Kommissar Eisele: „Formulieren Sie den Querbezug.“",o:["Die Unruhe entsteht in den Lücken: ungeplante Übergänge und Zeitfresser im Verlaufsplan. Psychologisch fehlt präventive Klassenführung – Kounins Allgegenwärtigkeit und Überlappung sowie eingeübte Regeln und Routinen.","Freitag, 5. Stunde – da kann man nichts machen.","Die Klasse braucht härtere Strafen, das zeigt die operante Konditionierung."],e:"Verlaufsplanung ↔ Klassenführung: Prävention ist planbar."},
 mn:{q:"Kommissar Eisele: „Und was raten Sie?“",o:["Material vorher bereitlegen oder einen Austeildienst einrichten, Arbeitsauftrag schriftlich geben, eine Hilfe-Routine einführen (z. B. Ampelkarten), im Raum präsent sein und kurz und unauffällig eingreifen.","Gruppenarbeit abschaffen, nur noch Stillarbeit.","Den Radiergummi beschlagnahmen und eine Klassenkonferenz einberufen."],e:"Kleine Routinen, große Wirkung."},
 formel:"Das hängt mit der <b>Klassenführung nach Kounin</b> zusammen: Allgegenwärtigkeit, Überlappung und Schwung beugen Störungen vor, unterstützt durch eingeübte Regeln und Routinen. Für die Planung heißt das: im <b>Verlaufsplan Übergänge, Material und Arbeitsaufträge</b> mitdenken und Zeitfresser meiden. – Soll ich das ausführen?",
 outro:[["jaeger","Ich habe übrigens Augen im Hinterkopf.\nDas ist Allgegenwärtigkeit. Und ein Pferdeschwanz."],["eisele","Ruhe in Raum 0.08. Akte geschlossen."]]},

{id:"c5",title:"Das Rätsel der vergessenen Formel",sub:"Sicherung & Übung ↔ Gedächtnis",
 akte:"Das ohmsche Gesetz. Am Dienstag konnten es alle. Drei Wochen später, in der Klassenarbeit: kollektives Vergessen.\n\n„Das hatten wir doch nie!“ – Doch. Hatten sie.",
 intro:[["raffi","Eine Formel verschwindet spurlos aus 24 Köpfen.\nKein Einbruch. Nur ein leiser, schleichender Verlust."],["jaeger","Das klingt nach Ebbinghaus. Der Mann hat sinnlose Silben auswendig gelernt,\num zu beweisen, dass wir alles vergessen. Und dann hat er's veröffentlicht, damit wir's nicht vergessen."]],
 locs:[
  {icon:"🗒️",label:"Verlaufsplan untersuchen",lines:[["raffi","Phase 2: Lehrervortrag, 35 Minuten am Stück. 14 neue Fachbegriffe.\nKeine Pause, keine Zwischenfrage."],["raffi","Übung: einmal 20 Aufgaben hintereinander. Danach – nie wieder."]],clues:["a","b"]},
  {who:"tim",label:"Zeuge Tim befragen",lines:[["tim","Am Ende gab's ein Merkblatt. Hab ich abgeheftet.\nSeitdem nie wieder angeschaut."],["tim","Die Formel stand übrigens in Comic Sans. Nur so."]],clues:["c","d"]},
  {who:"sophie",label:"Zeugin Sophie befragen",lines:[["sophie","Nach zehn Minuten Vortrag konnte ich nicht mehr folgen.\nDas war einfach zu viel auf einmal."]],clues:["e"]}],
 clues:{a:["35 Minuten Vortrag am Stück mit 14 neuen Fachbegriffen.","cogload"],b:["Einmal 20 Aufgaben am Stück geübt – danach nie wieder.","spacing"],c:["Sicherung = Merkblatt austeilen und abheften. Niemand arbeitet damit.","sicherung"],d:["Die Formel stand in Comic Sans.",null],e:["„Nach zehn Minuten konnte ich nicht mehr folgen – zu viel auf einmal.“","cogload"]},
 theo:["cogload","spacing","sicherung"],dist:["koop","korrump","gruppe"],
 hint:"Zwei Verdächtige: Was zu viel auf einmal kommt, kommt nicht an.\nUnd was nicht wiederkommt, geht wieder.",
 ak:{q:"Kommissar Eisele: „Formulieren Sie den Querbezug.“",o:["Zu viel Neues auf einmal überlastet das Arbeitsgedächtnis, und massiertes Üben ohne Wiederholung führt zum schnellen Vergessen. Didaktisch fehlen eine aktive Sicherung und verteilte Übungsphasen.","Die Formel ist einfach zu schwer für diese Klasse.","Das ist Attribution: Die SuS sind faul."],e:"Gedächtnispsychologie ↔ Sicherung und Übung im Verlaufsplan."},
 mn:{q:"Kommissar Eisele: „Und was raten Sie?“",o:["Input in kurze Portionen mit Zwischensicherung teilen, die Sicherung aktiv gestalten und Übungen verteilt wiederholen – z. B. kurze Abrufübungen zu Stundenbeginn.","Die Formel künftig in Arial drucken.","Einfach direkt vor der Arbeit einmal lange üben."],e:"Portionieren, aktiv sichern, verteilt wiederholen."},
 formel:"Das hängt mit <b>Arbeitsgedächtnis und Vergessenskurve</b> zusammen: Das Arbeitsgedächtnis ist begrenzt, und ohne verteilte Wiederholung wird schnell vergessen. Für die Planung heißt das: Input portionieren, <b>Sicherung aktiv gestalten</b> und Übung über mehrere Stunden verteilen. – Soll ich das ausführen?",
 outro:[["jaeger","Wiederholen Sie den Fall bitte in drei Tagen noch einmal.\nUnd dann in einer Woche. Ich meine das ernst."],["eisele","Die Formel ist wieder da. Akte geschlossen."]]},

{id:"c6",title:"Die Akte Murat",sub:"Bedingungen klären ↔ Mobbing & Gruppen",
 akte:"Murat war immer aufmerksam. Seit einigen Wochen meldet er sich nicht mehr und fehlt öfter. Bei Gruppenarbeiten will ihn niemand dabeihaben.\n\nFür nächste Woche plant die Lehrkraft eine Gruppenarbeit – mit freier Gruppenwahl.",
 intro:[["raffi","Manche Fälle sind laut. Dieser ist leise.\nDie leisen sind die gefährlichen."],["jaeger","Hier geht es nicht um Didaktik allein, Reffi. Hier geht es um einen Menschen.\nVorsichtig ermitteln."]],
 locs:[
  {who:"murat",label:"Mit Murat sprechen",lines:[["raffi","Murat, alles in Ordnung?"],["murat","Ist schon okay. …\nBitte rufen Sie mich einfach nicht auf."]],clues:["a"]},
  {who:"lena",label:"Zeugin Lena befragen",lines:[["lena","In der Klassengruppe machen sich manche über ihn lustig.\nSchon seit Wochen. Immer dieselben."],["lena","Ach, und Murat hat neue Schuhe. Die sind voll schön."]],clues:["b","c"]},
  {icon:"📄",label:"Planung der Lehrkraft lesen",lines:[["raffi","Nächste Stunde: „Gruppenarbeit, freie Gruppenwahl.“\nFür Murat heißt das: wieder übrig bleiben."],["raffi","Notiz zur Klasse: „Seit drei Monaten zusammen. Machtkämpfe, Grüppchenbildung, viel Unruhe.“"]],clues:["d","e"]}],
 clues:{a:["Murat zieht sich zurück und möchte nicht mehr aufgerufen werden.","mobbing"],b:["Seit Wochen machen sich immer dieselben in der Klassengruppe über ihn lustig.","mobbing"],c:["Murat hat neue Schuhe.",null],d:["Geplant: Gruppenarbeit mit freier Gruppenwahl.","bedingungen"],e:["Klasse seit drei Monaten zusammen: Machtkämpfe und Grüppchenbildung.","gruppe"]},
 theo:["mobbing","gruppe","bedingungen"],dist:["valid","advorg","spacing"],
 hint:"Wiederholt, über längere Zeit, immer dieselben – das ist kein Streit mehr.\nUnd eine junge Klasse sucht gerade ihre Rangordnung.",
 ak:{q:"Kommissar Eisele: „Formulieren Sie den Querbezug.“",o:["Die Bedingungsanalyse übersieht die soziale Lage: Es gibt Anzeichen für Mobbing (wiederholt, längerfristig, Machtungleichgewicht). Die Klasse steckt zudem in der Storming-Phase nach Tuckman – freie Gruppenwahl würde die Ausgrenzung verstärken.","Murat ist einfach schüchtern, das gibt sich von selbst.","Auslöser sind die neuen Schuhe – das sollte man vor der Klasse ansprechen."],e:"Bedingungen klären heißt auch: soziale Lage und Gruppendynamik ernst nehmen."},
 mn:{q:"Kommissar Eisele: „Und was raten Sie?“",o:["Gruppen gezielt zusammensetzen, ein vertrauliches Gespräch mit Murat führen und das Vorgehen mit Klassenteam und Schulsozialarbeit abstimmen – z. B. No-Blame-Approach mit Unterstützergruppe.","Die Täter vor der Klasse bloßstellen.","Abwarten – Mobbing regelt sich meistens von selbst."],e:"Schützen, nicht bloßstellen – und nicht allein handeln."},
 formel:"Das hängt mit <b>Mobbing und Gruppenphasen</b> zusammen: Wiederholte Ausgrenzung bei Machtungleichgewicht ist Mobbing, und in der Storming-Phase verfestigen sich Rangordnungen. Für die Planung heißt das: beim <b>Klären der Bedingungen</b> die soziale Lage einbeziehen und Gruppen gezielt bilden. – Soll ich das ausführen?",
 outro:[["jaeger","Gut gemacht, Reffi. Manchmal ist der wichtigste Querbezug der zum Menschen."],["eisele","Murat ist in guten Händen. Akte geschlossen."]]},

{id:"c7",title:"Der Einstieg, der nie endete",sub:"Einstieg ↔ Aufmerksamkeit",
 akte:"Stundenbeginn: ein Video über einen Wohnungsbrand, 18 Minuten lang. Dann: „Was glaubt ihr, worum es heute geht?“ Zehn Minuten Raten.\n\nThema der Stunde: der Leitungsschutzschalter. Nach 30 Minuten hat noch niemand etwas dazu gelernt.",
 intro:[["raffi","Ein Einstieg, so lang wie ein Spielfilm.\nUnd am Ende weiß keiner, wer der Mörder war. Oder worum es ging."],["jaeger","Spannung ist gut. Orientierung ist besser."]],
 locs:[
  {icon:"🗒️",label:"Verlaufsplan untersuchen",lines:[["raffi","Einstieg: 18 Minuten Video, 10 Minuten Raten.\nFast ein Drittel der Stunde – weg."],["raffi","Ziel und Ablauf der Stunde: nirgends genannt. Weder an der Tafel noch mündlich."]],clues:["a","b"]},
  {who:"leon",label:"Zeuge Leon befragen",lines:[["leon","Ich hab nach fünf Minuten nur noch auf das brennende Sofa geguckt.\nWas war nochmal die Frage?"],["leon","Und der Beamer hat die ganze Zeit gebrummt."]],clues:["c","d"]},
  {who:"sophie",label:"Zeugin Sophie befragen",lines:[["sophie","Ich dachte, es geht um die Feuerwehr. Hab ich auch geraten.\nWar falsch. Danach hab ich nicht mehr mitgeraten."]],clues:["e"]}],
 clues:{a:["Einstieg: 18 Minuten Video plus 10 Minuten Raten.","einstieg"],b:["Ziel und Ablauf der Stunde werden nie genannt.","advorg"],c:["Leon bleibt am brennenden Sofa hängen und verliert die Frage.","cogload"],d:["Der Beamer brummt.",null],e:["Das Raten führt weg vom Thema – Sophie steigt aus.","einstieg"]},
 theo:["einstieg","advorg","cogload"],dist:["koop","mobbing","feedback"],
 hint:"Ein Einstieg ist eine Tür, kein Wartezimmer.\nUnd wer nicht weiß, wohin es geht, schaut aufs Spektakuläre.",
 ak:{q:"Kommissar Eisele: „Formulieren Sie den Querbezug.“",o:["Ein Einstieg mit Verpackung darf Neugier wecken, sollte aber höchstens etwa zehn Minuten dauern und zum Ziel führen. Hier fehlt der Zielbezug. Psychologisch hilft ein Advance Organizer, und die lange, emotionale Verpackung bindet die Aufmerksamkeit am falschen Ort.","Videos im Unterricht sind grundsätzlich schädlich.","Der brummende Beamer war das eigentliche Problem."],e:"Einstieg ↔ Aufmerksamkeit und Orientierung."},
 mn:{q:"Kommissar Eisele: „Und was raten Sie?“",o:["Einen kurzen Ausschnitt zeigen, die Problemfrage festhalten, Ziel und Ablauf offenlegen und dann direkt in die Erarbeitung gehen.","Noch ein zweites Video zeigen, damit es spannender wird.","Ganz auf einen Einstieg verzichten."],e:"Kurz, zielbezogen, mit Orientierung."},
 formel:"Das hängt mit <b>Aufmerksamkeit und Advance Organizer</b> zusammen: Aufmerksamkeit ist begrenzt, und eine vorangestellte Orientierung hilft, Neues einzuordnen. Für die Planung heißt das: <b>Einstieg kurz und mit Zielbezug</b>, Ziel und Ablauf transparent machen. – Soll ich das ausführen?",
 outro:[["jaeger","Ich habe das Video übrigens auch gesehen.\nIch weiß bis heute nicht, ob das Sofa es geschafft hat."],["eisele","Einstieg gefunden, Ziel gefunden. Akte geschlossen."]]},

{id:"c8",title:"Feedback ohne Folgen",sub:"Evaluation ↔ Feedback & Attribution",
 akte:"Projektarbeit Steuerungstechnik. Unter jeder Arbeit steht dasselbe: „Gut gemacht!“ oder „Note 4“. Die zweite Projektarbeit wird nicht besser.\n\nBen sagt achselzuckend: „Ich bin halt nicht gut in Technik.“",
 intro:[["raffi","„Gut gemacht.“ Zwei Worte. Null Information.\nDer perfekte Tatort: keine Spuren, nur Noten."],["jaeger","Lob ist wie Zucker. Kurz schön, macht aber nicht satt."]],
 locs:[
  {icon:"🗂️",label:"Rückmeldebögen untersuchen",lines:[["raffi","Rückmeldungen: nur Note plus „Gut gemacht!“.\nKein Wort dazu, was als Nächstes zu tun ist."],["raffi","Bewertungskriterien: vorher nicht festgelegt. Nachher auch nicht."]],clues:["a","b"]},
  {who:"ben",label:"Zeuge Ben befragen",lines:[["ben","Ich bin halt nicht gut in Technik. War schon immer so.\nDa kann man nix machen."]],clues:["c"]},
  {who:"lena",label:"Zeugin Lena befragen",lines:[["lena","Ich weiß gar nicht, was ich besser machen soll.\nHab einfach nochmal dasselbe gemacht."]],clues:["d"]},
  {who:"gaggi",label:"Den Kaffeeautomaten verhören",lines:[["raffi","Und Sie? Haben Sie etwas gesehen?"],["gaggi","… (brummt beleidigt)"],["raffi","Seit Montag kaputt. Kein Kaffee, keine Aussage.\nTypisch."]],clues:["e"]}],
 clues:{a:["Rückmeldung nur als Note plus „Gut gemacht!“ – kein nächster Schritt.","feedback"],b:["Bewertungskriterien wurden vorher nicht festgelegt.","evaluation"],c:["Ben: „Ich bin halt nicht gut in Technik. War schon immer so.“","attrib"],d:["Lena weiß nicht, was sie verbessern soll, und wiederholt dasselbe.","feedback"],e:["Der Kaffeeautomat im Flur ist seit Montag kaputt.",null]},
 theo:["feedback","attrib","evaluation"],dist:["kounin","korrump","gruppe"],
 hint:"Drei Fragen sollte jede Rückmeldung beantworten: Wohin, wo stehe ich, was als Nächstes?\nUnd hören Sie genau hin, worauf Ben sein Scheitern zurückführt.",
 ak:{q:"Kommissar Eisele: „Formulieren Sie den Querbezug.“",o:["Note und Lob sagen nicht, wo die Lernenden stehen und was der nächste Schritt ist. Nach Hattie & Timperley braucht wirksames Feedback Feed Up, Feed Back und Feed Forward. Ben zeigt eine ungünstige, stabile Attribution (Weiner), die Prozessfeedback verändern kann.","Mehr Lob wie „Super!“ steigert automatisch die Leistung.","Ben hat einfach kein Talent – da hilft auch kein Feedback."],e:"Evaluation ↔ Feedback ↔ Attribution."},
 mn:{q:"Kommissar Eisele: „Und was raten Sie?“",o:["Kriterien vorab transparent machen, Rückmeldung mit Stärken, konkreten nächsten Schritten und einer Überarbeitungsschleife; Erfolge auf Anstrengung und Strategie zurückführen.","Nur noch Noten geben, ohne Kommentar.","Ben künftig die schwierigen Aufgaben ersparen."],e:"Kriterien, nächster Schritt, günstige Attribution."},
 formel:"Das hängt mit <b>Feedback nach Hattie & Timperley und der Attributionstheorie</b> zusammen: Wirksames Feedback zeigt Ziel, Stand und nächsten Schritt und lenkt den Blick auf veränderbare Ursachen wie Anstrengung und Strategie. Für die Planung heißt das: <b>Evaluation und Kriterien</b> von Anfang an mitplanen. – Soll ich das ausführen?",
 outro:[["jaeger","Ich gebe Ihnen jetzt Feedback, Reffi:\nZiel erreicht. Stand: hervorragend. Nächster Schritt: Kaffee. Leider kaputt."],["eisele","Gut gemacht, Reffi. – Und zwar weil Sie Ziel, Stand und nächsten Schritt erkannt haben. Akte geschlossen."]]}];

/* ---------- Hilfen ---------- */
const app=$("#app");
let cur=null;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function modal(html){$("#card").innerHTML=`<button class="x" id="mx" aria-label="Schließen">×</button>`+html;$("#modal").classList.add("on");$("#mx").onclick=closeModal;$("#mx").focus()}
function closeModal(){$("#modal").classList.remove("on")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").classList.contains("on"))closeModal()});
function totalStars(){return Object.values(SV.cases).reduce((s,c)=>s+(c.stars||0),0)}
function solvedN(){return Object.keys(SV.cases).length}
function rank(){const s=totalStars();return s>=24?"Reffi Holmes, Meisterdetektiv":s>=18?"Sherlock der Seminarschule":s>=12?"Kommissar der Querbezüge":s>=6?"Privatdetektiv mit Lupe":"Aushilfs-Schnüffler"}

/* ---------- Dialog ---------- */
function talk(lines){return new Promise(res=>{const T=$("#talk");let i=0,timer=null,full="";
 const show=()=>{const[w,t]=lines[i],k=WHO[w]||["",null,0];full=t;T.className="on"+(w==="erz"?" erz":"");
  T.innerHTML=`<div class="panel">${k[1]&&IMG[k[1]]?`<img class="${k[2]?"px":""}" src="${IMG[k[1]]}" alt="">`:""}<div class="bub">${k[0]?`<b>${esc(k[0])}</b>`:""}<p></p><span class="nx">▸ weiter (Klick / Enter)</span></div></div>`;
  const p=T.querySelector("p");let n=0;clearInterval(timer);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){p.textContent=full;timer=null;return}
  timer=setInterval(()=>{n+=2;p.textContent=full.slice(0,n);if(n%8===0)tone(300+Math.random()*80,.02,"square",.012);if(n>=full.length){clearInterval(timer);timer=null}},18)};
 const next=()=>{if(timer){clearInterval(timer);timer=null;T.querySelector("p").textContent=full;return}i++;if(i<lines.length)show();else{T.className="";T.innerHTML="";T.onclick=null;document.removeEventListener("keydown",kd);res()}};
 const kd=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}};
 T.onclick=next;document.addEventListener("keydown",kd);show();T.focus({preventScroll:true})})}

/* ---------- Aktenwand ---------- */
async function office(){cur=null;
 app.innerHTML=`<section class="desk"><img src="${IMG.raffi}" alt="Reffi"><div><h2>Detektei Reffi &amp; Jäger</h2>
  <p>Rang: <b>Reffi, ${rank()}</b> · ${totalStars()}/24 ⭐ · ${solvedN()}/8 Akten gelöst</p>
  <p class="mut">Jede Akte ist ein Unterrichtsfall. Befrage Zeugen, sichere Spuren, verbinde sie auf der Pinnwand mit roten Fäden mit der passenden Theorie aus Pädagogik oder Päd. Psychologie – und formuliere den Querbezug vor Kommissar Eisele.</p>
  <div class="row"><button class="btn pri" id="howBtn">So funktioniert's</button><button class="btn" id="noteBtn2">📓 Querbezug-Notizbuch</button>${solvedN()?`<button class="btn" id="resetBtn">Akten zurücksetzen</button>`:""}</div></div></section>
 <h2 class="h">Die Aktenwand</h2>
 <div class="files">${CASES.map((c,i)=>{const s=SV.cases[c.id];return `<button class="file" data-i="${i}"><span class="no">Akte ${String(i+1).padStart(2,"0")}</span><b>${esc(c.title)}</b><span class="sub">${s?esc(c.sub):"Querbezug: ???"}</span><span class="st">${s?"⭐".repeat(s.stars)+"☆".repeat(3-s.stars):"ungelöst"}</span>${s?'<i class="stamp">GELÖST</i>':""}</button>`}).join("")}</div>`;
 app.querySelectorAll(".file").forEach(b=>b.onclick=()=>openCase(+b.dataset.i));
 $("#howBtn").onclick=how;$("#noteBtn2").onclick=notebook;
 if($("#resetBtn"))$("#resetBtn").onclick=()=>{if(confirm("Alle gelösten Akten und Sterne zurücksetzen?")){SV.cases={};save();office()}};
 window.scrollTo(0,0);
 if(!SV.intro){SV.intro=1;save();await talk([
  ["erz","Regen über der Stadt. Nur in einem Büro im dritten Stock brennt noch Licht."],
  ["raffi","Mein Name ist Reffi. Referendar Reffi.\nIch verbinde Dinge, die zusammengehören. Mit rotem Faden."],
  ["jaeger","Und ich bin Dr. Jäger, Spurensicherung Psychologie.\nIch erkläre, warum Menschen tun, was sie tun. Meistens wegen Motivation. Oder Kaffee."],
  ["eisele","Kommissar Eisele, Dezernat Pädagogik. Ich nehme Ihre Anklagen ab.\nBringen Sie mir Querbezüge. Keine Vermutungen."],
  ["raffi","Ein Querbezug verbindet das, was im Unterricht passiert, mit dem, was die Theorie darüber weiß.\nIm Kolloquium bietet man ihn selbst an. Hier findet man ihn an der Pinnwand."],
  ["jaeger","Acht Akten liegen auf dem Tisch. Fangen Sie irgendwo an.\nIch hole schon mal Kekse."]])}}

function how(){modal(`<h2>So funktioniert's</h2>
 <ol><li><b>Akte lesen:</b> Worum geht es in dem Unterrichtsfall?</li>
 <li><b>Ermitteln:</b> Zeugen befragen und Beweisstücke untersuchen. Jede Spur landet im Notizbuch.</li>
 <li><b>Pinnwand:</b> Tippe eine Spur an und dann die Theorie, zu der sie gehört – ein roter Faden verbindet beide. Manche Spuren sind <i>falsche Fährten</i>: Die gehören in die Ablage. Mit „Pinnwand prüfen“ siehst du, was stimmt. Dr. Jäger hilft mit einem Gutachten (kostet einen Stern).</li>
 <li><b>Anklage:</b> Formuliere vor Kommissar Eisele den Querbezug und einen Lösungsvorschlag.</li></ol>
 <p><b>Sterne:</b> ⭐ Pinnwand beim ersten Prüfen ohne Gutachten richtig · ⭐ Querbezug richtig · ⭐ Lösungsvorschlag richtig.</p>
 <p class="mut">Tipp fürs Kolloquium: Sprich die Musterformulierung am Ende jeder Akte einmal laut nach.</p>`)}
function notebook(){const g=s=>Object.entries(TH).filter(([,t])=>t[0]===s).map(([,t])=>`<div class="${s}"><b>${esc(t[1])}</b><br><span class="mut">${esc(t[2])}</span></div>`).join("");
 modal(`<h2>📓 Querbezug-Notizbuch</h2><div class="formel"><b>Die Querbezug-Formel</b><br>„Das hängt mit <b>[Theorie]</b> zusammen, weil <b>[Mechanismus]</b>. Für die Planung heißt das: <b>[Konsequenz]</b>. – Soll ich das ausführen?“</div>
 <h3>Pädagogik · Unterrichtsplanung</h3><div class="tlist">${g("up")}</div><h3>Pädagogische Psychologie</h3><div class="tlist">${g("psy")}</div>`)}
$("#bOffice").onclick=()=>{if(!$("#talk").classList.contains("on"))office()};
$("#bNote").onclick=notebook;

/* ---------- Fall ---------- */
const PH=["Akte","Ermitteln","Pinnwand","Anklage"];
function openCase(i){const c=CASES[i];cur={i,c,ph:0,found:[],visited:{},links:{},locked:{},tries:0,hints:0,ak:null,mn:null,sel:null,checked:false};render()}
function frame(body){const c=cur.c;return `<div class="casehead"><span class="mut" style="font-family:var(--f-type)">Akte ${String(cur.i+1).padStart(2,"0")}</span><h2>${esc(c.title)}</h2></div>
 <div class="steps">${PH.map((p,j)=>`<span class="${j===cur.ph?"on":j<cur.ph?"ok":""}">${j<cur.ph?"✓ ":""}${j+1}. ${p}</span>`).join("")}</div>${body}`}
function render(){window.removeEventListener("resize",drawStrings);[phAkte,phErmitteln,phPinnwand,phAnklage][cur.ph]()}

function phAkte(){const c=cur.c;app.innerHTML=frame(`<div class="paper"><span class="clip"></span><span class="lbl">Fallakte · vertraulich</span><h3>${esc(c.title)}</h3><p style="white-space:pre-line;margin:0">${esc(c.akte)}</p></div>
 <div class="row" style="margin-top:16px"><button class="btn pri" id="go">Ermittlung aufnehmen ▸</button><button class="btn" id="back">Zurück zur Aktenwand</button></div>`);
 $("#back").onclick=office;$("#go").onclick=async()=>{await talk(c.intro);cur.ph=1;render()};$("#go").focus({preventScroll:true});window.scrollTo(0,0)}

function phErmitteln(){const c=cur.c;const all=c.locs.every((l,j)=>cur.visited[j]);
 app.innerHTML=frame(`<div class="inv"><div><p class="mut" style="margin-top:0">Befrage alle Zeugen und untersuche alle Beweisstücke. Achtung: Nicht jede Spur führt zum Täter.</p><div class="locs">${c.locs.map((l,j)=>`<button class="loc ${cur.visited[j]?"done":""}" data-j="${j}"><span class="pic">${l.who?`<img src="${IMG[l.who]}" alt="">`:l.icon}</span><b>${esc(l.label)}</b><small>${cur.visited[j]?"✓ erledigt":"noch offen"}</small></button>`).join("")}</div></div>
 <div class="notebook"><h3>Notizbuch · Spuren</h3>${cur.found.length?`<ol>${cur.found.map(k=>`<li class="${k===cur.justFound?"new":""}">${esc(c.clues[k][0])}</li>`).join("")}</ol>`:`<p class="mut" style="color:#7a6650;margin:0">Noch keine Spuren.</p>`}</div></div>
 <div class="row" style="margin-top:16px"><button class="btn pri" id="toBoard" ${all?"":"disabled"}>Zur Pinnwand ▸</button>${all?"":`<span class="mut">Erst alle ${c.locs.length} Stationen ermitteln.</span>`}</div>`);
 app.querySelectorAll(".loc").forEach(b=>b.onclick=async()=>{const j=+b.dataset.j,l=c.locs[j];await talk(l.lines);let neu=0;l.clues.forEach(k=>{if(!cur.found.includes(k)){cur.found.push(k);cur.justFound=k;neu++}});cur.visited[j]=1;if(neu){sfx.note();toast(neu===1?"Neue Spur notiert":`${neu} neue Spuren notiert`)}render()});
 if($("#toBoard"))$("#toBoard").onclick=async()=>{await talk([["jaeger","Ab an die Pinnwand. Rote Fäden, Reffi.\nVon jeder Spur zu der Theorie, die sie erklärt. Falsche Fährten in die Ablage."]]);cur.order=shuffle(Object.keys(c.clues));cur.thOrder=shuffle([...c.theo,...c.dist]);cur.ph=2;render()}}

/* ---------- Pinnwand ---------- */
function phPinnwand(){const c=cur.c;const done=Object.keys(c.clues).every(k=>cur.locked[k]);const allLinked=Object.keys(c.clues).every(k=>cur.links[k]!==undefined);
 const theoBtn=id=>{const t=TH[id];return `<button class="theo ${t[0]}" data-t="${id}"><span class="side">${t[0]==="up"?"Pädagogik · UP":"Päd. Psychologie"}</span><b>${esc(t[1])}</b><small>${esc(t[2])}</small></button>`};
 const targetName=v=>v==="bin"?"→ Ablage: falsche Fährte":"→ "+TH[v][1];
 app.innerHTML=frame(`<p class="mut" style="margin-top:0">Tippe erst eine <b>Spur</b> an, dann die passende <b>Theorie</b> oder die <b>Ablage</b>. Eine verbundene Spur nochmal antippen löst den Faden.</p>
 <div class="board" id="board"><svg class="strings" id="svg" aria-hidden="true"></svg><div class="bgrid">
  <div class="col"><h4>Spuren</h4><div class="notes">${cur.order.map((k,j)=>{const v=cur.links[k];return `<button class="note ${cur.sel===k?"sel":""} ${cur.locked[k]?"locked":""}" data-k="${k}" style="--r:${[-1.5,1,-.6,1.4,-1,.6][j%6]}deg" aria-pressed="${cur.sel===k}">${esc(c.clues[k][0])}${v!==undefined?`<span class="to">${cur.locked[k]?"📌 ":""}${esc(targetName(v))}</span>`:""}</button>`}).join("")}</div></div>
  <div class="col"><h4>Theorien &amp; Ablage</h4><div class="theos"><div class="tg">${cur.thOrder.map(theoBtn).join("")}</div><button class="theo bin" data-t="bin"><span class="side">Ablage</span><b>🗑️ Falsche Fährte</b><small>Spuren, die nichts mit dem Fall zu tun haben.</small></button></div></div>
 </div></div>
 <div class="boardbar"><button class="btn pri" id="check" ${allLinked&&!done?"":"disabled"}>Pinnwand prüfen</button><button class="btn" id="hint" ${done?"disabled":""}>🔬 Gutachten Dr. Jäger</button><span class="msg" id="msg" aria-live="polite">${done?"":cur.lastMsg||""}</span>${done?`<button class="btn red" id="toCourt">Anklage erheben ▸</button>`:""}</div>`);
 app.querySelectorAll(".note").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(cur.locked[k])return;if(cur.links[k]!==undefined&&cur.sel!==k){delete cur.links[k];cur.sel=k}else cur.sel=cur.sel===k?null:k;cur.lastMsg="";sfx.pin();render();if(cur.sel&&innerWidth<760){const t=document.querySelector(".theos");if(t)t.scrollIntoView({behavior:"smooth",block:"start"})}});
 app.querySelectorAll(".theo").forEach(b=>b.onclick=()=>{if(!cur.sel){toast("Erst eine Spur antippen");return}const t=b.dataset.t;cur.links[cur.sel]=t;cur.sel=null;sfx.pin();render();if(innerWidth<760){const n=[...document.querySelectorAll(".note")].find(x=>!x.querySelector(".to"));(n||document.querySelector(".boardbar")).scrollIntoView({behavior:"smooth",block:"center"})}});
 $("#check").onclick=checkBoard;$("#hint").onclick=hintBoard;if($("#toCourt"))$("#toCourt").onclick=async()=>{await talk([["raffi","Die Fäden sind gespannt. Zeit, mit Kommissar Eisele zu reden."]]);cur.ph=3;render()};
 requestAnimationFrame(drawStrings);window.addEventListener("resize",drawStrings)}
function drawStrings(){const svg=$("#svg"),bd=$("#board");if(!svg||!bd)return;const R=bd.getBoundingClientRect();let h="";
 const pt=(el,side)=>{const r=el.getBoundingClientRect();return side==="n"?[r.left-R.left+r.width/2,r.top-R.top+2]:[r.left-R.left+12,r.top-R.top+r.height/2]};
 for(const[k,t] of Object.entries(cur.links)){const n=bd.querySelector(`.note[data-k="${k}"]`),th=bd.querySelector(`.theo[data-t="${t}"]`);if(!n||!th)continue;
  const[x1,y1]=pt(n,"n"),[x2,y2]=pt(th,"t");const mx=(x1+x2)/2,my=Math.max(y1,y2)+30;const col=cur.locked[k]?"#1f7a3c":"#c0392b";
  h+=`<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" opacity=".75"/><circle cx="${x2}" cy="${y2}" r="5" fill="${col}"/>`}
 svg.innerHTML=h}
function checkBoard(){const c=cur.c;cur.tries++;let wrong=[];
 for(const k of Object.keys(c.clues)){const want=c.clues[k][1]===null?"bin":c.clues[k][1];if(cur.links[k]===want)cur.locked[k]=1;else wrong.push(k)}
 if(!wrong.length){sfx.ok();cur.lastMsg="";render();$("#msg").className="msg ok";$("#msg").textContent=cur.tries===1&&!cur.hints?"Alles richtig verbunden – beim ersten Versuch!":"Alles richtig verbunden!";
  talk([["jaeger",cur.tries===1&&!cur.hints?"Saubere Arbeit. Kein einziger loser Faden.":"Na also. Ein paar Umwege, aber die Fäden hängen richtig."]]);return}
 sfx.no();wrong.forEach(k=>delete cur.links[k]);cur.lastMsg=`${wrong.length} ${wrong.length===1?"Faden hängt":"Fäden hängen"} falsch – neu verbinden.`;render();$("#msg").className="msg no";
 wrong.forEach(k=>{const e=app.querySelector(`.note[data-k="${k}"]`);if(e)e.classList.add("shake")})}
async function hintBoard(){const c=cur.c;const open=Object.keys(c.clues).filter(k=>!cur.locked[k]);if(!open.length)return;
 if(!cur.hints)await talk([["jaeger",c.hint]]);
 cur.hints++;const k=pick(open);const want=c.clues[k][1]===null?"bin":c.clues[k][1];cur.links[k]=want;cur.locked[k]=1;
 await talk([["jaeger",want==="bin"?`„${c.clues[k][0]}“\nDas ist eine falsche Fährte. Ablage.`:`„${c.clues[k][0]}“\nDas gehört zu: ${TH[want][1]}.`]]);
 if(Object.keys(c.clues).every(k=>cur.locked[k]))cur.lastMsg="";render()}

/* ---------- Anklage ---------- */
function phAnklage(){const c=cur.c;const stage=cur.ak===null?"ak":cur.mn===null?"mn":"end";if(stage==="end")return finish();const Q=c[stage];
 const opts=shuffle(Q.o.map((t,j)=>[t,j]));
 app.innerHTML=frame(`<div class="court"><img src="${IMG.eisele}" alt="Kommissar Eisele"><div><p class="q">${esc(Q.q)}</p><div class="opts">${opts.map(([t,j])=>`<button class="opt" data-j="${j}">${esc(t)}</button>`).join("")}</div><div class="expl" id="expl" aria-live="polite"></div><div id="nx"></div></div></div>`);
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j,ok=j===0;cur[stage]=ok;app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.j===0)x.classList.add("right")});if(!ok)b.classList.add("wrong");ok?sfx.ok():sfx.no();
  $("#expl").textContent=(ok?"✓ ":"✗ ")+Q.e;$("#nx").innerHTML=`<button class="btn pri" id="nxb">${stage==="ak"?"Weiter ▸":"Urteil abwarten ▸"}</button>`;$("#nxb").focus();
  $("#nxb").onclick=async()=>{if(stage==="ak")await talk([ok?["eisele","Gut. Klar formuliert, mit Theorie und Konsequenz."]:["jaeger","Hm. Das würde ich im Kolloquium so nicht sagen.\nDie richtige Fassung ist grün markiert – merken Sie sich die."]]);render()}});
 window.scrollTo(0,0)}
async function finish(){const c=cur.c;let s=3;if(cur.tries>1||cur.hints)s--;if(!cur.ak)s--;if(!cur.mn)s--;s=Math.max(1,s);
 const prev=SV.cases[c.id];SV.cases[c.id]={stars:Math.max(s,prev?prev.stars:0),t:Date.now()};save();
 await talk(c.outro);sfx.stamp();
 const nextI=CASES.findIndex((x,j)=>j!==cur.i&&!SV.cases[x.id]);
 app.innerHTML=frame(`<div class="result"><div class="bigstamp">GELÖST</div><p class="stars" aria-label="${s} von 3 Sternen">${"⭐".repeat(s)}${"☆".repeat(3-s)}</p>
  <p><b>${esc(c.sub)}</b></p><div class="formel"><b>So sagst du es im Kolloquium</b> (einmal laut nachsprechen!)<br>„${c.formel}“</div>
  <p class="mut">Gesamt: ${totalStars()}/24 ⭐ · Rang: Reffi, ${rank()}</p>
  <div class="row" style="justify-content:center">${nextI>=0?`<button class="btn pri" id="nextC">Nächste Akte ▸</button>`:""}<button class="btn" id="again">Akte nochmal spielen</button><button class="btn" id="wall">Zur Aktenwand</button></div></div>`);
 if($("#nextC"))$("#nextC").onclick=()=>openCase(nextI);$("#again").onclick=()=>openCase(cur.i);$("#wall").onclick=office;
 if(solvedN()===8&&!SV.allDone){SV.allDone=1;save();await talk([["eisele","Alle acht Akten gelöst. Reffi, Sie sind bereit fürs Kolloquium.\nUnd bieten Sie die Querbezüge bitte selbst an."],["jaeger","Ich habe Kekse geholt. Für alle.\nDas ist positive Verstärkung. Rein wissenschaftlich."]])}}

if(window.LL)LL.setupGame({button:$("#bFs")});
if(window.LLMusic){LLMusic.setTheme("noir");LLMusic.arm();LLMusic.onChange(on=>{$("#bMus").setAttribute("aria-pressed",on);$("#bMus").style.opacity=on?1:.55});$("#bMus").style.opacity=.55;$("#bMus").onclick=e=>{e.stopPropagation();LLMusic.toggle()}}else $("#bMus").hidden=true;
office();
</script>
