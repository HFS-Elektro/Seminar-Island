<style>
/* Bewusst ein einziges dunkles Retro-Theme (Spiel). Handy zuerst: Bühne oben, darunter ein Panel,
   das entweder Verben + Inventar oder den Dialog zeigt (wie bei den SCUMM-Klassikern). */
:root{
  --bg:#14111f; --panel:#221c37; --panel2:#2d2550; --line:#4a3f7c;
  --ink:#efe7d2; --dim:#a69fc2; --verb:#8fc8ff; --hi:#ffd447; --bad:#ff6b5b; --good:#7be08a;
  --f-pix:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-txt:"VT323", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
/* Das Spiel hat bewusst nur ein dunkles Retro-Theme – auch im hellen Systemmodus. */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14111f}}
:root[data-theme="dark"]{--bg:#14111f}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
[hidden]{display:none!important}
body{font-family:var(--f-txt);font-size:20px;line-height:1.2;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 12px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.wrap{max-width:none;margin:0 auto;display:flex;flex-direction:column;gap:6px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
h1{font-family:var(--f-pix);font-size:clamp(9px,2.4vw,14px);margin:0;color:var(--hi);letter-spacing:.04em;line-height:1.4}
h1 small{display:block;font-size:.72em;color:var(--dim);margin-top:3px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.btn{font-family:var(--f-pix);font-size:9px;background:var(--panel);color:var(--verb);border:2px solid var(--line);padding:8px 8px;cursor:pointer;letter-spacing:.03em;min-height:34px}
.btn:hover{color:var(--hi)}
.btn[aria-pressed="true"]{color:var(--hi);border-color:var(--hi)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.score{font-family:var(--f-pix);font-size:9px;color:var(--good);padding:4px 2px;font-variant-numeric:tabular-nums}
.stage{position:relative;width:min(100%,max(320px,calc((100vh - 400px)*1.7778)));margin:0 auto;aspect-ratio:16/9;background:#000;border:3px solid var(--line);overflow:hidden;touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hs{position:absolute;inset:0;width:100%;height:100%}
#hs .h{fill:transparent;cursor:pointer}
#hs.show .h{fill:rgba(255,212,71,.14);stroke:var(--hi);stroke-width:1;stroke-dasharray:3 2}
#hs .h:focus{outline:none}#hs .h:focus-visible{fill:rgba(255,212,71,.22)}
.status{font-family:var(--f-pix);font-size:clamp(8px,2.2vw,11px);color:var(--hi);min-height:2em;display:flex;align-items:center;padding:0 2px;letter-spacing:.02em;line-height:1.4}
.panel{position:relative}
.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px}
.verbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;align-content:start}
.verbs button{font-family:var(--f-pix);font-size:clamp(8px,2.3vw,10px);background:var(--panel);color:var(--verb);border:2px solid var(--line);padding:12px 2px;cursor:pointer;min-height:44px}
.verbs button:hover{color:var(--ink)}
.verbs button[aria-pressed="true"]{color:var(--hi);border-color:var(--hi);background:var(--panel2)}
.inv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-content:start;max-height:240px;overflow-y:auto}
.inv button{background:var(--panel);border:2px solid var(--line);padding:3px 1px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px;color:var(--dim);font-family:var(--f-txt);font-size:15px;line-height:1;min-width:0}
.inv button img{width:48px;max-width:100%;height:auto;image-rendering:pixelated}
.inv button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv button[aria-pressed="true"]{border-color:var(--hi);color:var(--hi);background:var(--panel2)}
.inv .empty{border:2px dashed #2c2546;min-height:56px}
@media (max-width:640px){.controls{grid-template-columns:1fr}.inv{grid-template-columns:repeat(5,minmax(0,1fr))}}
.dlg{background:rgba(17,13,32,.97);border:3px solid var(--hi);display:flex;gap:10px;padding:10px 12px;align-items:flex-start;min-height:100%;cursor:pointer}
.dlg .pt{flex:0 0 auto;width:clamp(52px,14vw,84px);border:2px solid var(--line)}
.dlg .pt img{width:100%;display:block;image-rendering:pixelated}
.dlg .tx{min-width:0;flex:1;font-size:clamp(20px,5vw,25px);line-height:1.15}
.dlg .who{font-family:var(--f-pix);font-size:clamp(8px,2.2vw,10px);color:var(--hi);margin-bottom:6px;letter-spacing:.05em}
.dlg .who.du{color:var(--verb)}
.dlg .who.info{color:var(--dim)}
.dlg .more{font-family:var(--f-pix);font-size:8px;color:var(--dim);margin-top:8px;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.dlg.ask{cursor:default}
.opts{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.opts button{text-align:left;font-family:var(--f-txt);font-size:clamp(19px,4.6vw,23px);background:var(--panel);border:2px solid var(--line);color:var(--verb);cursor:pointer;padding:6px 8px;line-height:1.1}
.opts button:hover,.opts button:focus-visible{color:var(--hi);border-color:var(--hi)}
.opts button.help{border-style:dashed;color:var(--good);font-size:clamp(17px,4vw,20px)}
.ord button.hint{border-color:var(--hi);color:var(--hi);box-shadow:0 0 0 2px var(--hi) inset}
.toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:var(--f-pix);font-size:clamp(7px,2vw,10px);padding:7px 10px;background:rgba(17,13,32,.94);border:2px solid var(--good);color:var(--good);pointer-events:none;max-width:92%;text-align:center;line-height:1.4}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.duelbar{position:absolute;left:6px;right:6px;bottom:6px;display:flex;justify-content:space-between;gap:6px;font-family:var(--f-pix);font-size:clamp(7px,2vw,10px);pointer-events:none}
.duelbar span{background:rgba(17,13,32,.92);border:2px solid var(--hi);color:var(--hi);padding:5px 8px}
.clockbar{position:absolute;right:6px;top:6px;font-family:var(--f-pix);font-size:clamp(7px,2vw,10px);background:rgba(17,13,32,.92);border:2px solid var(--verb);color:var(--verb);padding:5px 8px;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(8,6,16,.86);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:4px solid var(--line);max-width:760px;width:100%;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--f-pix);font-size:clamp(10px,2.8vw,13px);color:var(--hi);margin:0;letter-spacing:.04em;line-height:1.5}
.card h3{font-family:var(--f-pix);font-size:10px;color:var(--verb);margin:4px 0 0;letter-spacing:.04em;line-height:1.5}
.card p{margin:0;max-width:68ch}
.card ul{margin:0;padding-left:22px}
.card svg{width:100%;height:auto;display:block}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.readout{background:#0e2a1c;color:#9df5b0;border:2px solid #1f5b3a;padding:8px 10px;font-size:20px;min-height:2.4em}
.readout.bad{background:#2e1214;color:#ffb3a8;border-color:#6a2a2a}
table{border-collapse:collapse;width:100%;font-size:19px;font-variant-numeric:tabular-nums}
th,td{border:2px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
th{font-family:var(--f-pix);font-size:8px;color:var(--dim);font-weight:normal;letter-spacing:.04em;line-height:1.5}
.on{color:var(--hi)}.off{color:var(--dim)}.ok{color:var(--good)}.no{color:var(--bad)}
.tbl{overflow-x:auto}
.big{font-family:var(--f-pix);font-size:clamp(13px,3.6vw,20px);color:var(--hi);line-height:1.5;margin:0}
.lf{font-family:var(--f-pix);font-size:9px;color:var(--verb);letter-spacing:.06em;line-height:1.6}
.go{font-family:var(--f-pix);font-size:11px;background:var(--hi);color:#1a1430;border:none;padding:13px 16px;cursor:pointer;min-height:44px}
.go.alt{background:var(--panel2);color:var(--verb);border:2px solid var(--line)}
.go:disabled{opacity:.4;cursor:default}
.hint{color:var(--dim);font-size:18px}
.field{font-family:var(--f-txt);font-size:22px;background:#120f22;color:var(--ink);border:2px solid var(--line);padding:6px 10px;min-width:0;width:12ch}
textarea.field{width:100%;min-height:6.5em;resize:vertical;line-height:1.15}
.split{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.split img{image-rendering:pixelated;width:min(180px,38%);height:auto}
.split > div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.ord button,.sortc button{display:block;width:100%;text-align:left;font-family:var(--f-txt);font-size:20px;background:var(--panel2);color:var(--ink);border:2px solid var(--line);padding:8px 10px;cursor:pointer;margin-bottom:4px;line-height:1.1}
.ord button.done{color:var(--good);border-color:var(--good);cursor:default}
.sortq{background:#120f22;border:2px dashed var(--hi);padding:10px 12px;font-size:22px;line-height:1.15}
.sortc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.sortc button{margin:0;text-align:center;font-family:var(--f-pix);font-size:9px;line-height:1.5;color:var(--verb);min-height:48px}
.sortc button.right{border-color:var(--good);color:var(--good)}
.sortc button.wrong{border-color:var(--bad);color:var(--bad)}
.chk{list-style:none;padding:0!important;display:flex;flex-direction:column;gap:3px}
.chk li::before{content:"✗ ";color:var(--bad)}
.chk li.y::before{content:"✓ ";color:var(--good)}
.model{background:#1a2440;border:2px solid #3a5a9a;padding:8px 10px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.chap{border:2px solid var(--line);background:var(--panel2);padding:8px;display:flex;flex-direction:column;gap:4px;text-align:left;font-family:var(--f-txt);font-size:18px;color:var(--ink);cursor:pointer}
.chap b{font-family:var(--f-pix);font-size:9px;color:var(--hi);font-weight:normal;line-height:1.5}
.chap.ok{border-color:var(--good)}
.chap .st{font-family:var(--f-pix);font-size:8px;color:var(--dim)}
.chap.ok .st{color:var(--good)}
.cert{border:4px double var(--hi);padding:12px;background:#1d1830}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1 id="ttl">Das Geheimnis von Seminar-Island<small id="sub">Ein Pädagogik-Adventure</small></h1>

      <button class="btn" id="bMusic" aria-pressed="false" aria-label="Musik">♪</button>

    <div class="dlg" id="dlg" hidden aria-live="polite"></div>
  </div>
</div>

function award(k,p){if(!S||S.pts[k]!==undefined)return;const c=catOf(k);if(!c){console.warn('cat?',k);return}
  if(c[2]>0&&typeof stat==='function')stat(topicOfCat(k),Math.max(0,Math.min(1,p/c[2])));
  p=Math.max(0,Math.min(c[2],Math.round(p)));S.pts[k]=p;if(p>0){toast('+'+p+'  '+c[1]);sfx('good')}else toast('±0  '+c[1],true);updScore();
  if(CHX().cats.every(x=>S.pts[x[0]]!==undefined))S.finishPending=true}
function minus(p,why,once){if(once){if(S.f['m_'+once])return;S.f['m_'+once]=1}S.minus.push([why,p]);toast('−'+p+'  '+why,true);sfx('bad');updScore()}
function total(){return Math.max(0,Object.values(S.pts).reduce((a,b)=>a+b,0)-S.minus.reduce((a,b)=>a+b[1],0))}
function done(k){return S&&S.pts[k]!==undefined}
function updScore(){$('#score').textContent=S?`${total()}/100 · Ziel ${PASS}`:''}
let tt;function toast(t,bad){const e=$('#toast');e.textContent=t;e.className='toast'+(bad?' bad':'');e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600)}

async function banter(who){const r=Math.random();if(r<.12)return duo();if(r>.4)return;const o=who==='eisele'?'jaeger':who==='jaeger'?'eisele':pick(['eisele','jaeger']);await say(o,pick(BANTER[o]))}
function helpOpt(n){return `💡 Hilfe${n?' (Stufe '+n+')':''}`}
/* Multiple Choice: [[text, richtig, feedback], …] – gemischt; volle Punkte beim 1. Versuch, 40 % beim 2.; Hilfe senkt auf 60 % */
async function quiz(key,who,q,opts,full,fbWho){let o=shuffle(opts);let tries=0,help=0;const tip=key&&S&&catOf(key)?catOf(key)[3]:null;
  while(true){const wrongLeft=o.filter(x=>!x[1]).length;const canHelp=BASIS()&&wrongLeft>1&&help<2;
    const labels=o.map(x=>x[0]);if(canHelp)labels.push(helpOpt(help+1));
    const a=await choose(who,q,labels);
    if(a>=o.length){help++;const ws=o.filter(x=>!x[1]);const drop=pick(ws);o=o.filter(x=>x!==drop);
      const mentor=help===1?'jaeger':'eisele';
      if(help===1)await say(mentor,`Spontane Idee: Wir probieren es mal per Ausschlussverfahren! Eine Antwort kannst du jedenfalls streichen: <span class="off">„${drop[0].slice(0,90)}${drop[0].length>90?'…':''}“</span>`);
      else await say(mentor,'Strukturiert gedacht: Eine Antwort fällt weg. Und der Kern aus dem Skript lautet: <span class="on">'+(tip||'Schau, welche Antwort einen Fachbegriff korrekt auf den Fall anwendet.')+'</span>');
      continue}
    if(o[a][1]){await say(fbWho||who,o[a][2]);if(key){award(key,(tries===0?full:tries===1?full*.4:0)*(help?.6:1));await banter(fbWho||who)}return tries}
    if(tries===0&&key)addFehler({q,c:o.find(x=>x[1])[0],w:o.filter(x=>!x[1]).map(x=>x[0]),t:topicOfCat(key),e:o.find(x=>x[1])[2]});
    tries++;sfx('bad');await say(who,o[a][2]+(tries<2?' <span class="off">Versuch’s nochmal.</span>':' <span class="off">Noch ein Versuch.</span>'));
    if(BASIS()){o=o.filter((x,i)=>i!==a)}}}

function askOrder(o){return new Promise(res=>{let pos=0,err=0,streak=0;lock();const items=shuffle(o.steps.map((s,i)=>[s,i]));
  openModal(`<h2>${o.title}</h2><p>${o.html||''}</p><div class="ord" id="ord">${items.map(([s,i])=>`<button data-i="${i}">${s}</button>`).join('')}</div><div class="readout" id="oOut">Tippe den ersten Schritt an.</div>
   <div class="row">${BASIS()?'<button class="go alt" id="oHelp">💡 Hilfe: nächster Schritt</button>':''}</div><div class="row" id="oNext" hidden><button class="go" id="oCont">Weiter</button></div>`);
  const hl=()=>{$('#ord').querySelectorAll('button').forEach(b=>b.classList.toggle('hint',+b.dataset.i===pos&&!b.classList.contains('done')))};
  if($('#oHelp'))$('#oHelp').onclick=()=>{if(pos>=o.steps.length)return;err++;hl();$('#oOut').className='readout';$('#oOut').textContent='Der markierte Schritt ist als Nächstes dran. (Zählt wie ein Fehlklick.)'};
  $('#ord').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.classList.contains('done')||pos>=o.steps.length)return;const i=+b.dataset.i;
    if(i===pos){b.classList.add('done');b.classList.remove('hint');b.textContent=(pos+1)+'. '+b.textContent;pos++;streak=0;sfx('click');$('#oOut').className='readout';$('#oOut').textContent=pos<o.steps.length?'Richtig. Und dann?':(err?`Komplett – mit ${err} Fehlklick${err>1?'s':''}.`:'Komplett und fehlerfrei!');
      if(pos===o.steps.length){if($('#oHelp'))$('#oHelp').hidden=true;if(o.key)award(o.key,o.full*Math.max(0,1-err/Math.max(3,o.steps.length-1)));if(o.after)$('#oOut').innerHTML+='<br>'+o.after;$('#oNext').hidden=false;$('#oCont').onclick=()=>{closeModal();unlock();res(err)};$('#oCont').focus()}}
    else{err++;streak++;sfx('bad');$('#oOut').className='readout bad';$('#oOut').textContent=o.wrongMsg||'Noch nicht dran. Was muss vorher passieren?';
      if(BASIS()&&streak>=2){hl();$('#oOut').textContent+=' Ich hab dir den nächsten Schritt markiert.'}}})})}
/* Sortieren: items [[text, katIndex, warum], …] */
function askSort(o){return new Promise(res=>{lock();const items=shuffle(o.items);let i=0,ok=0;
  const step=()=>{const it=items[i];let helped=false;
    openModal(`<h2>${o.title}</h2>${o.html?`<p>${o.html}</p>`:''}<p class="hint">Karte ${i+1} von ${items.length}</p><div class="sortq">${it[0]}</div><div class="sortc" id="sc">${o.cats.map((c,k)=>`<button data-k="${k}">${c}</button>`).join('')}</div>
     ${BASIS()&&o.cats.length>2?'<div class="row"><button class="go alt" id="sHelp">💡 Hilfe: Auswahl eingrenzen</button></div>':''}<div class="readout" id="sOut" hidden></div><div class="row" id="sNext" hidden><button class="go" id="sCont">Weiter</button></div>`);
    const bs=[...$('#sc').querySelectorAll('button')];
    if($('#sHelp'))$('#sHelp').onclick=()=>{helped=true;$('#sHelp').hidden=true;const wr=shuffle(bs.filter(b=>+b.dataset.k!==it[1]));wr.slice(0,Math.ceil(wr.length/2)).forEach(b=>{b.disabled=true;b.style.opacity=.3})};
    bs.forEach(b=>b.onclick=()=>{if($('#sNext').hidden===false)return;bs.forEach(x=>x.disabled=true);if($('#sHelp'))$('#sHelp').hidden=true;const k=+b.dataset.k;const out=$('#sOut');out.hidden=false;
      bs[it[1]].classList.add('right');
      if(k===it[1]){ok+=helped?.5:1;sfx('good');out.className='readout';out.innerHTML='Richtig! '+(it[2]||'')}
      else{if(o.key)addFehler({q:o.title+': '+it[0],c:o.cats[it[1]],w:shuffle(o.cats.filter((c,ci)=>ci!==it[1])).slice(0,2),t:topicOfCat(o.key),e:it[2]||''});b.classList.add('wrong');sfx('bad');out.className='readout bad';out.innerHTML=`Gehört zu <b>${o.cats[it[1]]}</b>. ${it[2]||''}`}
      $('#sNext').hidden=false;$('#sCont').focus();$('#sCont').onclick=()=>{i++;if(i<items.length)step();else{if(o.key)award(o.key,o.full*ok/items.length);closeModal();unlock();res(ok)}}})};
  step()})}
/* Freitext mit Schlüsselwort-Gruppen: groups [{l:'Bezeichnung', k:['wort','teil', …]}] */
function askText(o){return new Promise(res=>{lock();let tries=0,best=0,help=0;
  openModal(`<h2>${o.title}</h2><p>${o.html}</p><textarea class="field" id="tIn" aria-label="Deine Antwort" placeholder="${o.ph||'Deine Antwort …'}"></textarea>
   <div class="row"><button class="go" id="tGo">Prüfen</button>${BASIS()?'<button class="go alt" id="tHelp">💡 Hilfe</button>':''}</div><div id="tHint"></div><div id="tOut"></div><div class="row" id="tNext" hidden><button class="go alt" id="tAgain">Nachbessern</button><button class="go" id="tCont">Weiter</button></div>`);
  if($('#tHelp'))$('#tHelp').onclick=()=>{help++;const h=$('#tHint');
    if(help===1)h.innerHTML=`<div class="model"><b class="on">Hilfe 1 – Das gehört hinein:</b><ul>${o.groups.map(g=>`<li>${g.l}</li>`).join('')}</ul></div>`;
    else{h.innerHTML+=`<div class="model"><b class="on">Hilfe 2 – So könnte der Anfang klingen:</b> ${o.model.replace(/<[^>]+>/g,'').split(/[,(–]/)[0]} …</div>`;$('#tHelp').hidden=true}};
  const check=()=>{const v=norm($('#tIn').value);if(v.trim().length<8){$('#tOut').innerHTML='<p class="hint">Schreib ruhig ein, zwei Sätze.</p>';return}
    tries++;const hit=o.groups.map(g=>g.k.some(k=>v.includes(norm(k))));const n=hit.filter(Boolean).length;best=Math.max(best,n);if($('#tHelp'))$('#tHelp').hidden=true;
    $('#tOut').innerHTML=`<p>Gefunden: <b class="${n===o.groups.length?'ok':'on'}">${n} von ${o.groups.length}</b> Elementen.</p><ul class="chk">${o.groups.map((g,i)=>`<li class="${hit[i]?'y':''}">${g.l}</li>`).join('')}</ul>
      <div class="model"><b class="on">Musterlösung:</b> ${o.model}</div><p class="hint">Die Prüfung erfolgt über Schlüsselwörter. Vergleiche selbst mit der Musterlösung – Formulierungen dürfen abweichen.</p>`;
    sfx(n===o.groups.length?'good':'click');$('#tGo').disabled=true;$('#tNext').hidden=false;$('#tAgain').hidden=tries>=2||n===o.groups.length;$('#tCont').focus()};
  $('#tGo').onclick=check;
  $('#tAgain').onclick=()=>{$('#tGo').disabled=false;$('#tNext').hidden=true;$('#tOut').innerHTML='';$('#tIn').focus()};
  $('#tCont').onclick=()=>{if(o.key)award(o.key,o.full*best/o.groups.length*(help?1-.1*help:1));closeModal();unlock();res(best)}})}

/* ================= Fachbegriff-Fechten (wie das Beleidigungsfechten) =================
   items: Pool-Einträge {a: Angriff, c: richtige Parade, w:[[falsche Parade, Konter des Gegners], …]} */
const HURT=['Argh! Das saß.','Touché! Woher weißt du das?!','Verflixt. Das steht so im Skript.','Grrr. Fachlich einwandfrei. Ich hasse das.','Autsch. Mit Fachbegriff und allem.','Hmpf. Na gut. Punkt für dich.'];
function duelBar(me,foe,name,n,i){const b=$('#duelbar');b.hidden=false;b.innerHTML=`<span>Reffi ${fmt(me,1)}</span><span>Runde ${Math.min(i+1,n)}/${n}</span><span>${esc(name)} ${foe}</span>`}
async function duel(o){const items=o.items;let me=0,foe=0;const fn=PEOPLE[o.foe]?PEOPLE[o.foe].n:'Gegner';sfx('clang');
  if(o.intro)await lines(o.intro);
  for(let i=0;i<items.length;i++){const it=items[i];duelBar(me,foe,fn,items.length,i);
    await say(o.foe,it.a);
    let opts=shuffle([[it.c,true,null]].concat(it.w.map(w=>[w[0],false,w[1]])));let helped=false;
    let a;while(true){const labels=opts.map(x=>x[0]);if(BASIS()&&!helped)labels.push('💡 Souffleur (halber Punkt)');a=await choose('du','Deine Parade:',labels);
      if(a<opts.length)break;helped=true;const drop=pick(opts.filter(x=>!x[1]));opts=opts.filter(x=>x!==drop);await say(pick(['jaeger','eisele']),'(flüstert) Pssst … nimm nicht: „'+drop[0]+'“')}
    if(opts[a][1]){me+=helped?.5:1;stat(it.t,helped?.5:1);sfx('clang');toast('TOUCHÉ!');duelBar(me,foe,fn,items.length,i);await say(o.foe,it.r||pick(o.hurt||HURT))}
    else{foe++;stat(it.t,0);addFehler({q:it.a,c:it.c,w:it.w.map(w=>w[0]),t:it.t,e:''});sfx('bad');duelBar(me,foe,fn,items.length,i);await say(o.foe,opts[a][2]);await say('info','<span class="ok">Die starke Parade wäre gewesen:</span> '+it.c)}
    if(i===Math.floor(items.length/2)&&items.length>=3&&o.foe!=='jaeger'){const r=await surpriseRound(o.foe,it);me+=r;duelBar(me,foe,fn,items.length,i)}}
  $('#duelbar').hidden=true;
  if(o.key)award(o.key,o.full*me/items.length);
  return me}
/* Jägers spontane Überraschungsrunde: Rollentausch – zur Antwort die passende Frage finden (Bonus) */
async function surpriseRound(foe,cur){const ks=[...new Set((POOLS[cur.t]?[cur.t]:Object.keys(POOLS)))];let cand=shuffle(Object.keys(POOLS).flatMap(k=>POOLS[k].map(x=>Object.assign({t:k},x))));
  const tgt=cand.find(x=>x.a!==cur.a&&x.t===cur.t)||cand[0];const others=shuffle(cand.filter(x=>x!==tgt&&x.t!==tgt.t)).slice(0,2);
  await lines([['jaeger','STOPP! Spontanes Experiment: Rollentausch! '+(PEOPLE[foe]?PEOPLE[foe].n:'Der Gegner')+' gibt eine Antwort – und du findest die passende Frage dazu. Bonuspunkt!'],['eisele','Jeopardy auf Seminar-Island. Ich wusste, dass er das irgendwann macht.'],[foe,'„'+tgt.c+'“']]);
  const opts=shuffle([[tgt.a,true]].concat(others.map(x=>[x.a,false])));const a=await choose('du','Welche Frage gehört zu dieser Antwort?',opts.map(x=>x[0]));
  if(opts[a][1]){sfx('clang');toast('BONUS-TOUCHÉ!');stat(tgt.t,1);await say('jaeger','Jaaa! Rückwärts gedacht ist doppelt gelernt. Das probier ich nächste Sitzung mit allen aus!');return 0.5}
  sfx('bad');stat(tgt.t,0);await say('jaeger','Knapp daneben – aber hey, Experimente dürfen scheitern! Die Frage war: '+tgt.a);return 0}
function pool(keys,n){let all=[];keys.forEach(k=>{if(POOLS[k])all=all.concat(POOLS[k].map(x=>Object.assign({t:k},x)))});return shuffle(all).slice(0,n)}

     ['U = R · I.','Das ist das Ohmsche Gesetz. Schön, aber falsche Insel.']]}],
/* ---------- Ψ7 Gewalt und Mobbing ---------- */
ge:[
 {a:'Einer gegen viele, seit Monaten, im Klassenchat. Mobbing oder nur ein Streit?',
  c:'Mobbing nach Olweus: wiederholt, über längere Zeit, mit Schadensabsicht und Machtungleichgewicht.',
  w:[['Ein normaler Streit unter Gleichstarken.','Einer gegen viele über Monate ist kein Streit unter Gleichstarken. Machtungleichgewicht = Mobbing.'],
     ['Nur Mobbing, wenn es körperlich wird.','Auch verbale, relationale und Cyberattacken zählen. Entscheidend: Dauer, Wiederholung, Machtungleichgewicht.']]},
 {a:'Die Klassenlehrerin will Täter und Opfer zur Mediation an einen Tisch setzen. Gute Idee?',
  c:'Nein. Mediation braucht Machtgleichgewicht und Freiwilligkeit. Bei Mobbing ist das ein klassischer Fallstrick.',
  w:[['Ja, Reden hilft immer.','Das Opfer wäre erneut unterlegen, Rache wird wahrscheinlicher. Mediation nur bei Gleichstarken.'],
     ['Ja, aber nur vor der ganzen Klasse.','Noch schlimmer: Das Opfer wird bloßgestellt und als „Petze“ markiert.']]},
 {a:'No Blame oder Farsta: Bei welcher Methode wird niemand beschuldigt?',
  c:'Beim No-Blame-Approach: Unterstützergruppe ohne Schuldzuweisung, jeder macht einen Ich-Vorschlag.',
  w:[['Bei Farsta.','Farsta ist konfrontativ: Täter im Fokus, unangekündigte Einzelgespräche.'],
     ['Bei der Mediation.','Mediation ist bei Mobbing ungeeignet. Ohne Schuldzuweisung arbeitet No Blame.']]},
 {a:'Er fällt durch die Zwischenprüfung und schlägt danach seinen Kumpel. Theorie, bitte!',
  c:'Frustrations-Aggressions-Theorie, revidiert: Frust erzeugt Aggressionsbereitschaft, dazu Verschiebung auf ein Ersatzziel.',
  w:[['Klassische Konditionierung.','Hier wird nichts gekoppelt. Frustration erzeugt Aggressionsbereitschaft, die auf einen Unbeteiligten verschoben wird.'],
     ['Frustration führt immer und automatisch zu Aggression.','Das ist die Urfassung von 1939. Die Revision sagt: nur eine Bereitschaft, abhängig von Hinweisreizen und Bewertung.']]},
 {a:'Boxsack in die Werkstatt – Dampf ablassen senkt die Aggression. Oder?',
  c:'Nein. Die Katharsis-These ist widerlegt, Abreagieren kann Aggression sogar steigern.',
  w:[['Ja, das ist bewiesene Katharsis.','Empirisch widerlegt. Besser: Frustration vermeiden, Alternativen und Frustrationstoleranz trainieren.'],
     ['Ja, wenn es Musik dazu gibt.','Musik macht es netter, aber die Katharsis-These bleibt widerlegt.']]},
 {a:'Prügelei neben dem offenen Verteiler, alle filmen. Was tust du zuerst?',
  c:'Laut und klar stoppen, Gefahr bannen (Not-Aus), Hilfe holen, trennen. Die Schuldfrage kläre ich später.',
  w:[['Erst mal klären, wer angefangen hat.','Keine Schuldfrage vor Ort. Erst stoppen, sichern, trennen, versorgen.'],
     ['Auch filmen – zur Beweissicherung.','Bitte nicht. Eingreifen ist Pflicht, Filmen beenden, Persönlichkeitsrechte schützen.']]},
 {a:'Wer lacht und anfeuert, aber nicht selbst mitmacht, ist laut Salmivalli …?',
  c:'… ein Verstärker. Wer schweigt, ist Außenstehender – Schweigen wirkt als Zustimmung.',
  w:[['… ein Verteidiger.','Verteidiger helfen dem Opfer. Lachen und Anfeuern verstärkt den Täter.'],
     ['… unbeteiligt.','Wer lacht, verstärkt. Mobbing ist ein Gruppenphänomen.']]}],
/* ---------- Ψ8 Lehrerbelastung ---------- */
lb:[
 {a:'Sie plant bis nachts, will alles perfekt, kann nicht abschalten und ist trotzdem unzufrieden. AVEM-Muster?',
  c:'Risikomuster A – Selbstüberforderung: überhöhtes Engagement, geringe Distanzierung, wenig Erfolgserleben.',
  w:[['Muster G – sie ist doch engagiert.','G hat hohes, aber nicht überhöhtes Engagement und gute Distanzierung. Ihr fehlt die Distanzierung.'],
     ['Muster B – Burnout.','Bei B ist das Engagement verringert. Ihres ist überhöht: Muster A. Die Gefahr ist der Übergang zu B.']]},
 {a:'Geringes Engagement, stärkste Distanzierung, tiefenentspannt. Das ist doch gesund?',
  c:'Das ist Muster S, Schonung. Achtung: Oft steckt ein Rückzug aus unbefriedigender Arbeit dahinter.',
  w:[['Muster G – der Gesündeste von allen.','G verbindet Engagement mit Distanzierung. Geringes Engagement plus Distanz ist S.'],
     ['Muster A.','A ist das Gegenteil: überhöhtes Engagement, kaum Distanz.']]},
 {a:'Lazarus sagt: Der Unterrichtsbesuch macht Stress. Stimmt’s?',
  c:'Nicht der Besuch selbst. Stress entsteht durch meine Bewertung als Bedrohung und die Einschätzung, meine Ressourcen reichen nicht.',
  w:[['Ja, der Reiz ist der Stress.','Das wäre ein reines Reizmodell. Transaktional heißt: Wechselwirkung aus Situation und Bewertung.'],
     ['Nein, Stress kommt nur von der Klassengröße.','Klassengröße belastet, aber Stress entsteht laut Lazarus aus der Bewertung.']]},
 {a:'Belastung und Beanspruchung – das ist doch dasselbe, du Haarspalter!',
  c:'Nach Rudow nicht: Belastung ist objektiv und für alle gleich, Beanspruchung ist die individuelle Wirkung.',
  w:[['Stimmt, das sind Synonyme.','Gerade die Unterscheidung erklärt, warum dieselbe Klasse den einen anregt und die andere erschöpft.'],
     ['Beanspruchung ist objektiv, Belastung subjektiv.','Genau umgekehrt: Belastung objektiv, Beanspruchung individuell.']]},
 {a:'Wie hoch ist der Anteil der Risikomuster A und B bei Lehrkräften in der Potsdamer Studie ungefähr?',
  c:'Rund 60 Prozent – mehr als in allen Vergleichsberufen.',
  w:[['Etwa 10 Prozent.','Schön wär’s. Es sind etwa 60 Prozent – höher als bei Polizei, Pflege oder Strafvollzug.'],
     ['Etwa 25 Prozent, wie bei der Feuerwehr.','Die Feuerwehr liegt bei rund 25 Prozent. Lehrkräfte bei etwa 60.']]},
 {a:'Was ist laut Schaarschmidt die stärkste Entlastung?',
  c:'Selbstwirksamkeitserfahrung und ein gutes soziales Klima mit Kollegium und Schulleitung.',
  w:[['Mehr Ferien.','Ferien helfen, aber die stärksten Entlastungsfaktoren sind Selbstwirksamkeit und soziales Klima.'],
     ['Mehr Deputatsstunden.','Die Zahl der Deputatsstunden gehört zu den stärksten BElastungen.']]},
 {a:'Was ist bei Risikomuster A vorrangig zu tun?',
  c:'Überhöhte Ansprüche korrigieren, den Stellenwert der Arbeit relativieren, Arbeitsorganisation ändern, Unruhe abbauen.',
  w:[['Emotional stabilisieren und Selbstvertrauen stärken.','Das steht bei Muster B im Vordergrund. Bei A geht es um Ansprüche und Distanzierung.'],
     ['Noch mehr Engagement zeigen.','Dann brennt die Kerze an beiden Enden noch schneller.']]}],
/* ---------- P1 Unterrichtsplanung ---------- */
up:[
 {a:'Ich plane meine Stunde ab dem Arbeitsblatt. Ist doch effizient!',
  c:'Niemand kauft zuerst die Fliesen: Klären, Entscheiden, Gestalten, Evaluieren. Medien sind nie der Ausgangspunkt.',
  w:[['Ja, das Material steht im Zentrum der Planung.','Medien sind nie Selbstzweck und nie Ausgangspunkt. Erst klären, dann Ziele, dann gestalten.'],
     ['Ich plane einfach vom Ende her: Evaluieren, Gestalten, Klären.','Evaluieren kommt nach der Stunde. Die Reihenfolge: Klären, Entscheiden, Gestalten, Evaluieren.']]},
 {a:'Mein Lernziel: „Die Schüler sollen PV verstehen.“ Präziser geht’s nicht!',
  c:'„Verstehen“ ist nicht beobachtbar. Präzise heißt: Inhalt, Bedingung und beobachtbares Verb – etwa „anhand eines Datenblatts berechnen“.',
  w:[['Doch, verstehen ist ein starkes Verb.','Stark, aber unsichtbar. Präzise Verben: berechnen, unterscheiden, aufzählen.'],
     ['Dann schreib ich: „sollen PV wirklich verstehen“.','Das „wirklich“ macht es nicht beobachtbar. Inhalt – Bedingung – Lernhandeln.']]},
 {a:'Wie komme ich vom Hauptziel zu Teilzielen, ohne mich zu verzetteln?',
  c:'Zienern: „Was kann jemand, der … kann?“',
  w:[['Ich frage die Schüler, was sie gerne lernen würden.','Mitbestimmung ist schön, aber die Technik nach Gerhard Ziener ist: „Was kann jemand, der … kann?“'],
     ['Ich nehme einfach das Inhaltsverzeichnis des Buchs.','Das liefert Themen, keine Teilziele. Zienern macht den roten Faden sichtbar.']]},
 {a:'„Eine Aderendhülse fachgerecht verpressen.“ Welcher Lernzielbereich?',
  c:'Psychomotorisch.',
  w:[['Affektiv.','Affektiv betrifft Einstellungen und Werte, zum Beispiel die Bereitschaft, Sicherheitsregeln einzuhalten.'],
     ['Kognitiv.','Kognitiv wäre: berechnen, begründen. Verpressen ist Handfertigkeit.']]},
 {a:'Welcher Einstieg legt die Karten auf den Tisch?',
  c:'Der informierende Einstieg nach Grell: Transparenz, maximal etwa vier Minuten.',
  w:[['Der problemorientierte Einstieg.','Der weckt Aufmerksamkeit über ein Problem. „Karten auf den Tisch“ ist der informierende Einstieg.'],
     ['Der Einstieg mit Lernsituation.','Der arbeitet mit einem beruflichen Problem und Lernprodukt. Transparenz pur: informierend.']]},
 {a:'Anderson und Krathwohl: Was ist daran wirklich prüfungsrelevant?',
  c:'Die Struktur: sechs Stufen von einfach nach komplex, höhere setzen niedrigere voraus – dazu der Bezug zu den Wissensarten.',
  w:[['Alle sechs Stufen samt Unterbegriffen auswendig.','Laut Skript zählt die Struktur, nicht jede Einzelstufe.'],
     ['Dass es drei Stufen sind: Reproduktion, Transfer, Reflexion.','Das sind die drei Anforderungsbereiche nach EPA. Anderson und Krathwohl: sechs Stufen.']]}],
/* ---------- P2 Unterrichtsmethoden ---------- */
um:[
 {a:'„Was passiert bei unterbrochenem N, wer weiß warum, und wie misst man das?“ Keiner meldet sich. Warum bloß?',
  c:'Kettenfrage plus zu kurze Wartezeit. Eine weite Frage stellen und drei bis acht Sekunden warten.',
  w:[['Die Klasse ist einfach faul.','Stabile Personattribution! Die Frage war eine Kettenfrage, und die Wartezeit fehlte.'],
     ['Die Frage war zu weit gestellt.','Weite Fragen sind gut. Das Problem war: drei Fragen auf einmal und kaum Wartezeit.']]},
 {a:'Ich wiederhole jeden Schülerbeitrag schön aufpoliert. Das ist doch aktives Zuhören!',
  c:'Das ist Lehrerecho. Die Schüler hören einander nicht mehr zu. Ausnahme: Fremdsprachenunterricht.',
  w:[['Ja, Spiegeln ist immer gut.','Aktives Zuhören spiegelt Gefühle in Problemsituationen. Lehrerecho poliert Antworten – und alle hören nur noch dir zu.'],
     ['Ja, das sichert die Ergebnisse.','Ergebnissicherung heißt mitschreiben und visualisieren, nicht nachsprechen.']]},
 {a:'Wie lang darf ein Lehrervortrag ungefähr sein?',
  c:'Etwa 5 bis 20 Minuten, je nach Klasse – mit sichtbarer Struktur und Ergebnissicherung.',
  w:[['Eine Doppelstunde, wenn er gut ist.','Selbst der beste Vortrag sprengt das Arbeitsgedächtnis. 5 bis 20 Minuten.'],
     ['Maximal 60 Sekunden.','So kurz muss es nicht sein. 5 bis 20 Minuten, strukturiert und aktivierend.']]},
 {a:'Wo liegt das Problem beim fragend-entwickelnden Unterricht?',
  c:'Die Schüler werden in die Denkbahnen der Lehrkraft gezwungen, es fehlt ein Spannungsbogen, und Erarbeitetes wird schnell vergessen.',
  w:[['Er dauert immer zu kurz.','Eher zu lang. Das Kernproblem: Schüler denken in den Bahnen der Lehrkraft.'],
     ['Es gibt keine Rückmeldung, ob alle mitdenken.','Doch, die laufende Rückmeldung ist gerade ein Vorzug. Nachteil: fremde Denkbahnen, schnelles Vergessen.']]},
 {a:'Was gehört in einen guten Arbeitsauftrag?',
  c:'Was tun, Zeit, Sozialform, Hilfsmittel, Ergebnisform, Präsentation – schriftlich und sichtbar.',
  w:[['Ein lustiges Clipart-Bildchen zur Auflockerung.','Aufmerksamkeit ist das wertvollste Gut. Kein Schmuck, sondern W-Z-S-H-E-P.'],
     ['Nur mündlich, das ist flexibler.','Nur ausnahmsweise mündlich. Sichtbar lassen und wiederholen lassen.']]},
 {a:'Wie lange soll ich nach einer schweren Frage warten?',
  c:'Etwa acht Sekunden, bei leichten Fragen drei. Bei Schweigen nachfragen statt umformulieren.',
  w:[['Eine Sekunde, dann beantworte ich sie selbst.','So lernt die Klasse: Warten lohnt sich. Drei bis acht Sekunden aushalten.'],
     ['Bis zur Pause.','Ambitioniert. Acht Sekunden reichen bei schweren Fragen.']]}],
/* ---------- P3 Grundlagen der Leistungsmessung ---------- */
lm:[
 {a:'Meine Klassenarbeit misst vor allem, wer schnell lesen kann. Ist sie trotzdem valide?',
  c:'Nein. Valide heißt: Sie misst, was sie messen soll. Die Sprache darf die Fachleistung nicht verdecken.',
  w:[['Ja, solange sie objektiv ist.','Objektivität allein reicht nicht. Misst sie Lesegeschwindigkeit statt Elektrotechnik, ist sie nicht valide.'],
     ['Ja, Lesen gehört doch dazu.','Gefragt war Fachleistung. Sprache als Hürde verfälscht die Messung.']]},
 {a:'Anzug und selbstbewusst: 1,3. Zerknittertes Shirt, gleiche Leistung: 2,7. Welcher Fehler?',
  c:'Halo-Effekt – ein Merkmal überstrahlt das Urteil. Gegenmittel: Kriterienraster vorab, Merkmale getrennt bewerten.',
  w:[['Primacy-Effekt.','Primacy meint: Der Anfang prägt das Urteil. Hier überstrahlt das Auftreten alles: Halo.'],
     ['Milde-Fehler.','Milde wäre systematisch zu gut für alle. Hier färbt ein Merkmal das Urteil: Halo.']]},
 {a:'Diagnostisch, formativ, summativ – welche Beurteilung steuert den Lernprozess, meist ohne Note?',
  c:'Die formative, während des Lernens.',
  w:[['Die summative.','Summativ bilanziert am Ende und wird benotet.'],
     ['Die diagnostische.','Diagnostisch erhebt die Voraussetzungen vor dem Lernen.']]},
 {a:'Kommt jeder Prüfer zum selben Ergebnis? Wie heißt dieses Gütekriterium?',
  c:'Objektivität – gesichert durch Erwartungshorizont und Punkteschema vorab.',
  w:[['Reliabilität.','Reliabilität fragt nach Zuverlässigkeit und Messgenauigkeit. Prüferunabhängig ist Objektivität.'],
     ['Validität.','Validität fragt, ob gemessen wird, was gemessen werden soll.']]},
 {a:'Er verbessert sich von 25 auf 15 Fehler und bleibt bei der Note 6. Welche Bezugsnorm zeigt den Fortschritt?',
  c:'Nur die individuelle Bezugsnorm.',
  w:[['Die sachliche.','Sachlich bleibt es eine 6 – mehr als 10 Fehler.'],
     ['Die soziale.','Sozial ist er vielleicht besser als der Zweitschwächste, aber den Fortschritt zeigt nur die individuelle.']]},
 {a:'Nenne mindestens vier Funktionen der Notengebung!',
  c:'Rückmeldung, Motivation, Berechtigung bzw. Selektion, Diagnose und Steuerung – dazu Sozialisation.',
  w:[['Strafe, Strafe, Strafe und Kontrolle.','Disziplinierung ist eine (problematische) Funktion. Es gibt mehr: Rückmeldung, Motivation, Selektion, Diagnose.'],
     ['Objektivität, Reliabilität, Validität.','Das sind Gütekriterien, keine Funktionen.']]}],
/* ---------- P4 schriftliche und mündliche Leistungsbewertung ---------- */
lw:[
 {a:'„Bei Ihrer Kollegin hätte ich eine 2 bekommen!“ Was sagt das Recht dazu?',

 {a:'Lernförderliches Feedback hat drei Fragen. Welche?',

  w:[['Gut? Schlecht? Note?','Das ist ein Urteil, kein Navi. Feed Up, Feed Back, Feed Forward.'],

 {a:'„Du bist halt schlau.“ Auf welcher Feedback-Ebene, und taugt das?',
  c:'Auf der Personebene – wenig lernwirksam. Besser: Aufgabe, Prozess, Selbstregulation.',

 {a:'„Ich sag doch was – warum immer eine 4?“ Wie verteidigst du die mündliche Note?',
  c:'Kriterien transparent (Qualität vor Quantität), zeitnah dokumentiert. Belege zeigen und ein Entwicklungsziel vereinbaren.',
  w:[['„Weil ich das so sehe.“','Das ist nicht transparent. Kriterien offenlegen und Dokumentation zeigen.'],

 {a:'Darf ich eine Gruppennote für alle geben?',
  c:'Nein. Leistungen werden individuell beurteilt.',
  w:[['Ja, das fördert den Teamgeist.','Den sucker effect fördert es auch. Beurteilt wird individuell.'],
     ['Ja, wenn alle zustimmen.','Auch dann nicht. Individuelle Beurteilung.']]},
 {a:'Womit kann ich nach § 9 NVO eine Klassenarbeit ersetzen?',
  c:'Mit einer gleichwertigen Feststellung von Schülerleistungen – einer GFS, etwa Referat oder Projekt.',
  w:[['Mit einem Gespräch über das Wetter.','Das wäre keine gleichwertige Leistungsfeststellung. GFS: Referat, Projekt, Präsentation.'],
     ['Gar nicht, Klassenarbeit ist Pflicht.','Nach § 9 Abs. 6 NVO ist eine GFS möglich – Ausbildungs- und Prüfungsordnungen bleiben unberührt.']]}],
/* ---------- P5 Sprache ---------- */
sp:[
 {a:'Ein vereinfachter Text? Das ist doch Niveauverlust!',
  c:'Nein. Ich vereinfache die Sprache um das Fach herum, Fachbegriffe bleiben und werden erklärt. Das erhöht die Validität.',
  w:[['Stimmt, deshalb vereinfache ich auch die Aufgaben.','Gerade nicht. Die Aufgabe bleibt gleich. Nur der sprachliche Zugang wird leichter.'],
     ['Stimmt, aber den Schwachen ist das egal.','Es geht um Teilhabe und Validität: Elektrotechnik messen, nicht Lesegeschwindigkeit.']]},
 {a:'Was mache ich mit „Blitzstromableiterkombination“?',
  c:'Mit Bindestrichen gliedern – „Blitzstrom-Ableiter-Kombination“ – und den Begriff erklären, nicht streichen.',
  w:[['Streichen, braucht eh keiner.','Fachbegriffe bleiben. Sie werden gegliedert und erklärt.'],

 {a:'Woher kommt die Idee der Textvereinfachung?',
  c:'Aus der People-First-Bewegung in den USA der 1960er – für Teilhabe ohne fremde Hilfe.',

 {a:'Textoptimierung oder sprachsensibler Fachunterricht: Was ist punktuell, was systematisch?',

 {a:'Nenne die vier Ebenen der Vereinfachungsregeln!',

 {a:'Welche drei Varianten gibt es, mit vereinfachten Texten zu arbeiten?',
  c:'Ein optimierter Text für alle; der gleiche Text in zwei Niveaus; verschiedene Texte auf verschiedenen Niveaus.',
  w:[['Vorlesen, abschreiben, auswendig lernen.','Das sind Arbeitstechniken. Gefragt waren die drei Einsatzvarianten.'],

 {a:'Womit beginnt die Planung eines Lehr-Lern-Arrangements?',

  w:[['Mit der Methode, die mir am meisten Spaß macht.','„Ich plane eine LdL-Einheit“ ist der falsche Anfang. Erst Thema und Ziele.'],

 {a:'Was folgt in Freys Projektmethode auf die Projektinitiative?',

/* ---------- P7 Erziehungsauftrag ---------- */
ea:[
 {a:'„Sie sind nicht mein Erziehungsberechtigter!“ Recht hat er, oder?',
  c:'Nein. Der Erziehungsauftrag der Schule steht in § 1 Abs. 2 SchG BW und gilt auch für Azubis.',
  w:[['Stimmt, ab 18 ist Schluss mit Erziehung.','Der Erziehungs- und Bildungsauftrag nach § 1 SchG gilt unabhängig vom Alter.'],
     ['Stimmt, das macht der Betrieb.','Berufsschule und Betrieb haben einen gemeinsamen Bildungsauftrag.']]},
 {a:'Unter welchen drei Bedingungen verhalten sich Jugendliche sozial, laut Hanisch?',
  c:'Altruistische Selbstzuschreibung, Vorbilder, einschneidende Erlebnisse.',
  w:[['Strafe, Belohnung, Kontrolle.','Das wäre die operante Brille. Hanisch: Selbstzuschreibung, Vorbilder, Erlebnisse.'],
     ['Autonomie, Kompetenz, Eingebundenheit.','Das ist Deci & Ryan. Hanisch: S-V-E.']]},
 {a:'Was ist das zentrale Ziel der Berufsschule?',
  c:'Umfassende Handlungskompetenz: Fach-, Selbst- und Sozialkompetenz.',
  w:[['Gute Noten in der Klassenarbeit.','Die sind schön, aber das Ziel ist Handlungskompetenz.'],
     ['Pünktlichkeit.','Wäre bei Justin ein Anfang. Ziel ist aber umfassende Handlungskompetenz.']]},
 {a:'Freiheiten und klare Regeln, Konsequenzen ohne Moralpredigt. Welches Erziehungsmuster?',
  c:'Coach.',
  w:[['Fürsorge.','Fürsorge überzeugt und diskutiert ausführlich. Freiheit plus klare Regeln: Coach.'],
     ['Entspannung.','Entspannung hat wenig Regeln. Hier gibt es klare Regeln: Coach.']]},
 {a:'Wie viele schätzen ihr Selbstbild laut Seminar zu positiv ein?',
  c:'Etwa 35 Prozent. Deshalb hole ich Fremdfeedback ein.',
  w:[['Niemand, Lehrkräfte sind sehr selbstkritisch.','Leider nicht. Etwa 35 Prozent überhöhen ihr Selbstbild.'],
     ['Etwa 90 Prozent.','So schlimm ist es nicht. Rund 35 Prozent, 50 realistisch, 15 zu negativ.']]}],
/* ---------- P8 Inklusion ---------- */
in:[
 {a:'Wann ist ein Mensch laut SGB IX behindert?',
  c:'Wenn körperliche Funktion, geistige Fähigkeit oder seelische Gesundheit mit hoher Wahrscheinlichkeit länger als sechs Monate vom alterstypischen Zustand abweichen und dadurch die Teilhabe beeinträchtigt ist.',
  w:[['Wenn ein Arzt es sagt.','Die Definition stellt auf Abweichung, mehr als sechs Monate und Teilhabe ab.'],
     ['Wenn die Abweichung länger als vier Wochen dauert.','Es sind sechs Monate.']]},
 {a:'Nachteilsausgleich heißt doch: leichtere Aufgaben, oder?',
  c:'Nein. Er ändert die äußeren Bedingungen – Zeit, Pausen, Raum, Hilfsmittel –, nicht das Anforderungsniveau. Und nur auf Antrag.',
  w:[['Ja, damit es gerechter wird.','Gerechter ja, leichter nein. Das Anforderungsniveau bleibt gleich.'],
     ['Ja, und ohne Antrag automatisch.','Doppelt falsch. Gleiches Niveau, und ohne Antrag keine Unterstützung.']]},
 {a:'BVE- und KoBV-Klassen an beruflichen Schulen: Integration oder Inklusion?',
  c:'Integration: eingebunden, aber als eigene Gruppe.',
  w:[['Inklusion.','Inklusion hieße: Die Umgebung passt sich allen an, ohne eigene Gruppe.'],
     ['Separation.','Separation wäre ein abgetrennter Lebensbereich. BVE und KoBV sind an der Berufsschule: Integration.']]},
 {a:'Zielgleich, zieldifferent, niveaudifferenziert: Was ist das AVdual?',
  c:'Niveaudifferenziert. Niveaustufen und Abschlüsse sind im Bildungsplan bereits vorgesehen.',
  w:[['Zielgleich.','Zielgleich hieße: alle derselbe Abschluss.'],
     ['Zieldifferent.','Zieldifferent sind verschiedene Abschlüsse, teils mit verschiedenen Plänen. Im AVdual sind die Niveaus eingeplant.']]},
 {a:'Ein Schüler mit ADHS. Welcher Förderbedarf nach den drei Säulen?',
  c:'Besonderer Förderbedarf: zielgleich, pädagogische Maßnahmen im Vordergrund, Nachteilsausgleich möglich.',
  w:[['Anspruch auf ein sonderpädagogisches Bildungsangebot.','Das betrifft etwa geistige Behinderung, ggf. zieldifferent.'],
     ['Gar keiner, ADHS gibt es nicht.','Doch. ADHS fällt unter den besonderen Förderbedarf.']]},
 {a:'Was ist eine Berufswegekonferenz?',
  c:'Die Planung des Übergangs bei Anspruch auf ein sonderpädagogisches Bildungsangebot – mit Schüler, Eltern, Integrationsfachdienst, Agentur für Arbeit und Lehrkräften.',
  w:[['Eine Konferenz über die Wegbeschreibung zur Schule.','Charmant. Es geht um den Übergang in Ausbildung und Beruf.'],
     ['Eine Notenkonferenz.','Es geht um die einvernehmliche Planung des Übergangs, inklusive Kosten.']]}],
/* ---------- P9 Schulentwicklung ---------- */
se:[
 {a:'Schlechtes Schülerfeedback – ab in die Schublade, oder?',
  c:'Helmke: Information – Rezeption – Reflexion – Aktion – Evaluation. Ich lasse es nicht versickern.',
  w:[['Ja, Schüler haben eh keine Ahnung.','Das ist der Anfang vom blinden Fleck. Feedback ist Information, die reflektiert werden will.'],
     ['Ich frage einfach nie wieder.','Dann fehlt die Evaluation. Nach einigen Wochen erneut fragen.']]},
 {a:'Selbstevaluation und Individualfeedback – ist doch dasselbe!',
  c:'Nein. Selbstevaluation richtet sich an die ganze Schule, Individualfeedback an die einzelne Lehrkraft.',
  w:[['Stimmt, beides ist für mich.','Selbstevaluation fördert institutionelles Lernen („Wir und unsere Schule“).'],
     ['Individualfeedback ist für die Schulleitung.','Individualfeedback ist für die einzelne Lehrkraft.']]},
 {a:'Was macht eine gute Schule aus – vor allem mehr Geld?',
  c:'Kaum. Entscheidend sind guter Unterricht, zielbewusste Leitung, Feedbackkultur und Kooperation im Kollegium.',
  w:[['Ja, Ausstattung ist alles.','Klassengröße, Ausstattung und Geld spielen kaum eine Rolle – außer bei Technik für Medienziele.'],
     ['Möglichst wenig Regeln.','Gute Schulen haben ausgehandelte, konsequente Regeln.']]},
 {a:'Wie funktioniert OES an beruflichen Schulen?',
  c:'Als Qualitätskreis: Leitbild, Selbstevaluation, Ziele und Maßnahmen, Umsetzung, Fremdevaluation, Zielvereinbarung mit dem RP.',
  w:[['Einmal Leitbild schreiben, fertig.','Es ist ein Kreislauf, kein Einmal-Projekt.'],
     ['OES heißt: Ohne Evaluation Schlafen.','Witzig. Es heißt „Operativ eigenständige Schule“.']]},
 {a:'Wie bringe ich das Kollegium dazu, mitzuziehen?',
  c:'Sense-making statt Erlass: Nutzen zeigen, mit wenigen anfangen, viele mitnehmen – mit Rückendeckung der Leitung.',
  w:[['Per Rundmail mit Fristsetzung.','Haltungen lassen sich nicht verordnen.'],
     ['Allein machen, dann staunen die.','Mit wenigen anfangen, aber nicht elitär. Viele mitnehmen.']]}]
};

const CASES={
 up:{t:'Unterrichtsplanung',fach:'eisele',v:'Eine Kollegin plant: „Ich zeige einen 20-minütigen Film über Photovoltaik, dann diskutieren wir.“ Auf die Frage nach dem Ziel sagt sie: „Die Schüler sollen PV verstehen.“',
  q:[['Welche Nachfrage hilft Ihnen am meisten?',[['Was sollen die Schüler am Ende der Stunde konkret können, und woran sieht man das?',true,'Genau – damit klären Sie das Hauptziel und die Lern-Evaluation.'],['Wie lang ist der Film genau, auf die Sekunde?',false,'Detailverliebt, aber das Problem liegt beim Ziel, nicht bei der Filmlänge.'],['Hat der Film schöne Musik?',false,'Herr Eisele hebt eine Augenbraue. Medien sind nicht der Ausgangspunkt.']]],
   ['Wie analysieren Sie die Planung?',[['Das Ziel ist nicht beobachtbar, und die Planung geht vom Medium aus statt von Klären und Entscheiden.',true,'Sehr gut: Planungsinstrument und präzise Lernziele.'],['Der Film ist zu modern für Berufsschüler.',false,'Das Problem ist nicht die Modernität, sondern der fehlende Zielbezug.'],['Diskussion ist nie sinnvoll.',false,'Diskussion kann sinnvoll sein – wenn sie einem Ziel dient.']]],
   ['Was schlagen Sie vor?',[['Hauptziel präzisieren (z. B. Ertrag anhand eines Datenblatts abschätzen), Teilziele zienern, Film auf fünf Minuten mit Beobachtungsauftrag kürzen, Ergebnissicherung einplanen.',true,'Herr Eisele schiebt die Brille hoch: „Erstens gut, zweitens sehr gut, drittens: Feierabend für heute.“'],['Den Film einfach zweimal zeigen.',false,'Doppelte Dosis, gleiches Problem.'],['Lieber gar keine Medien mehr einsetzen.',false,'Medien sind nicht verboten – nur nicht der Ausgangspunkt.']]],
   ['Welcher Querbezug zur Pädagogischen Psychologie passt?',[['Mehrspeichermodell: 20 Minuten Film ohne Auftrag überlasten das Arbeitsgedächtnis. Ein Beobachtungsauftrag lenkt die Aufmerksamkeit.',true,'Dr. Jäger wippt zufrieden mit dem Zopf.'],['Mobbing nach Olweus.',false,'Da müsste schon der Film gemobbt werden.'],['Das AVEM-Muster der Kollegin.',false,'Interessant, aber hier geht es um das Lernen der Schüler.']]]]},
 um:{t:'Unterrichtsmethoden',fach:'eisele',v:'Herr B. fragt im Unterricht: „Was passiert, wenn der Neutralleiter unterbrochen ist, und wer weiß, warum, und wie misst man das?“ Niemand meldet sich. Nach zwei Sekunden beantwortet er die Frage selbst. Danach wiederholt er jede Schülerantwort sprachlich verbessert.',
  q:[['Was würden Sie zuerst nachfragen?',[['Welches Ziel verfolgt Herr B. mit dem Unterrichtsgespräch an dieser Stelle?',true,'Gut – Ziel und Transparenz sind die Basis des FEU.'],['Ob die Schüler ausgeschlafen waren.',false,'Mag sein, aber zuerst zum Gesprächsverhalten der Lehrkraft.'],['Welche Farbe der Neutralleiter hat.',false,'Blau. Und jetzt zurück zur Didaktik.']]],
   ['Wie analysieren Sie?',[['Kettenfrage, zu kurze Wartezeit und Lehrerecho. Die Schüler lernen, dass Warten sich lohnt und sie einander nicht zuhören müssen.',true,'Präzise mit Fachbegriffen.'],['Die Klasse ist einfach leistungsschwach.',false,'Stabile Personattribution – genau das, was erfolgreiche Lehrkräfte vermeiden.'],['Das ist ein Mobbingfall.',false,'Nein, hier geht es um Gesprächsführung.']]],
   ['Was raten Sie ihm?',[['Eine weite Frage stellen, drei bis acht Sekunden warten, eventuell kurz Partnerarbeit, streuen, qualifizierend rückmelden statt nachzusprechen, Ergebnis an der Tafel sichern.',true,'Herr Eisele schreibt es auf. In ordentlichen Spiegelstrichen. Mit Smiley.'],['Er soll die Antworten gleich selbst an die Tafel schreiben.',false,'Dann denkt nur einer: Herr B.'],['Er soll lauter fragen.',false,'Lautstärke ersetzt keine Wartezeit.']]],
   ['Welcher Querbezug passt?',[['Mehrspeichermodell und Motivation: drei Fragen auf einmal überlasten das Arbeitsgedächtnis; Erfolgserlebnisse im Gespräch stärken die Erfolgszuversicht.',true,'Dr. Jäger: „Sehr schön vernetzt.“'],['Lehrergesundheit: Herr B. ist sicher Muster S.',false,'Unterstellung ohne Daten. Bleiben Sie beim Fall.'],['Gewaltprävention.',false,'Hier fliegen nur Fragen, keine Fäuste.']]]]},
 lm:{t:'Grundlagen der Leistungsmessung',fach:'eisele',v:'Eine Lehrerin bewertet die Präsentation eines Schülers, der im Anzug erscheint und sehr selbstbewusst spricht, mit 1,3 – obwohl zwei fachliche Fehler vorkamen. Ein stiller Schüler im zerknitterten Shirt bekommt für einen fachlich gleichwertigen Vortrag eine 2,7.',
  q:[['Welche Nachfrage stellen Sie?',[['Gab es vorab ein Bewertungsraster mit Kriterien und Gewichtung?',true,'Genau – daran hängen Objektivität und Transparenz.'],['Welche Marke hatte der Anzug?',false,'Herr Eisele schmunzelt. Irrelevant – und genau das ist der Punkt.'],['Wie lange kennt sie die Schüler schon?',false,'Kann eine Rolle spielen, ist aber nicht die zentrale Frage.']]],
   ['Wie analysieren Sie?',[['Halo-Effekt (Auftreten überstrahlt Fachlichkeit), eventuell Sympathie und logischer Fehler. Die Validität ist verletzt, weil nicht die Fachleistung gemessen wird.',true,'Sauber: Beurteilungsfehler plus Gütekriterium.'],['Recency-Effekt.',false,'Recency meint: Das Ende prägt das Urteil. Hier überstrahlt ein Merkmal alles.'],['Das ist die individuelle Bezugsnorm.',false,'Mit Bezugsnormen hat es wenig zu tun – es ist ein Wahrnehmungsfehler.']]],
   ['Was schlagen Sie vor?',[['Bewertungsbogen mit getrennten Kriterien (Fachlichkeit, Struktur, Vortrag) und Gewichtung vorab bekanntgeben, Fehler notieren, Urteil kriterienbezogen begründen.',true,'Transparenz und Objektivität. Lehrbuchreif.'],['Allen eine 2 geben, dann ist es gerecht.',false,'Zentrale Tendenz ist auch ein Beurteilungsfehler.'],['Kleiderordnung für Präsentationen einführen.',false,'Dann bewerten Sie wieder Kleidung. Kriterien statt Dresscode.']]],
   ['Welcher Querbezug passt?',[['Subjektive Wahrnehmung aus der Kommunikationspsychologie: Wahrnehmung ist selektiv – ähnlich der Eisberg-Logik.',true,'Dr. Jäger nickt: „Wahrnehmung ist konstruiert.“'],['Tuckmans Storming.',false,'Hier gibt es keine Gruppenphase.'],['Systematische Desensibilisierung.',false,'Die braucht hier niemand – höchstens die Lehrerin vor ihrem Raster.']]]]},
 lw:{t:'Schriftliche und mündliche Leistungsbewertung',fach:'eisele',v:'Ein Azubi beschwert sich bei der Rückgabe: „Ich habe überall was hingeschrieben und krieg nur 9 von 20 Punkten. Bei Ihrer Kollegin hätte ich eine 2 bekommen!“',
  q:[['Wie steigen Sie ein?',[['Ich höre zuerst zu und frage, bei welcher Aufgabe er die Bewertung nicht nachvollziehen kann.',true,'Aktiv zuhören und konkretisieren. Gut.'],['„Diskussion beendet. Nächster.“',false,'Das ist eine Kommunikationssperre und keine Transparenz.'],['„Dann geh doch zu der Kollegin.“',false,'Herr Eisele hüstelt: „Das war ein Witz, oder? Bitte sagen Sie mir, dass das ein Witz war.“']]],
   ['Wie begründen Sie die Bewertung?',[['Mit dem vorab erstellten Erwartungshorizont: Jeder Punkt ist begründbar. Nach § 7 NVO lege ich Kriterien offen. „Etwas hinschreiben“ erfüllt den Operator nicht automatisch.',true,'Rechtlich und fachlich sauber.'],['Mit meinem Bauchgefühl, das ist ja pädagogische Freiheit.',false,'Pädagogische Gesamtwertung heißt nicht Bauchgefühl.'],['Die Note ist eben streng, das Leben ist hart.',false,'Das erklärt nichts und belastet die Beziehung.']]],
   ['Was tun Sie pädagogisch?',[['Fehleranalyse mit ihm: Wo stehst du, was ist der nächste Schritt (Feed Forward)? Ich melde den Fortschritt individuell zurück und biete bei Zweifeln eine Zweitkorrektur an.',true,'Feedback-Navi plus Fairness.'],['Ich erhöhe die Note um einen Punkt, damit er Ruhe gibt.',false,'Das untergräbt die Objektivität.'],['Ich verweise ihn an die Schulleitung.',false,'Zu früh. Erst selbst erklären und Feedback geben.']]],
   ['Welcher Querbezug passt?',[['Attribution nach Weiner: Mit Prozessfeedback lenke ich die Ursache auf veränderbare Strategien statt auf „Pech mit der Lehrkraft“.',true,'Dr. Jäger: „Reattribution – schön.“'],['Mobbing durch die Kollegin.',false,'Da ist keine Mobbingstruktur.'],['Bandura: Er soll die Kollegin imitieren.',false,'Lustig, aber nicht zielführend.']]]]},
 sp:{t:'Sprache: Textvereinfachung',fach:'eisele',v:'Deine E2-Klasse soll einen Herstellertext zum Überspannungsschutz lesen. Drei Schüler mit Deutsch als Zweitsprache scheitern schon an „Blitzstromableiterkombination“. Ein Kollege meint: „In der Prüfung kriegen die auch keinen einfacheren Text.“',
  q:[['Was fragen Sie nach?',[['Was genau sollen die Schüler mit dem Text lernen – den fachlichen Kern oder das Lesen von Originaltexten?',true,'Das Ziel entscheidet über die Art der Vereinfachung.'],['Ob die drei überhaupt Deutsch können.',false,'Sie können Deutsch, nur Fachtexte sind schwer. Vorsicht mit Unterstellungen.'],['Ob der Hersteller einen anderen Text hat.',false,'Möglich, aber zuerst das Ziel klären.']]],
   ['Wie analysieren Sie?',[['Die Sprache verdeckt die Fachleistung. Das ist ein Validitätsproblem: Gemessen wird Lesekompetenz statt Elektrotechnik.',true,'Starke Verbindung zur Leistungsmessung.'],['Die drei sind unmotiviert.',false,'Sie scheitern am Wort, nicht an der Motivation.'],['Das ist kein pädagogisches Problem.',false,'Teilhabe ist ein zentrales pädagogisches Problem.']]],
   ['Was tun Sie?',[['Original plus vereinfachte Fassung (Bindestriche, Begriff erklären, kurze Sätze, Schaubild), Vokabelliste mit Beispielsätzen, Hilfen schrittweise abbauen.',true,'Scaffolding plus I-W-S-T. Herr Eisele ist zufrieden.'],['Den Fachbegriff streichen.',false,'Fachbegriffe bleiben. Sie werden gegliedert und erklärt.'],['Die drei lesen gar nicht mit.',false,'Exklusion ist keine Lösung.']]],
   ['Welcher Querbezug passt?',[['Arbeitsgedächtnis: Vereinfachung entlastet es, damit Kapazität für den Fachinhalt bleibt.',true,'Dr. Jäger: „Kognitive Entlastung – genau.“'],['Frustrations-Aggressions-Theorie.',false,'Frust kann entstehen, ist hier aber nicht der Kern.'],['AVEM-Muster B.',false,'Hier geht es um Schülerlernen.']]]]},
 ll:{t:'Lehr-Lern-Arrangements',fach:'eisele',v:'In einer Gruppenarbeit zu Schutzmaßnahmen arbeiten in jeder Gruppe zwei Schüler, die anderen schauen aufs Handy. Bei der Präsentation stellt jeweils der Fleißigste vor.',
  q:[['Was fragen Sie nach?',[['Wie war die Aufgabe strukturiert – gab es Rollen, Arbeitsteilung und einen individuellen Nachweis?',true,'Das trifft die Merkmale kooperativen Lernens.'],['Welche Handys die Schüler haben.',false,'Irrelevant. Gefragt ist die Struktur der Gruppenarbeit.'],['Ob die Fleißigen Noten-Streber sind.',false,'Bitte keine Etiketten.']]],
   ['Wie analysieren Sie?',[['Es fehlen individuelle Verantwortlichkeit und positive Interdependenz. Folge: free rider und sucker effect, also ein Schereneffekt.',true,'Helmkes Merkmale sitzen.'],['Gruppenarbeit funktioniert bei Azubis nie.',false,'Mit richtiger Struktur sehr wohl – nach Hattie sogar lernwirksam.'],['Das ist Storming.',false,'Kann mitspielen, aber der Kern ist die fehlende Struktur.']]],
   ['Was verbessern Sie?',[['Gruppenpuzzle (jeder ist Experte für eine Maßnahme), Rollen, Präsentierende auslosen, Prozessreflexion und kurzer individueller Test.',true,'Herr Eisele notiert „Gruppenpuzzle“ – mit drei Ausrufezeichen. Strukturierte Begeisterung.'],['Die Fleißigen bekommen eine bessere Gruppennote.',false,'Gruppennoten gibt es nicht – und das löst nichts.'],['Handys einsammeln, fertig.',false,'Symptom weg, Strukturproblem bleibt.']]],
   ['Welcher Querbezug passt?',[['Gruppenphasen nach Tuckman: Rollen und Regeln vereinbaren, Storming einplanen. Dieser Querbezug wird im Seminar ausdrücklich genannt.',true,'Dr. Jäger wippt fröhlich.'],['Klassische Konditionierung auf Handytöne.',false,'Amüsant, aber nicht der zentrale Bezug.'],['Inklusion und SGB IX.',false,'Hier geht es um Kooperation, nicht um Behinderung.']]]]},
 ea:{t:'Erziehungsauftrag',fach:'eisele',v:'Im Werkstattunterricht macht ein Azubi abfällige Witze über Kolleginnen in seinem Betrieb. Einige lachen. Der Azubi sagt: „Ist doch nur Spaß, und Sie sind hier nicht mein Erziehungsberechtigter.“',
  q:[['Was klären Sie zuerst?',[['Ob es dazu Klassenregeln gibt und wie die Klasse die Situation einschätzt.',true,'Wie im Online-Fall vom 17.03. – sehr gut.'],['Ob die Witze wenigstens gut waren.',false,'Herr Eisele schaut über den Brillenrand. Diesmal hat er einen.'],['Wie alt der Azubi genau ist.',false,'Das ändert nichts am Erziehungsauftrag.']]],
   ['Wie analysieren Sie?',[['Der Erziehungsauftrag nach § 1 Abs. 2 SchG gilt auch für Azubis (Achtung der Würde anderer). Die Lachenden wirken als Verstärker.',true,'Rechtlich und psychologisch sauber.'],['Er hat recht, ab 18 erzieht man nicht mehr.',false,'Falsch. Der Auftrag gilt unabhängig vom Alter.'],['Das ist Mobbing nach Olweus.',false,'Noch nicht – es fehlen Wiederholung und ein konkretes Opfer in der Klasse.']]],
   ['Was tun Sie?',[['Sofort ruhig eine Grenze setzen (Ich-Botschaft, Würde anderer), keinen Machtkampf eingehen, später Einzelgespräch, das Thema Respekt im Betrieb als Fall im Unterricht aufgreifen.',true,'Coach-Muster: klar, aber ohne Moralpredigt.'],['Lange Moralpredigt vor allen.',false,'Moralisieren ist eine Kommunikationssperre und gibt ihm eine Bühne.'],['Ignorieren, es ist ja nur Spaß.',false,'Schweigen wirkt als Zustimmung.']]],
   ['Welcher Querbezug passt?',[['Lernen am Modell (Bandura): Meine Reaktion ist Modell für die Klasse. Dazu Ich-Botschaften aus Kommunikation II.',true,'Dr. Jäger strahlt: „Super! Spontane Idee: Das spielen wir nächste Sitzung als Rollenspiel nach!“'],['Atkinsons Risiko-Wahl-Modell.',false,'Hier wird nichts gewählt außer schlechten Witzen.'],['Ebbinghaus.',false,'Leider vergisst er die Witze nicht von allein.']]]]},
 in:{t:'Inklusion und Nachteilsausgleich',fach:'eisele',v:'Ein Schüler mit ADHS in deiner E1-Klasse ruft ständig dazwischen, verliert Werkzeug und ist nach 15 Minuten nicht mehr bei der Sache. Ein Kollege sagt: „Der gehört nicht hierher.“',
  q:[['Was klären Sie zuerst?',[['Gibt es Informationen von Schüler, Eltern oder Betrieb, eventuell Absprachen oder einen Antrag auf Nachteilsausgleich?',true,'Wichtig: ohne Antrag keine Unterstützung, und oft fehlen Hinweise.'],['Welche Medikamente er nimmt.',false,'Das ist nicht Ihre erste Frage – und sensibel.'],['Ob er in eine andere Klasse kann.',false,'Er hat Anspruch auf zielgleiche Beschulung.']]],
   ['Wie ordnen Sie ein?',[['Besonderer Förderbedarf: zielgleich, pädagogische Maßnahmen stehen im Vordergrund, Nachteilsausgleich ist möglich.',true,'Die drei Säulen sitzen.'],['Anspruch auf ein sonderpädagogisches Bildungsangebot.',false,'Das betrifft etwa geistige Behinderung, eventuell zieldifferent.'],['Ein reines Disziplinproblem.',false,'Das greift zu kurz. ADHS ist besonderer Förderbedarf.']]],
   ['Was tun Sie?',[['Fester ablenkungsarmer Platz, Ablauf an der Tafel, kurze Sequenzen von 10–15 Minuten, Vereinbarung zu Meldezeichen, Werkzeug-Checkliste, Bewegungsaufträge, Lob für Gelingen. Auf Antrag Nachteilsausgleich (Zeit, Pausen).',true,'Konkret und begründet.'],['Ihn nach hinten setzen, damit er nicht stört.',false,'Ablenkungsarm heißt nicht abgeschoben.'],['Bei Klassenarbeiten leichtere Aufgaben.',false,'Nachteilsausgleich ändert Bedingungen, nicht das Niveau.']]],
   ['Welcher Querbezug passt?',[['Klassenführung nach Kounin: Struktur, Reibungslosigkeit und Rituale helfen ihm – und der ganzen Klasse.',true,'Dr. Jäger: „Genau, Struktur hilft allen.“'],['Muster S nach AVEM.',false,'Es geht um den Schüler, nicht um Lehrerbelastung.'],['Mediation zwischen Schüler und Kollege.',false,'Eher Gespräch im Kollegium.']]]]},
 kf:{t:'Klassenführung',fach:'jaeger',v:'Kevin kommentiert seit Wochen laut („Langweilig!“). Auf Ermahnung grinst er und sagt: „Machen Sie doch was!“ Die Klasse lacht. Herr M. fühlt sich herausgefordert, droht mit einem Eintrag und hält eine lange Standpauke. Danach ist die Stunde gelaufen.',
  q:[['Was fragen Sie nach?',[['Wie reagiert Kevin auf Ermahnungen, und was empfindet Herr M. dabei?',true,'Das ist der Diagnoseschlüssel nach Dreikurs.'],['Welche Kappe Kevin trägt.',false,'Dr. Jägers Zopf steht still. Ein schlechtes Zeichen.'],['Ob Kevin Geschwister hat.',false,'Mag interessant sein, ist aber nicht der Kern.']]],
   ['Wie analysieren Sie?',[['Disziplinproblem. Ziel nach Dreikurs: Macht (Lehrer herausgefordert, Kevin legt nach). Die Standpauke ist der Einstieg in den Machtkampf.',true,'Präzise und mit Begründung.'],['Ziel: Aufmerksamkeit, er will nur beachtet werden.',false,'Dann hörte er nach der Ermahnung kurz auf. Er legt aber nach.'],['Kevin ist einfach respektlos – das ist sein Charakter.',false,'Stabile Personattribution. Genau das vermeiden erfolgreiche Lehrkräfte.']]],
   ['Was tun Sie?',[['Aus dem Machtkampf aussteigen: ruhig, nonverbal, kurze Ich-Botschaft, Wahl anbieten, weiter unterrichten. Später Einzelgespräch, Mitbestimmung und Verantwortung, klare angekündigte Konsequenz.',true,'Dr. Jäger: „Das würde ich so unterschreiben.“'],['Noch lauter werden, bis er nachgibt.',false,'Symmetrische Eskalation. Kevin gewinnt.'],['Ihn rauswerfen und nie wieder ansprechen.',false,'Eine Konsequenz ohne Beziehungsangebot löst das Problem nicht.']]],
   ['Welcher Querbezug passt?',[['Erziehungsauftrag: Erziehungsmuster Coach, Regeln mit Begründung. Dazu Motivation: Autonomie nach Deci & Ryan als Prävention.',true,'Sehr schön vernetzt.'],['Nachteilsausgleich für Kevin.',false,'Dafür fehlt jede Grundlage.'],['SQ3R-Lesetechnik.',false,'Kevin liest gerade gar nichts.']]]]},
 gr:{t:'Gruppenentwicklung und Unterrichtsstörungen',fach:'jaeger',v:'Eine neue E1-Klasse ist nach drei Wochen plötzlich unruhig. Es bilden sich Cliquen, es gibt Streit um Plätze in der Werkstatt. Eine Kollegin meint: „Die Gruppenarbeit lass ich jetzt bleiben.“',
  q:[['Was fragen Sie nach?',[['Was genau ist seit Woche drei anders, und worum wird gestritten?',true,'Gute Grundlage für die Einordnung.'],['Ob die Klasse verflucht ist.',false,'Seminar-Island hat genug Flüche. Bitte fachlich.'],['Wann die nächsten Ferien sind.',false,'Verständlicher Wunsch, aber nicht zielführend.']]],
   ['Wie analysieren Sie?',[['Typische Storming-Phase nach Tuckman: Rollensuche, Konflikte, Machtkämpfe. Das ist kein Scheitern, sondern der Weg zum Norming.',true,'Genau.'],['Forming – sie lernen sich noch kennen.',false,'Nach drei Wochen mit Konflikten ist das eher Storming.'],['Die Klasse ist einfach schwierig.',false,'Stabile Zuschreibung. Gruppendynamik erklärt mehr.']]],
   ['Was tun Sie?',[['Gemeinsam Regeln vereinbaren (zum Beispiel für Werkstattplätze), Rollen in Gruppen, gemischte Zufallsgruppen, Konflikte moderieren, kooperative Methoden mit individueller Verantwortlichkeit.',true,'Dr. Jäger: „Und Teamreflexion nicht vergessen.“'],['Gruppenarbeit abschaffen.',false,'Dann bleibt die Klasse im Storming stecken.'],['Die Cliquen getrennt unterrichten.',false,'Das verfestigt die Spaltung.']]],
   ['Welcher Querbezug passt?',[['Kooperatives Lernen aus der Pädagogik – dieser Querbezug wird im Seminar ausdrücklich genannt.',true,'Volltreffer.'],['Berufswegekonferenz.',false,'Thematisch weit weg.'],['Bezugsnormen.',false,'Hier geht es um Gruppendynamik.']]]]},
 lg:{t:'Lernen und Gedächtnis',fach:'jaeger',v:'Herr K. hält 45 Minuten einen Vortrag zu Schutzmaßnahmen gegen elektrischen Schlag, mit dicht beschriebenen Folien. Am Ende: „Noch Fragen?“ Eine Woche später kann kaum jemand die Maßnahmen unterscheiden.',
  q:[['Was fragen Sie nach?',[['Gab es Aktivierung, Wiederholung oder eine Ergebnissicherung während oder nach dem Vortrag?',true,'Damit prüfen Sie Enkodierung und Abruf.'],['Wie groß war die Schrift?',false,'Wichtig, aber nicht das Hauptproblem.'],['Ob Herr K. gut aussieht.',false,'Halo-Effekt in der Prüfung? Mutig.']]],
   ['Wie erklären Sie das?',[['Mehrspeichermodell: Aufmerksamkeit sinkt, das Arbeitsgedächtnis ist überlastet, es gibt keine Enkodierung. Danach Spurenzerfall (Ebbinghaus) und Interferenz, weil die Maßnahmen sich ähneln.',true,'Dr. Jäger: „Zwei Vergessenstheorien – sehr gut.“'],['Die Schüler haben nicht zugehört, also ihre Schuld.',false,'Personattribution. Das Modell erklärt es besser.'],['Klassische Konditionierung.',false,'Hier wird nichts gekoppelt – es wird vergessen.']]],
   ['Was würden Sie ändern?',[['Einstieg mit Unfallbericht, Advance Organizer, Gruppenpuzzle, Vergleichstabelle gegen Interferenz, Typenschilder zuordnen (enaktiv), Eselsbrücke, Abschlussquiz und verteiltes Wiederholen.',true,'Ein ganzes Arsenal – alles theoretisch begründet.'],['Den Vortrag auf 90 Minuten verlängern.',false,'Mehr vom Gleichen überlastet noch mehr.'],['Folien mit noch kleinerer Schrift, damit alles draufpasst.',false,'Das Arbeitsgedächtnis weint.']]],
   ['Welcher Querbezug passt?',[['Lehrervortrag und direkte Instruktion aus der Pädagogik: 5 bis 20 Minuten, Struktur, angeleitetes Üben.',true,'Herr Eisele nickt mit.'],['Mobbing.',false,'Die Folien wurden nicht gemobbt. Nur die Schüler gelangweilt.'],['Muster S nach AVEM.',false,'Hier geht es ums Schülerlernen.']]]]},
 k1:{t:'Kommunikation I',fach:'jaeger',v:'Du sagst zu einem Azubi: „Die Schaltung ist ja immer noch nicht fertig.“ Er antwortet patzig: „Dann machen Sie’s doch selber!“ Es folgt ein Wortgefecht.',
  q:[['Was fragen Sie nach?',[['Wie war die Beziehung zu dem Azubi bisher, und wie habe ich den Satz betont?',true,'Beziehung und Analoges – sehr gut.'],['Ob die Schaltung danach fertig wurde.',false,'Die Schaltung ist hier Nebensache.'],['Wie spät es war.',false,'Tageszeit erklärt wenig.']]],
   ['Wie analysieren Sie mit zwei Modellen?',[['Schulz von Thun: Gemeint war die Sache, er hört auf dem Beziehungsohr („Ich trau dir nichts zu“). Watzlawick: Die Beziehung bestimmt den Inhalt, dazu symmetrische Eskalation und Interpunktion.',true,'Beide Modelle sauber angewendet.'],['Er ist einfach frech.',false,'Personattribution. Die Modelle erklären mehr.'],['Das ist Frustrations-Aggression.',false,'Möglich, aber hier geht es um Kommunikation.']]],
   ['Was tun Sie?',[['Aus der Eskalation aussteigen, eine Ich-Botschaft senden und nachfragen, wo es hakt (aktiv zuhören).',true,'Dr. Jäger strahlt.'],['Das letzte Wort behalten.',false,'Symmetrische Eskalation in Reinform.'],['Ihn vor der Klasse bloßstellen.',false,'Kommunikationssperre und Beziehungsschaden.']]],
   ['Welcher Querbezug passt?',[['Erziehungsauftrag: Konfliktkompetenz als Unterrichtsinhalt. Ich bin dabei Modell.',true,'Schön vernetzt.'],['Gütekriterien.',false,'Hier wird nichts gemessen.'],['OES.',false,'Weit weg vom Fall.']]]]},
 k2:{t:'Kommunikation II',fach:'jaeger',v:'Ben arbeitet während deiner Erklärung der fünf Sicherheitsregeln an einem Schaltschrank, der noch unter Spannung steht. Du rufst: „Bist du lebensmüde? Du hörst nie zu!“',
  q:[['Was ist hier zuerst wichtig?',[['Sicherheit vor Kommunikationsmodell: sofort knapp stoppen – „Ben, stopp, Hände weg!“',true,'Absolut richtig. Danach kommt die Ich-Botschaft.'],['Erst die Ich-Botschaft sauber formulieren.',false,'Bei Lebensgefahr zuerst stoppen.'],['Abwarten, ob er es selbst merkt.',false,'Bitte nicht.']]],
   ['Wie analysieren Sie die Reaktion?',[['Du-Botschaft mit Verallgemeinerung („nie“), die die Person bewertet. Die Wut ist die sekundäre Emotion, die primäre ist Angst.',true,'Gordon wäre stolz.'],['Perfekte Ich-Botschaft.',false,'„Du hörst nie zu“ ist das Gegenteil.'],['Aktives Zuhören.',false,'Hier spricht nur die Lehrkraft – laut.']]],
   ['Wie formulieren Sie besser?',[['„Als du am Schrank gearbeitet hast, bevor wir freigeschaltet hatten, hättest du einen lebensgefährlichen Stromschlag bekommen können – ich habe richtig Angst um dich bekommen.“',true,'Verhalten – Wirkung – primäres Gefühl.'],['„Ich finde, du bist ein Risiko für die Klasse.“',false,'Verkleidete Du-Botschaft.'],['„Wenn du das noch mal machst, fliegst du.“',false,'Drohung – eine Kommunikationssperre.']]],
   ['Welcher Querbezug passt?',[['Erziehungsauftrag und Arbeitsschutz: Sicherheit als Wert. Außerdem Modelllernen – ich zeige, wie man Konflikte anspricht.',true,'Herr Eisele: „Sehr schön.“'],['Nachteilsausgleich.',false,'Kein Bezug.'],['Linzer Diagnosebogen.',false,'Möglich, aber weit hergeholt.']]]]},
 mo:{t:'Leistungsmotivation',fach:'jaeger',v:'Lena hat in Berechnungen zu Leitungsquerschnitten meist eine 5. Bei Wahlaufgaben nimmt sie stets die leichteste oder probiert direkt die schwerste und gibt auf. Sie sagt: „Ich bin halt zu blöd für Mathe. Und wenn ich mal eine 3 hab, war’s Glück.“ Die Lehrerin kommentiert: „Wieder unter dem Klassenschnitt.“',
  q:[['Was fragen Sie nach?',[['Wie hat sich Lenas Leistung im Vergleich zu früher entwickelt?',true,'Damit öffnen Sie die individuelle Bezugsnorm.'],['Ob ihre Eltern auch schlecht in Mathe waren.',false,'Das verstärkt eher die Fähigkeitsattribution.'],['Welchen Taschenrechner sie hat.',false,'Netter Versuch.']]],
   ['Wie analysieren Sie?',[['Furcht vor Misserfolg: Misserfolg auf Fähigkeit, Erfolg auf Glück (Weiner), extreme Aufgabenwahl (Atkinson), Heckhausen scheitert an der Handlungs-Ergebnis-Erwartung. Die soziale Bezugsnorm verstärkt den Teufelskreis.',true,'Dr. Jäger: „Das ist ein vollständiges Prüfschema.“'],['Sie ist intrinsisch motiviert.',false,'Leider nein. Es ist ein Misserfolgsmotiv.'],['Lena ist faul.',false,'Sie ist eher entmutigt als faul.']]],
   ['Was tun Sie?',[['Interventionsansatz individuelle Bezugsnorm: Fortschritt rückmelden („4 von 6 Schritten, letztes Mal 2“), gestufte Wahlaufgaben mit gemeinsamem Ziel, Reattribution, Fortschrittskurve, Übungen ohne Note.',true,'Rheinberg und Krug lassen grüßen.'],['Den Klassenschnitt noch deutlicher aushängen.',false,'Mehr soziale Bezugsnorm, mehr Teufelskreis.'],['Ihr nur noch leichte Aufgaben geben.',false,'Das bestätigt „ich kann nichts“. Realistische, mittlere Ziele.']]],
   ['Welcher Querbezug passt?',[['Leistungsmessung: Bezugsnormen und lernförderliches Feedback (Feed Forward).',true,'Herr Eisele hebt den Stift.'],['Mediation.',false,'Kein Konflikt zwischen zwei Parteien.'],['Gewaltprävention.',false,'Nicht im Kern – obwohl ein gutes Selbstkonzept auch gewaltpräventiv wirkt.']]]]},
 ge:{t:'Gewalt und Mobbing',fach:'jaeger',v:'In der Klasse E2a wird Tim seit Monaten im Klassenchat verspottet. Sein Werkzeug wird versteckt, in der Werkstatt will niemand mit ihm arbeiten. Drei Schüler machen aktiv mit, viele lachen. Tim fährt häufig früher heim. Die Klassenlehrerin plant eine Mediation zwischen Tim und dem Haupttäter.',
  q:[['Was klären Sie zuerst?',[['Was genau passiert, seit wann, wer ist beteiligt – vertraulich mit Tim und mit Kolleginnen, eventuell per Mobbingtagebuch.',true,'Diagnose vor Intervention.'],['Ob Tim sich nicht einfach wehren kann.',false,'Das ist ein Fallstrick: Opfer beschuldigen.'],['Ob man den Chat abschalten kann.',false,'Technik löst die Gruppendynamik nicht.']]],
   ['Wie analysieren Sie?',[['Mobbing nach Olweus (wiederholt, lange, Machtungleichgewicht, Schadensabsicht). Rollen: Täter, Assistenten, Verstärker, Außenstehende. Mediation ist ein Fallstrick.',true,'Dr. Jäger nickt ernst. Gut.'],['Ein normaler Konflikt unter Gleichen.',false,'Einer gegen viele ist kein Konflikt unter Gleichen.'],['Nur der Haupttäter ist das Problem.',false,'Mobbing ist ein Gruppenphänomen.']]],
   ['Was tun Sie?',[['No-Blame-Approach (Gespräch mit Tim, Unterstützergruppe ohne Schuldzuweisung, Ich-Vorschläge, Nachgespräche), alternativ Farsta. Absprache mit Schulleitung und Kollegium, Chatregeln, Nachkontrolle, Tim schützen.',true,'Vollständig und systemisch.'],['Mediation wie geplant, aber mit Kuchen.',false,'Auch Kuchen hebt das Machtungleichgewicht nicht auf.'],['Vor der Klasse mit Tim darüber sprechen.',false,'Bloßstellung – ein Fallstrick.']]],
   ['Welcher Querbezug passt?',[['Erziehungsauftrag (Würde, Vorbild) und Inklusion (Ausgrenzung verhindern).',true,'Herr Eisele nickt.'],['Anderson und Krathwohl.',false,'Hier geht es nicht um Lernziele.'],['Ebbinghaus.',false,'Mobbing vergisst man leider nicht.']]]]},
 lb:{t:'Lehrerbelastung',fach:'jaeger',v:'Referendarin Frau S. plant jede Stunde bis tief in die Nacht, auch am Wochenende, will „alles perfekt“, grübelt abends über Störungen und denkt vor dem Unterrichtsbesuch: „Das schaffe ich nie“ – obwohl ihre Mentorin sie lobt.',
  q:[['Was fragen Sie nach?',[['Welche Unterstützung und Ausgleich hat sie – und wie bewertet sie den Unterrichtsbesuch?',true,'Ressourcen und Bewertung – Lazarus lässt grüßen.'],['Ob sie Kaffee trinkt.',false,'Gaggi wäre geschmeichelt. Aber nein.'],['Wie viele Ordner sie hat.',false,'Viele. Aber das ist nicht die Kernfrage.']]],
   ['Wie analysieren Sie?',[['AVEM Muster A: hohe Bedeutsamkeit, Verausgabung, Perfektion, niedrige Distanzierung, wenig Erfolgserleben. Lazarus: Sie bewertet den Besuch als Bedrohung und unterschätzt ihre Ressourcen.',true,'Dr. Jäger: „Lehrbuch.“'],['Muster S – sie schont sich.',false,'Sie tut das Gegenteil.'],['Muster G – sie ist ja engagiert.',false,'G heißt engagiert UND distanzierungsfähig.']]],
   ['Was empfehlen Sie?',[['Instrumentell (Zeitbudget, Feierabend, Material teilen), mental („gut genug“, umdeuten, Lob notieren), regenerativ (Sport, PMR), sozial (Tandem, Mentorin).',true,'I-M-R-S. Perfekt – aber bitte nicht perfektionistisch.'],['Noch gründlicher planen, dann wird es besser.',false,'Mehr vom Gleichen. Die Kerze brennt an beiden Enden.'],['Den Beruf wechseln.',false,'Etwas voreilig.']]],
   ['Welcher Querbezug passt?',[['Schulentwicklung: Kollegium und Schulleitung als stärkste Entlastungsressource. Dazu Fallbesprechungsgruppe.',true,'Herr Eisele: „Unterrichtsentwicklung braucht Schulentwicklung.“'],['Taxonomie nach Anderson.',false,'Weit weg.'],['Nachteilsausgleich für Frau S.',false,'Nicht passend.']]]]}

async function runExperiment(){const n=S.ch,e=EXPERIMENTS[n];if(!e)return say('du','Die Experimentierkiste ist leer. Dr. Jäger hat wohl schon alles ausprobiert.');
  if(S.f.expDone)return say('jaeger','Das Experiment haben wir schon gemacht! Aber ich hab schon drei neue Ideen. Für nächstes Mal.');
  if(S.scene!==e.scene&&(CHX().rooms||[]).includes(e.scene)){await say('jaeger',`Das Experiment machen wir im Raum „${ROOMS[e.scene]}“. Komm mit!`);await go(e.scene)}
  sfx('pick');await say('info',`<b class="on">⚗ Jägers Experiment: ${e.t}</b>`);await lines(e.intro);
  const o=shuffle(e.o);const a=await choose('jaeger',e.q,o.map(x=>x[0]));
  if(o[a][1]){sfx('good');await say('jaeger',o[a][2]);G.exp=G.exp||{};G.exp[n]=1;saveG();toast('⚗ Experiment gelungen (Bonus)')}
  else{sfx('bad');await say('jaeger',o[a][2]+' Macht nichts – Experimente dürfen schiefgehen! Richtig wäre: '+o.find(x=>x[1])[0]);addFehler({q:e.q,c:o.find(x=>x[1])[0],w:o.filter(x=>!x[1]).map(x=>x[0]),t:CATTOPIC[n]&&CATTOPIC[n]._||null})}
  S.f.expDone=1;await duo()}
