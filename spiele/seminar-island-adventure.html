async function chkBeg(){if(done('begriff')||!(S.f.sb&&S.f.sf))return;
  await say('jaeger','Beamer kaputt, Presslufthammer draußen, Kevins Dauer-„Langweilig“ trotz Ermahnung … Sortier mal.');
  await quiz('begriff','jaeger','Was davon ist ein DISZIPLINPROBLEM?',[['Kevin ruft trotz Ermahnung immer wieder „Langweilig!“',true,'Richtig: bewusster, wiederholter Regelverstoß eines Schülers. Beamer und Baulärm sind „nur“ Unterrichtsstörungen – jedes Disziplinproblem ist eine Störung, aber nicht umgekehrt.'],
   ['Der Beamer zeigt „Kein Signal“.',false,'Das ist eine Unterrichtsstörung durch äußere Umstände. Der Beamer handelt nicht bewusst. Glaube ich.'],['Der Presslufthammer vor dem Fenster.',false,'Störung, ja. Disziplinproblem, nein – der Bauarbeiter ist nicht in deiner Klasse.'],['Eine unklare Arbeitsanweisung von mir.',false,'Auch Lehrkräfte verursachen Störungen. Aber Disziplinproblem meint Schülerverhalten gegen Regeln.']],8)}
async function kevinScene(){await lines([['du','Kevin, bitte …'],['kevin','Langweilig! Machen Sie doch was!'],['info','Die Klasse lacht. Kevin grinst wie ein Honigkuchenpferd mit WLAN.']]);
  const c=await choose('du','Wie reagierst du?',['„JETZT REICHT’S! Noch ein Wort, und es gibt einen Eintrag! Weißt du überhaupt, wie respektlos …“','(Stopp-Code: kurz innehalten.) Moment. Was fühle ich gerade – und was will Kevin?','„Okay, dann machen wir halt was Lustiges. Wer will Videos gucken?“']);
  if(c===0){minus(6,'In den Machtkampf eingestiegen','mk');await lines([['kevin','Uiii, ein Eintrag! Ich zitter!'],['info','Die Klasse johlt. Kevin hat bekommen, was er wollte: eine Bühne und einen Gegner.'],['jaeger','Atme. Stopp-Code. Was fühlst du – und wie hat er auf die Ermahnung reagiert?']])}
  if(c===2){minus(4,'Dem Machtanspruch nachgegeben','mk2');await lines([['kevin','Na also! Geht doch!'],['jaeger','Nachgeben bedient sein Ziel genauso wie Schimpfen. Diagnose zuerst!']])}
  await quiz('dreikurs','jaeger','Dein Bauchgefühl: herausgefordert, ärgerlich. Kevin hat nach der Ermahnung nachgelegt. Welches Ziel verfolgt er nach Dreikurs?',[
   ['Macht – „Ich zähle nur, wenn ich bestimme.“',true,'Genau. Und die spontane Reaktion – Schimpfen oder Nachgeben – bedient genau dieses Ziel. Also: aussteigen. Hier, nimm das.'],
   ['Aufmerksamkeit.',false,'Bei Aufmerksamkeit wärst du eher genervt, und er hörte nach der Ermahnung kurz auf. Er legt aber nach.'],['Rache.',false,'Bei Rache fühlst du dich verletzt, und er wird gemein. Du fühlst dich herausgefordert.'],['Unzulänglichkeit.',false,'Dann wäre er passiv und zurückgezogen, und du fühltest dich hilflos. Kevin ist alles, nur nicht passiv.']],12);
  give('wahlkarte')}
async function wahlScene(){if(done('wahl'))return say('du','Kevin hat sich schon entschieden. Für Mitarbeit. Halbwegs.');if(!done('dreikurs'))return say('du','Erst mal verstehen, was mit Kevin los ist. Rede mit ihm.');
  await quiz('wahl','du','Wie formulierst du die Wahl?',[['(Ruhig, kurz:) „Kevin, du kannst jetzt mitarbeiten – oder wir sprechen nach der Stunde in Ruhe. Du entscheidest.“ (Und weiter im Stoff.)',true,'Kevin: „… Pff. Dann halt mitarbeiten.“ Kein Publikum, kein Gegner, kein Machtkampf. Jäger wippt mit dem Zopf.'],
   ['„Du hast die Wahl: Klappe halten oder raus!“',false,'Das ist eine Drohung im Wahl-Kostüm. Kevin: „Dann geh ich halt raus. Tschüss!“ Machtkampf, Runde zwei.'],['„Bitte, bitte, Kevin, für mich?“',false,'Kevin: „Für Sie? Hmm … nö.“ Betteln ist auch eine Art, die Macht abzugeben.']],8);
  take('wahlkarte');await say('jaeger','Und jetzt halt die Tür im Auge. Da kommt gleich noch jemand.')}
async function spaetEvent(){await justinArrives();
  await quiz('spaet','du','Justin steht in der Tür und wartet auf Applaus. Was tust du?',[
   ['Kurzes Nicken, auf seinen Platz zeigen, Ankunftszeit notieren – „Wir reden nach der Stunde.“ Und weiter im Text.',true,'Bühne entzogen. Die Aufmerksamkeit der Klasse war sein Verstärker – jetzt bleibt sie aus. Das Gespräch kommt später, unter vier Augen.'],
   ['„Ah, Justin! Erzähl doch allen, was es diesmal war!“',false,'Damit verstärkst du das Zuspätkommen positiv: Bühne, Lacher, Aufmerksamkeit. Kevin filmt schon.'],
   ['„Raus! Komm wieder, wenn du pünktlich sein kannst!“',false,'Damit vermeidet er den Unterricht ganz – das kann sogar als negative Verstärkung wirken.']],8);
  justinSits('b3');await say('jaeger','Hörst du das? Vorne wird gestritten. Rede mal mit den dreien.')}
async function stormTalk(){if(!done('spaet'))return say(pick(['sophie','lena','murat']),'Reffi, wann gehen wir eigentlich in die Werkstatt? Und wer kriegt den Platz am Fenster?');
  if(done('storming'))return say('sophie','Wir haben jetzt Werkstattregeln. Laminiert. In Wir-Form.');
  if(!done('tuckman')){await lines([['lena','Ich will den Platz am Fenster in der Werkstatt!'],['sophie','Den hatte ich zuerst! Ich hab ihn sogar markiert!'],['murat','Ihr streitet seit drei Wochen über einen Platz. Ich geh einfach in den Keller.'],['kevin','KAMPF! KAMPF! KAMPF!'],
    ['jaeger','Drei Wochen alte Klasse, Rollen- und Platzkämpfe … Gruppen entwickeln sich in Phasen. Bring sie in die richtige Reihenfolge.']]);
   await askOrder({key:'tuckman',full:10,title:'Gruppenphasen nach Tuckman',html:'Tippe die Phasen in der richtigen Reihenfolge an.',steps:['Forming – Orientierung, Höflichkeit, Unsicherheit','Storming – Konflikte, Machtkämpfe, Rollensuche','Norming – Regeln, Rollen, Wir-Gefühl','Performing – produktive, selbstständige Arbeit','Adjourning – Abschluss und Abschied'],after:'Und gerade jetzt? Eindeutig <b>Storming</b>. Kein Versagen – der Weg zum Norming.'});
   return say('jaeger','Jetzt brüllen alle durcheinander. Erst mal Ruhe – aber ohne Gebrüll. Hast du im Regal nicht etwas gesehen?')}
  return say('lena','Wir kriegen das schon hin … irgendwann … KEVIN, HÖR AUF!')}
async function klangScene(){if(!done('tuckman'))return say('du','Klangschale? Jetzt noch nicht. Erst verstehen, was hier los ist. Rede mit den dreien.');if(done('storming'))return say('du','DOOONG. Alle schauen. Es ist schon ruhig. Ich mache es trotzdem nochmal. Weil es so schön ist.');
  sfx('gong');await lines([['du','DOOOOONG.'],['info','Stille. Selbst Kevin schaut verwirrt zur Klangschale. Ein Ritual wirkt.']]);take('klangschale');
  await quiz('storming','jaeger','Ruhe ist da. Wie begleitest du das Storming?',[
   ['Gemeinsam Werkstattregeln vereinbaren – wenige, positiv, in Wir-Form, mit vorher klaren Konsequenzen – und die Platzfrage fair regeln (zum Beispiel Rotationsplan).',true,'Genau so wird aus Storming Norming. Sophie hat die Regeln schon laminiert. Natürlich.'],
   ['Gruppenarbeit abschaffen, Einzelarbeit bis Schuljahresende.',false,'Dann bleibt die Klasse im Storming stecken – und kooperatives Lernen findet nie statt.'],['Die drei Lautesten trennen und mit Strafarbeit belegen.',false,'Das unterdrückt den Konflikt nur. Unterdrückte Konflikte verhindern das Norming.']],8)}
async function fallScene(){if(done('fallb'))return say('kolb','Gut gelaufen heute! Fallberatung lebt von klaren Phasen. Und von Keksen.');
  await lines([['kolb','Schön, dass du da bist. Fallberatung! Frau Sommer ist Fallgeberin, ich moderiere, Torsten und du beraten.'],['sommer','Also … meine E2a ist seit Wochen laut, die hören mir nicht zu, und ich …'],
   ['torsten','Du musst halt strenger sein, das ist doch klar!'],['sommer','Aber ich BIN streng! Ich hab schon dreimal … also … das ist nicht so einfach, ich …'],['info','Frau Sommer rechtfertigt sich. Zehn Minuten. Kollegin Kolb nippt ratlos am Kaffee.']]);
  await quiz(null,'kolb','Was läuft hier schief?',[['Phasen vermischt: In der Verständnisfragen-Phase gibt Torsten schon einen Rat – direktiv und bewertend. Frau Sommer muss sich rechtfertigen. Und die Moderation greift nicht ein.',true,'Genau. Dann machen wir es nochmal richtig. Bring die Phasen in Reihenfolge.'],
   ['Gar nichts, Torsten hat einfach recht.',false,'Selbst wenn – ein Ratschlag zur falschen Zeit kommt nicht an. Und der Fallgeber entscheidet.'],['Frau Sommer hätte den Fall gar nicht einbringen dürfen.',false,'Doch, Freiwilligkeit und Vertraulichkeit vorausgesetzt. Das Problem ist der Ablauf.']]);
  await askOrder({key:'fallb',full:12,title:'Fallbesprechungsgruppe – Ablauf',html:'Bring die Phasen in die richtige Reihenfolge.',steps:['Fall wählen, Rollen verteilen','Fallschilderung – alle hören zu','Verständnisfragen (nur Informationsfragen)','Schlüsselfrage formulieren: „Wie kann ich …?“','Hypothesen der Berater – der Fallgeber hört nur zu','Stellungnahme des Fallgebers','Lösungsideen im Konjunktiv sammeln, ohne Bewertung','Fallgeber wählt aus und plant den ersten Schritt'],after:'Regeln: Vertraulichkeit, Freiwilligkeit, beschreiben statt bewerten – und der Fallgeber entscheidet allein.'});
  await lines([['sommer','Danke. Ich nehme mit: Regeln mit der Klasse vereinbaren und mehr nonverbal arbeiten.'],['torsten','Hm. Im Konjunktiv klingt „strenger sein“ irgendwie … netter.']])}
async function kevinDuel(){await lines([['kevin','Okay, Reffi. Sie haben mich ausgetrickst. Aber jetzt: Fachbegriff-Fechten! Pausenhof-Regeln. Wer verliert, wischt die Tafel.'],['du','Ich nehme die Herausforderung an. Ich hatte schon immer ein Händchen für Tafelschwämme.']]);
  await duel({key:'duell',full:14,foe:'kevin',items:pool(['kf','gr'],5),hurt:['Ey! Woher wissen Sie das?!','Boah, Fachbegriff. Unfair.','Okay, okay, der saß.','Hm. Sie haben gelernt.']});
  await say('kevin','Okay … ich wisch die Tafel. Aber nur, weil ich will. Autonomie und so.')}

async function torstenText(){if(!done('text')){await say('torsten','Vereinfachte Texte? Unsinn! In der Prüfung kriegen die auch keinen einfacheren Text! Und Leon gehört sowieso nicht hierher.');
   return askText({key:'text',full:10,title:'Überzeuge Torsten',html:'Was antwortest du zur Textvereinfachung? (Ein paar Sätze reichen.)',
    groups:[{l:'Fachbegriffe bleiben erhalten (werden erklärt)',k:['fachbegriff','fachwort','fachwoerter','fachsprache','begriff bleibt','begriffe bleiben','erklaer']},{l:'Es geht um Validität / die Fachleistung, nicht ums Lesen',k:['valid','fachleistung','elektrotechnik','fachlich','nicht lesen','lesekompetenz','sprache verdeckt','teilhabe','verstaend']},
     {l:'Schrittweise Hilfen (Scaffolding) …',k:['schrittweise','scaffold','hilfen abbauen','nach und nach','heranfuehr','stufenweise','gestuft','schritt fuer schritt','abbauen']},{l:'… bis hin zu Originaltexten bzw. zur Prüfung',k:['original','pruefung','spaeter','am ende','herstellertext']}],
    model:'„Ich vereinfache nicht das Fach, sondern die Sprache drumherum – die Fachbegriffe bleiben und werden erklärt. So messe ich Elektrotechnik statt Lesegeschwindigkeit: Das erhöht die Validität. Die Hilfen baue ich schrittweise ab (Scaffolding), bis die Schüler auch Originaltexte wie in der Prüfung lesen können. Und Leon hat Anspruch auf zielgleiche Beschulung – Struktur hilft der ganzen Klasse.“'})}
  if(!done('duell')){await lines([['torsten','Hmpf. Klingt vernünftig. ZU vernünftig. Fechten wir!'],['du','Mit Vergnügen. Ohne Bindestriche.']]);
   return duel({key:'duell',full:12,foe:'torsten',items:pool(['in','sp'],5),hurt:['Pfff. Das stand früher nicht im Gesetz.','Na gut. Rampe statt Hintereingang. Hab’s kapiert.','Grmpf. Du hast dich vorbereitet.']})}
  return say('torsten','Na gut. Vielleicht gehört Leon doch hierher. Er hat mir gestern den Kopierer repariert. In 30 Sekunden.')}

CHAP[9]={title:'Das Kolloquium',area:'Pädagogik + Päd. Psychologie · 20 bzw. 30 Minuten',mentor:'eisele',song:'C',start:'pruefung',rooms:['pruefung'],
 topics:'Schwerpunkt deiner Wahl (Fall nach dem Fall-Schema), dann Fragen aus allen Themen beider Fächer und ein Querbezug',
 intro:'Die Burg auf dem Hügel. Herr Eisele und Dr. Jäger erwarten dich. Du wählst einen Schwerpunkt, bekommst einen Fall und dann Fragen aus allen Themen. Wie im echten Kolloquium: ein Versuch pro Frage. Basisstufe: 20 Minuten, zwei Joker. Erweiterte Stufe: 30 Minuten, mehr Fragen, kein Joker.',
 cast:{pruefung:{e:'eisele',j:'jaeger'}},
 cats:[['start','Einstieg ins Gespräch',6,'Universal-Einstieg: kurz verstehen, nachfragen, drei Aspekte nennen, Vertiefung anbieten – kein Redeschwall.'],
  ['sp_nach','Schwerpunkt: Fall erfassen',8,'Gezielt nachfragen: Ziel, Kontext, Reaktion – erst verstehen, dann analysieren.'],
  ['sp_ana','Schwerpunkt: Analyse',12,'Theorie mit Fachbegriffen auf den Fall anwenden.'],
  ['sp_hand','Schwerpunkt: Handeln',12,'Konkrete Maßnahmen, theoretisch begründet.'],
  ['sp_netz','Schwerpunkt: Vernetzen',8,'Querbezug zum anderen Fach selbst anbieten.'],
  ['paed','Prüfungsteil Pädagogik',24,'Die Pädagogik-Fragen mit dem Lernskript wiederholen (Kapitel 2, 4, 5, 7, 8 und Schulentwicklung).'],
  ['psy','Prüfungsteil Päd. Psychologie',24,'Die Psychologie-Fragen wiederholen (Kapitel 1–6).'],
  ['quer','Querbezüge',6,'Tabelle „Wenn im Fall … vorkommt“ im Lernskript (Teil C).']],
 async begin(){S.noDN=false;let min=0;const TOT=BASIS()?20:30,NQ=BASIS()?2:4,PER=24/NQ;S.f.joker=BASIS()?2:0;
  const clk=()=>{$('#clockbar').hidden=false;const m=Math.min(min,TOT);$('#clockbar').textContent=`KOLLOQUIUM ${String(Math.floor(m)).padStart(2,'0')}:${m%1?'30':'00'} / ${TOT}:00${S.f.joker?' · JOKER ×'+S.f.joker:''}`};
  await lines([['info','Staatliches Seminar, Raum 0.08. Die Uhr tickt laut. Pestalozzi schaut von der Wand.'],['eisele','Reffi, schön, dass Sie da sind. Nehmen Sie Platz. Wasser? Ich habe es strukturiert eingeschenkt: links Glas, rechts Karaffe.'],
   ['jaeger','Herzlich willkommen! Keine Sorge, wir beißen nicht. Ich hab spontan Kekse mitgebracht – selbst gebacken, nach einem experimentellen Rezept. Mit Rosmarin.'],['eisele',`Wir haben ${TOT} Minuten. Erst Ihr Schwerpunkt mit einem Fall, dann quer durch beide Fächer.`+(BASIS()?' Sie haben zwei Joker – setzen Sie sie weise ein.':'')]]);
  const topic=await pickTopic();S.f.topic=topic;const C=CASES[topic];const ex=C.fach;const other=ex==='eisele'?'jaeger':'eisele';clk();
  await lines([[ex,ex==='eisele'?`Sie haben „${C.t}“ gewählt. Sehr gut. Hier ist Ihr Fall – ich lese ihn langsam vor, versprochen.`:`Oh, „${C.t}“! Schönes Thema. Spontan hätte ich zehn Fälle – ich nehme den, der mir gerade am meisten Spaß macht.`],['info','<b class="on">Fall:</b> '+C.v]]);
  await exam('start',ex,'Wie steigen Sie ein?',[['„Ich würde die Situation zunächst so verstehen, dass … – darf ich kurz nachfragen? Aus meiner Sicht spielen drei Aspekte eine Rolle: erstens …, zweitens …, drittens … Soll ich einen vertiefen?“',true,'Strukturiert, mit Nachfrage und Vertiefungsangebot. Genau so.'],
   ['„Also, da muss man ganz grundsätzlich bei Pestalozzi anfangen, und dann über Herbart zu Klafki, Kounin, Dreikurs, Gordon, und eigentlich hängt ja alles mit allem …“',false,'Kein Redeschwall! Erst ein schlagwortartiger Überblick, dann auf Aufforderung vertiefen.'],['(Schweigen und hoffen, dass sie weiterfragen.)',false,'Machen Sie Themenangebote – die Prüfer freuen sich darüber.']],6);min+=2;clk();
  const keys=['sp_nach','sp_ana','sp_hand','sp_netz'],fulls=[8,12,12,8];
  for(let i=0;i<4;i++){const [q,opts]=C.q[i];await exam(keys[i],i===3?other:ex,q,opts,fulls[i]);min+=2;clk()}
  await lines([['eisele','Danke. Dann schauen wir jetzt in die Breite. Zuerst Pädagogik. Kurze Fragen, kurze Antworten – ich habe um 17 Uhr Chorprobe.']]);
  const step=(TOT-10)/(2*NQ);let pts=0;const pi=pool(PAED.filter(k=>k!==topic),NQ);
  for(const it of pi){pts+=await examPool('eisele',it,PER);min+=step;clk()}award('paed',pts);
  await lines([['jaeger','Und jetzt zur Pädagogischen Psychologie! Ich hab mir Fragen notiert – aber lass uns spontan sein: Ich stelle sie in zufälliger Reihenfolge. Das hält wach!']]);
  pts=0;const ps=pool(PSY.filter(k=>k!==topic),NQ);
  for(const it of ps){pts+=await examPool('jaeger',it,PER);min+=step;clk()}award('psy',pts);
  const Q=pick(QUER);
  await exam('quer','jaeger',`Zum Schluss: Wenn in einem Fall „${Q[0]}“ vorkommt – woran denken Sie in beiden Fächern?`,[[Q[1],true,'Sauber vernetzt. Genau das sind die Bezüge, die wir hören wollen.'],[Q[2][0],false,'Das passt nicht zusammen. Richtig wäre: '+Q[1]],[Q[2][1],false,'Eher nicht. Richtig wäre: '+Q[1]]],6);
  min=TOT;clk();
  const g=await choose('du','Die Zeit ist um. Möchtest du noch etwas sagen?',['„Vielen Dank für das Gespräch.“','(Das Gummihuhn mit der Rolle in der Mitte auf den Tisch legen.)']);
  if(g===1){sfx('quack');await lines([['jaeger','… Ist das ein Gummihuhn mit einer Rolle in der Mitte? Ich LIEBE es.'],['eisele','Und was heißt das jetzt für Ihren Unterricht?'],['du','Humor und positive Emotionalität – Linzer Diagnosebogen, Beziehungsförderung.'],['eisele','(lacht) Zählt nicht. Aber das war die beste Antwort des Tages.']])}
  else await say('eisele','Wir danken Ihnen. Bitte warten Sie kurz draußen. Und atmen Sie – das ist regenerativ.');
  await lines([['info','Du wartest auf dem Flur. Die Tür ist zu. Man hört Murmeln, einmal ein Lachen, einmal Dr. Jäger: „Und wenn wir die Note diesmal singen?“ – Herr Eisele: „Nein.“ Dann: „Reffi, bitte!“']])}};
function pickTopic(){return new Promise(res=>{lock();
  openModal(`<h2>Wähle deinen Schwerpunkt</h2><p class="hint">Mit dem Schwerpunkt beginnt die Prüfung – ausgehend von einem Fall (höchstens ein Drittel der Zeit). Alle anderen Themen sind ebenfalls prüfbar.</p>
   <h3>Pädagogik (Herr Eisele)</h3><div class="chgrid">${CASE_ORDER.filter(k=>CASES[k].fach==='eisele').map(k=>`<button class="chap" data-k="${k}"><b>${CASES[k].t}</b></button>`).join('')}</div>
   <h3>Pädagogische Psychologie (Dr. Jäger)</h3><div class="chgrid">${CASE_ORDER.filter(k=>CASES[k].fach==='jaeger').map(k=>`<button class="chap" data-k="${k}"><b>${CASES[k].t}</b></button>`).join('')}</div>`);
  $('#card').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{closeModal();unlock();res(b.dataset.k)})})}
async function jokerAsk(who,q,opts){let o=opts.slice();while(true){const labels=o.map(x=>x[0]);const can=S.f.joker>0&&o.filter(x=>!x[1]).length>1;if(can)labels.push(`🃏 Joker einsetzen (noch ${S.f.joker})`);
  const a=await choose(who,q,labels);if(a<o.length)return o[a];
  S.f.joker--;const keep=pick(o.filter(x=>!x[1]));o=o.filter(x=>x[1]||x===keep);sfx('pick');$('#clockbar').textContent=$('#clockbar').textContent.replace(/JOKER ×\d/,S.f.joker?'JOKER ×'+S.f.joker:'');
  await say(who==='eisele'?'jaeger':'eisele',who==='eisele'?'(flüstert herzlich) Ich hab nichts gesagt, aber … nur noch zwei Antworten kommen infrage.':'(räuspert sich strukturiert) Joker angenommen. Es bleiben zwei Antworten.')}}
async function exam(key,who,q,opts,full){const ch=await jokerAsk(who,q,shuffle(opts));
  if(ch[1]){sfx('good');await say(who,ch[2]);award(key,full)}else{sfx('bad');await say(who,ch[2]);const r=opts.find(x=>x[1]);addFehler({q,c:r[0],w:opts.filter(x=>!x[1]).map(x=>x[0]),t:topicOfCat(key),e:r[2]});await say('info','<span class="ok">Die starke Antwort wäre gewesen:</span> '+r[0]);award(key,0)}}
async function examPool(who,it,p){const opts=shuffle([[it.c,true]].concat(it.w.map(w=>[w[0],false,w[1]])));const ch=await jokerAsk(who,it.a,opts);
  if(ch[1]){stat(it.t,1);sfx('good');toast('+'+Math.round(p));await say(who,pick(who==='eisele'?['Sehr schön. Kurz, präzise, Chorprobe gerettet.','Präzise. Danke. Ich mache ein Häkchen. Ein schönes.','Genau so. Und für Ihren Unterricht heißt das …? Schon gut – Sie haben’s ja.']:['Genau! Wunderbar!','Sehr gut – die Theorie sitzt. *Zopf wippt*','Ja, ja, ja! Spontan und richtig – meine Lieblingskombination!']));return p}
  stat(it.t,0);addFehler({q:it.a,c:it.c,w:it.w.map(w=>w[0]),t:it.t});sfx('bad');await say(who,ch[2]);await say('info','<span class="ok">Die starke Antwort wäre gewesen:</span> '+it.c);return 0}
