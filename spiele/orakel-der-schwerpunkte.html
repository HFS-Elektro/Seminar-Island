 {ic:"😴",t:"Schlaf ist Lernzeit",d:"Im Schlaf wird Gelerntes konsolidiert. Eine kurze Abrufrunde am Abend + Schlaf ist eine starke Kombination.",h:"Am 30.11.: Einstieg üben, Schaubilder zeichnen, früh ins Bett."}
];

/* ====================== STATE ====================== */
const KEY="seminarinsel_orakel_v1";
let S = load();
function blank(){return {self:{},quiz:{},fall:{},leit:{},stats:{sessions:0,streak:0,last:null},psySP:true,hours:"3-6",chosen:null,intro:false};}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r));}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let view="start", sub=null, tmp={};

/* ====================== HELPERS ====================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
const DAY=864e5;
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function dlg(who,name,txt){return `<div class="dlg fade"><div class="who">${who}</div><div><b class="n">${name}</b>${txt}</div></div>`;}
function bar(p,col){p=Math.max(0,Math.min(100,p||0));return `<div class="bar"><i style="width:${p}%;background:${col||colFor(p)}"></i></div>`;}
function colFor(p){return p>=70?"var(--ok)":p>=45?"var(--mid)":"var(--bad)";}
function fTag(t){return t.f==="paed"?'<span class="tag t-paed">Päd</span>':'<span class="tag t-psy">PädPsy</span>';}
function daysLeft(){if(!EXAM)return "?";return Math.max(0,Math.ceil((EXAM-new Date())/DAY));}

function selfPct(id){const s=S.self[id];return s?((s.w-1)/4)*100:null;}
function quizPct(id){const q=S.quiz[id];if(!q)return null;return Math.round(q.right/q.total*100);}
function fallPct(id){const f=S.fall[id];return f?Math.round(f.hit/f.tot*100):null;}
function komp(id){const q=quizPct(id),f=fallPct(id);if(q==null&&f==null)return null;if(q!=null&&f!=null)return Math.round(q*.6+f*.4);return q!=null?q:f;}
function calib(id){const s=selfPct(id),k=komp(id);if(s==null||k==null)return null;return Math.round(s-k);}
function spScore(id){const t=BYID[id],k=komp(id),s=S.self[id];if(k==null||!s)return null;
 const inter=(s.i-1)/4*100,prax=s.p/2*100,net=Math.min(100,t.links.length/5*100);
 return Math.round(k*.4+inter*.25+prax*.2+net*.15);}
function eligible(t){return t.sp && (t.f==="paed"||S.psySP);}

/* ====================== NAV ====================== */
const NAV=[["start","🗺️","Karte"],["self","🪞","Selbstbild"],["quiz","⚔️","Expedition"],["fall","🎙️","Fälle"],["orakel","🔮","Orakel"],["train","🗃️","Training"]];
function renderNav(){$("#nav").innerHTML=NAV.map(([v,i,l])=>`<button class="${view===v?"on":""}" onclick="go('${v}')"><span>${i}</span>${l}</button>`).join("");}
function go(v,s){view=v;sub=s||null;tmp={};render();window.scrollTo(0,0);}

/* ====================== VIEWS ====================== */
function render(){renderNav();const a=$("#app");a.innerHTML=(V[view]||V.start)();}
const V={};

V.start=()=>{
 const nSelf=Object.keys(S.self).length,nQ=Object.keys(S.quiz).length,nF=Object.keys(S.fall).length;
 const due=dueCards().length;
 let h=`<h1>🏝️ SEMINAR-INSEL<br>Das Orakel der Schwerpunkte</h1><p class="sub">${EXAM?`Noch <b>${daysLeft()} Tage</b> bis zum Kolloquium`:`Tipp: Trage im Launcher deinen Prüfungstermin ein – dann zählt hier ein Countdown.`}</p>`;
 if(!S.intro){
  h+=dlg("🦜","PAPAGEI PÄDAGOGIUS","Kraaah! Landratte! Du bist auf Seminar-Island gestrandet – mit 17 Themen-Inseln und nur EINEM Schwerpunkt, den du wählen darfst. Das Orakel hilft dir, aber es verlangt drei Opfergaben: dein <b>Selbstbild</b>, deine <b>Expedition</b> (Quiz) und deine <b>Fälle</b>.");
  h+=dlg("🧭","HAFENMEISTER EISELE","Strukturiert vorgehen, junger Mann. Erst ehrlich einschätzen, dann testen, dann entscheiden. Und bitte: kein Redeschwall. Erst Überblick, dann vertiefen.");
  h+=dlg("🗺️","DR. JÄGER, KARTOGRAF","*wirft den Pferdeschwanz zurück* Und experimentier ruhig! Falsche Antworten sind hier Kartenmaterial. Die Wissenschaft sagt: Wer vorher rät, lernt danach besser.");
  h+=`<div class="card"><h3>⚠️ Kleine Seekarten-Korrektur</h3><p class="mut" style="margin:0">Laut Prüfungshinweisen dauert das Kolloquium im <b>gehobenen Dienst 20 Min.</b> (je 10 pro Fach), nur im höheren Dienst 30. Der Schwerpunkt-Fall nimmt höchstens ein Drittel ein, alles andere ist trotzdem prüfbar. Das Orakel rechnet deshalb mit „Schwerpunkt tief + Rest breit“.</p></div>`;
  h+=`<button onclick="S.intro=true;save();render()">Anker lichten ⚓</button>`;
  return h;
 }
 h+=`<div class="card"><h3>Deine Route</h3>
 <div class="row" style="justify-content:space-between"><span>1 · Selbstbild 🪞</span><span class="pill">${nSelf}/17</span></div>${bar(nSelf/17*100,"var(--paed)")}
 <div class="row" style="justify-content:space-between"><span>2 · Expedition ⚔️</span><span class="pill">${nQ}/17</span></div>${bar(nQ/17*100,"var(--acc)")}
 <div class="row" style="justify-content:space-between"><span>3 · Fall-Training 🎙️ <span class="mut">(mind. Top-Kandidaten)</span></span><span class="pill">${nF}/17</span></div>${bar(nF/17*100,"var(--psy)")}
 <div class="row" style="justify-content:space-between"><span>4 · Orakel befragen 🔮</span><span class="pill">${nSelf>=17&&nQ>=17?"bereit":"gesperrt"}</span></div>
 </div>`;
 let next = nSelf<17?["self","Selbstbild abgeben 🪞"]:nQ<17?["quiz","Weiter zur Expedition ⚔️"]:["orakel","Das Orakel befragen 🔮"];
 h+=`<button onclick="go('${next[0]}')">${next[1]}</button>${due?`<button class="sec" onclick="go('train')">🗃️ ${due} Karten fällig</button>`:""}`;
 if(S.chosen) h+=`<div class="card"><h3>🏁 Gewählter Schwerpunkt</h3><div class="big">${BYID[S.chosen].ic} ${BYID[S.chosen].id} ${esc(BYID[S.chosen].n)}</div><button class="sec" onclick="go('plan')">Zum Lernplan 📜</button></div>`;
 h+=`<h2>Die Inselkarte</h2><p class="mut">Farbe = gemessene Kompetenz (Quiz + Fälle). Tippen öffnet die Insel.</p><div class="grid">`;
 T.forEach(t=>{const k=komp(t.id);const c=k==null?"var(--sea3)":colFor(k);
  h+=`<div class="isl" style="border-color:${c}" onclick="go('insel','${t.id}')"><div class="id" style="color:${t.f==="paed"?"var(--paed)":"var(--psy)"}">${t.ic} ${t.id}</div><div class="nm">${esc(t.n)}</div><div class="st">${esc(t.isl)}${k!=null?` · ${k} %`:""}${!t.sp?" · kein SP":""}</div></div>`;});
 h+=`</div><h2>🧪 Lern-Labor</h2><p class="mut">Warum die App so gebaut ist – Befunde aus der Lernforschung:</p>`;
 LABS.forEach(l=>h+=`<details class="card" style="padding:10px 14px"><summary>${l.ic} ${l.t}</summary><p style="margin:6px 0">${l.d}</p><p class="mut" style="margin:0">👉 ${l.h}</p></details>`);
 h+=`<p style="margin-top:24px"><button class="ghost" onclick="resetAll()">Spielstand löschen</button></p>`;
 return h;
};

V.insel=()=>{
 const t=BYID[sub];const k=komp(t.id),s=selfPct(t.id),c=calib(t.id);
 let h=`<button class="ghost" onclick="go('start')">← Karte</button><h1>${t.ic} ${t.id} ${esc(t.n)}</h1><p class="sub">${fTag(t)} ${esc(t.isl)} ${t.sp?"":"· <b>kein eigener Schwerpunkt</b>, aber prüfbar"}</p>`;
 h+=`<div class="card"><div class="row" style="justify-content:space-between"><span>Selbstbild</span><span class="pill">${s==null?"–":Math.round(s)+" %"}</span></div>${bar(s,"var(--paed)")}
 <div class="row" style="justify-content:space-between"><span>Gemessen</span><span class="pill">${k==null?"–":k+" %"}</span></div>${bar(k)}
 ${c!=null?`<p class="mut" style="margin:6px 0 0">${calText(c)}</p>`:""}</div>`;
 h+=`<div class="merk">◆ <b>Merkbild:</b> ${esc(t.merk)}</div><div class="esel">✎ <b>Eselsbrücke:</b> ${esc(t.esel)}</div>`;
 h+=`<div class="card"><h3>⇄ Brücken zu anderen Inseln</h3>${t.links.map(l=>`<span class="tag t-mid">${esc(l)}</span>`).join("")}</div>`;
 h+=`<button onclick="startQuiz(['${t.id}'])">⚔️ Quiz dieser Insel</button><button class="sec" onclick="go('fallrun','${t.id}')">🎙️ Fall üben</button>`;
 return h;
};
function calText(c){if(c>25)return"🔴 Du schätzt dich hier deutlich besser ein als gemessen – mögliche Fluency-Illusion. Zuerst nacharbeiten!";if(c<-25)return"💎 Du unterschätzt dich – versteckter Schatz! Kann ein guter Schwerpunkt sein.";return"🟢 Selbstbild und Messung passen gut zusammen.";}

/* ---------- SELBSTBILD ---------- */
V.self=()=>{
 let h=`<h1>🪞 Der Spiegel der Selbsterkenntnis</h1>`;
 h+=dlg("🦜","PAPAGEI PÄDAGOGIUS","Sei ehrlich, Kraaah! Später vergleicht das Orakel dein Gefühl mit deinen Antworten. Schummeln schadet nur dir. Drei Regler pro Insel, ohne vorher nachzuschlagen!");
 h+=`<div class="card"><label class="chk"><input type="checkbox" ${S.psySP?"checked":""} onchange="S.psySP=this.checked;save()"><span>PädPsy-Themen als Schwerpunkt mitberücksichtigen <span class="mut">(Die Prüfungshinweise listen Schwerpunkte 1–8 für Pädagogik; dein Skript sagt, der Schwerpunkt sei in einem der beiden Fächer wählbar – bitte im Formblatt prüfen.)</span></span></label></div>`;
 T.forEach(t=>{const s=S.self[t.id]||{w:3,i:3,p:1};const done=!!S.self[t.id];
  h+=`<div class="card" id="c_${t.id}"><h3>${t.ic} ${t.id} ${esc(t.n)} ${done?"✅":""}</h3>${fTag(t)}
  <div class="sl"><label>Wissen <span id="w_${t.id}">${s.w}</span></label><input type="range" min="1" max="5" value="${s.w}" oninput="setSelf('${t.id}','w',this.value)"><div class="hint">1 = Totale Nebelbank · 5 = Ich könnte einen Vortrag halten</div></div>
  <div class="sl"><label>Interesse <span id="i_${t.id}">${s.i}</span></label><input type="range" min="1" max="5" value="${s.i}" oninput="setSelf('${t.id}','i',this.value)"><div class="hint">1 = Gähn · 5 = Darüber rede ich auch freiwillig</div></div>
  <div class="sl"><label>Eigene Praxisbeispiele <span id="p_${t.id}">${["keins","eins","mehrere"][s.p]}</span></label><input type="range" min="0" max="2" value="${s.p}" oninput="setSelf('${t.id}','p',this.value)"><div class="hint">Hast du ein Beispiel aus deinen E-Klassen / AVdual?</div></div>
  </div>`;});
 h+=`<button onclick="T.forEach(t=>{if(!S.self[t.id])S.self[t.id]={w:3,i:3,p:1}});save();toast('Spiegel versiegelt! 🪞');go('quiz')">Alle bestätigen → Expedition ⚔️</button>`;
 return h;
};
function setSelf(id,k,v){S.self[id]=S.self[id]||{w:3,i:3,p:1};S.self[id][k]=+v;save();const el=document.getElementById(k+"_"+id);if(el)el.textContent=k==="p"?["keins","eins","mehrere"][+v]:v;}

/* ---------- QUIZ ---------- */
V.quiz=()=>{
 if(tmp.run) return quizRun();
 let h=`<h1>⚔️ Die große Expedition</h1>`;
 h+=dlg("🗺️","DR. JÄGER, KARTOGRAF","51 Fragen, 17 Inseln, absichtlich gemischt. Nach jeder Antwort sagst du, wie sicher du warst – das ist kein Ego-Test, das ist Datenerhebung! Und du kannst jederzeit pausieren, der Fortschritt bleibt.");
 const open=T.filter(t=>!S.quiz[t.id]).map(t=>t.id);
 h+=`<div class="card"><p style="margin-top:0">Offen: <b>${open.length}</b> Inseln</p>
 ${open.length?`<button onclick="startQuiz(${JSON.stringify(open).replace(/"/g,"'")},true)">Expedition starten (gemischt) 🔀</button>`:"<p>Alle Inseln erkundet! 🎉</p><button onclick=\"go('orakel')\">Zum Orakel 🔮</button>"}
 <button class="sec" onclick="startQuiz(T.map(t=>t.id),true,true)">Alles nochmal (zählt nicht neu)</button></div>`;
 h+=`<h2>Einzelne Inseln</h2>`;
 T.forEach(t=>{const p=quizPct(t.id);h+=`<div class="card" style="padding:10px 14px" onclick="startQuiz(['${t.id}'])"><div class="row" style="justify-content:space-between"><span>${t.ic} <b>${t.id}</b> ${esc(t.n)}</span><span class="pill">${p==null?"neu":p+" %"}</span></div></div>`;});
 return h;
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(ids,mix,practice){
 let items=[];ids.forEach(id=>BYID[id].q.forEach((q,i)=>items.push({id,i})));
 if(mix)shuffle(items);
 view="quiz";tmp={run:true,items,pos:0,pick:null,phase:"ask",res:{},practice:!!practice};render();window.scrollTo(0,0);
}
function quizRun(){
 const it=tmp.items[tmp.pos];const t=BYID[it.id];const q=t.q[it.i];
 let h=`<div class="row" style="justify-content:space-between"><span class="prog">FRAGE ${tmp.pos+1}/${tmp.items.length}</span><button class="ghost" onclick="finishQuiz(true)">Pause ⏸</button></div>${bar((tmp.pos)/tmp.items.length*100,"var(--acc)")}`;
 h+=`<div class="card fade"><div>${fTag(t)}<span class="tag t-mid">${t.ic} ${esc(t.isl)}</span></div><p class="big" style="margin:8px 0">${esc(q.q)}</p>`;
 const order=tmp.order||(tmp.order=shuffle(q.o.map((_,i)=>i)));
 order.forEach(oi=>{let cls="opt";if(tmp.phase==="fb"){if(oi===q.a)cls+=" right";else if(oi===tmp.pick)cls+=" wrong";}else if(oi===tmp.pick)cls+=" sel";
  h+=`<button class="${cls}" ${tmp.phase==="fb"?"disabled":""} onclick="tmp.pick=${oi};render()">${esc(q.o[oi])}</button>`;});
 if(tmp.phase==="ask"){
  h+=`<p class="mut" style="margin:12px 0 4px">Wie sicher bist du?</p><div class="row"><button ${tmp.pick==null?"disabled":""} onclick="answer(true)">🔒 Sicher</button><button class="sec" ${tmp.pick==null?"disabled":""} onclick="answer(false)">🤔 Eher geraten</button></div>`;
 }else{
  const ok=tmp.pick===q.a;
  let msg=ok?(tmp.conf?"✅ Treffer – und du wusstest es. Solide Planke!":"✅ Richtig geraten! Achtung: Glückstreffer zählen, aber das Orakel merkt sich die Unsicherheit."):(tmp.conf?"⚡ <b>Hyperkorrektur-Moment!</b> Sicher und falsch – genau diese Fehler merkt sich dein Gehirn nach Korrektur besonders gut. Lies die Erklärung zweimal.":"❌ Nicht ganz – aber durch das Raten vorher ist dein Kopf jetzt „vorgewärmt“ für die richtige Antwort.");
  h+=`<div class="${ok?"say":"esel"}" style="margin-top:10px">${msg}</div><div class="merk">💡 ${esc(q.e)}</div>`;
  h+=`<button onclick="nextQ()">${tmp.pos+1<tmp.items.length?"Weiter ➜":"Expedition beenden 🏁"}</button>`;
 }
 return h+"</div>";
}
function answer(conf){
 const it=tmp.items[tmp.pos];const q=BYID[it.id].q[it.i];const ok=tmp.pick===q.a;
 tmp.conf=conf;tmp.phase="fb";
 const r=tmp.res[it.id]||(tmp.res[it.id]={right:0,total:0,confWrong:0,guessRight:0});
 r.total++;if(ok)r.right++;if(!ok&&conf)r.confWrong++;if(ok&&!conf)r.guessRight++;
 const key=it.id+"_"+it.i;
 if(!ok||!conf){S.leit[key]={box:1,due:today()};}
 else if(!S.leit[key]){S.leit[key]={box:2,due:today()+2*DAY};}
 save();render();
 if(!ok)setTimeout(()=>{const c=document.querySelector(".card");c&&c.classList.add("shake");},10);
}
function nextQ(){
 const it=tmp.items[tmp.pos];
 // Insel fertig?
 if(!tmp.practice){const r=tmp.res[it.id];if(r&&r.total===BYID[it.id].q.length&&!S.quiz[it.id]){S.quiz[it.id]=r;save();toast(`${BYID[it.id].ic} ${BYID[it.id].isl} kartiert!`);}}
 tmp.pos++;tmp.pick=null;tmp.phase="ask";tmp.order=null;
 if(tmp.pos>=tmp.items.length)return finishQuiz(false);
 render();window.scrollTo(0,0);
}
function finishQuiz(paused){
 if(!tmp.practice)Object.entries(tmp.res).forEach(([id,r])=>{if(r.total===BYID[id].q.length&&!S.quiz[id])S.quiz[id]=r;});
 save();const n=Object.keys(S.quiz).length;
 tmp={};view="quiz";render();
 if(!paused&&n>=17)toast("Alle Inseln kartiert! Das Orakel erwacht 🔮");else if(paused)toast("Fortschritt gespeichert ⚓");
}

/* ---------- FÄLLE ---------- */
V.fall=()=>{
 let h=`<h1>🎙️ Das Fall-Theater</h1>`;
 h+=dlg("🧭","HAFENMEISTER EISELE","In der Prüfung beginnt der Schwerpunkt mit einem Fall. Also: Fall lesen, 3 Minuten laut antworten – wirklich laut, die Möwen hören weg –, dann ehrlich abhaken, was drin war. Mindestens für deine drei Favoriten, besser für alle.");
 h+=`<div class="card"><h3>Fall-Schema (immer gleich)</h3><p style="margin:0">1 Beschreiben · 2 Analysieren (Theorie!) · 3 Bewerten · 4 Handeln · 5 Vernetzen</p></div>`;
 const ranked=T.slice().sort((a,b)=>(spScore(b.id)||0)-(spScore(a.id)||0));
 ranked.forEach(t=>{const p=fallPct(t.id);h+=`<div class="card" style="padding:10px 14px" onclick="go('fallrun','${t.id}')"><div class="row" style="justify-content:space-between"><span>${t.ic} <b>${t.id}</b> ${esc(t.n)}</span><span class="pill">${p==null?"offen":p+" %"}</span></div></div>`;});
 return h;
};
let timerInt=null;
V.fallrun=()=>{
 const t=BYID[sub];
 let h=`<button class="ghost" onclick="stopTimer();go('fall')">← Fälle</button><h1>${t.ic} Fall ${t.id}</h1>${fTag(t)}<div class="card fade"><p class="big" style="margin-top:0">${esc(t.fall.t)}</p></div>`;
 if(!tmp.stage){
  h+=`<div class="say">► Starte mit dem Universal-Einstieg: „Ich würde die Situation zunächst so verstehen, dass … Aus meiner Sicht spielen drei Aspekte eine Rolle …“</div>
  <div class="timer" id="tm">3:00</div><button onclick="startTimer()">▶ Timer starten & laut sprechen</button><button class="sec" onclick="stopTimer();tmp.stage='check';render()">Ich bin fertig ✔</button>`;
 }else{
  h+=`<div class="card"><h3>Was hattest du drin?</h3>${t.fall.k.map((k,i)=>`<label class="chk"><input type="checkbox" id="k${i}"><span>${esc(k)}</span></label>`).join("")}
  <h3 style="margin-top:12px">Und formal?</h3>
  <label class="chk"><input type="checkbox" id="kx1"><span>Mit Überblick begonnen (1., 2., 3.) statt Redeschwall</span></label>
  <label class="chk"><input type="checkbox" id="kx2"><span>Fachbegriffe/Autoren genannt</span></label>
  <button onclick="saveFall('${t.id}')">Auswerten 📊</button></div>`;
  h+=`<div class="merk">◆ ${esc(t.merk)}</div>`;
 }
 return h;
};
function startTimer(){stopTimer();let s=180;const el=()=>document.getElementById("tm");timerInt=setInterval(()=>{s--;if(el())el().textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s<=0){stopTimer();tmp.stage="check";render();toast("⏰ Zeit! Jetzt ehrlich abhaken.");}},1000);}
function stopTimer(){if(timerInt)clearInterval(timerInt);timerInt=null;}
function saveFall(id){const t=BYID[id];let hit=0;t.fall.k.forEach((_,i)=>{if(document.getElementById("k"+i).checked)hit++;});
 const f1=document.getElementById("kx1").checked,f2=document.getElementById("kx2").checked;const tot=t.fall.k.length+2;hit+=(f1?1:0)+(f2?1:0);
 S.fall[id]={hit,tot};save();const p=Math.round(hit/tot*100);
 toast(p>=70?"Applaus aus dem Möwen-Publikum! 👏":p>=45?"Ordentlich – die Lücken kommen in die Kiste.":"Das Theater übt noch – kein Problem, genau dafür ist es da.");
 if(p<70)S.leit["F_"+id]={box:1,due:today()};save();go("insel",id);}

/* ---------- ORAKEL ---------- */
V.orakel=()=>{
 const nS=Object.keys(S.self).length,nQ=Object.keys(S.quiz).length;
 let h=`<h1>🔮 Das Orakel der Schwerpunkte</h1>`;
 if(nS<17||nQ<17){
  h+=dlg("🔮","DAS ORAKEL","Hmmm. Ich sehe… Nebel. Bring mir dein vollständiges Selbstbild (" +nS+"/17) und alle Inseln der Expedition ("+nQ+"/17). Ein Orakel ohne Daten ist nur ein Horoskop.");
  h+=`<button onclick="go('${nS<17?"self":"quiz"}')">Weiter sammeln</button>`;
  return h;
 }
 const el=T.filter(eligible).map(t=>({t,sc:spScore(t.id)})).sort((a,b)=>b.sc-a.sc);
 const top=el.slice(0,3);
 h+=dlg("🔮","DAS ORAKEL","Die Kristallkugel hat gesprochen! Gewichtet habe ich: <b>40 % gemessene Kompetenz</b>, <b>25 % Interesse</b>, <b>20 % eigene Praxisbeispiele</b>, <b>15 % Vernetzungspotenzial</b>. Denn: Ein Schwerpunkt muss sitzen, aber du musst auch gern und mit Beispielen darüber reden – und Brücken bauen, die die Prüfer sehen wollen.");
 const medals=["🥇","🥈","🥉"];
 top.forEach((o,i)=>{const t=o.t,c=calib(t.id),s=S.self[t.id];
  const why=[];const k=komp(t.id);
  if(k>=70)why.push("starke Messwerte");else if(k<45)why.push("Messwerte noch schwach – Vertiefung nötig");
  if(s.i>=4)why.push("hohes Interesse");if(s.p===2)why.push("mehrere eigene Praxisbeispiele");if(t.links.length>=5)why.push("viele Brücken zum anderen Fach");
  h+=`<div class="card fade"><div class="rank"><div class="medal">${medals[i]}</div><div style="flex:1"><div class="big">${t.ic} ${t.id} ${esc(t.n)}</div>${fTag(t)}${t.f==="psy"?'<span class="tag t-mid">Formblatt prüfen</span>':""}</div><div class="pill">${o.sc}</div></div>${bar(o.sc,"var(--acc)")}
  <p class="mut" style="margin:6px 0">${why.join(" · ")||"ausgewogenes Profil"}${c!=null&&c>25?" · ⚠️ <b>Achtung, du überschätzt dich hier</b>":""}</p>
  <details><summary>Dein 3-Minuten-Einstieg</summary><div class="say">„Bei ${esc(t.n)} sehe ich drei zentrale Aspekte: erstens ${esc(t.drei[0])}, zweitens ${esc(t.drei[1])}, drittens ${esc(t.drei[2])}. Soll ich einen davon vertiefen? Eine Verbindung sehe ich übrigens zu ${esc(t.links[0])}.“</div></details>
  <button class="${i?"sec":""}" onclick="S.chosen='${t.id}';save();toast('Schwerpunkt gewählt: ${t.id} 🏁');go('plan')">Das wird mein Schwerpunkt</button></div>`;});
 h+=`<h2>📊 Kalibrierungs-Kompass</h2><p class="mut">Selbstbild vs. Messung. Δ > +25 = überschätzt (rot), Δ < −25 = unterschätzt (Schatz).</p><div class="card" style="overflow-x:auto"><table><tr><th>Insel</th><th>Gefühl</th><th>Gemessen</th><th>Δ</th><th>Sicher-falsch</th></tr>`;
 T.forEach(t=>{const s=Math.round(selfPct(t.id)),k=komp(t.id),c=calib(t.id),q=S.quiz[t.id];
  const ct=c>25?"t-bad":c<-25?"t-ok":"t-mid";
  h+=`<tr onclick="go('insel','${t.id}')"><td>${t.ic} <b>${t.id}</b></td><td>${s}%</td><td><span style="color:${colFor(k)}">${k}%</span></td><td><span class="tag ${ct}">${c>0?"+":""}${c}</span></td><td>${q.confWrong?"⚡".repeat(q.confWrong):"–"}</td></tr>`;});
 h+=`</table></div>`;
 const weak=T.slice().sort((a,b)=>komp(a.id)-komp(b.id)).slice(0,4);
 h+=`<h2>🚧 Deine Baustellen</h2>${dlg("🦜","PAPAGEI PÄDAGOGIUS","Diese vier Inseln brauchst du für den „breiten Rest“. Nicht vertiefen – nur sicher Leitfragen + Mini-Fall! Kraaah!")}`;
 weak.forEach(t=>h+=`<div class="card" style="padding:10px 14px" onclick="go('insel','${t.id}')"><div class="row" style="justify-content:space-between"><span>${t.ic} <b>${t.id}</b> ${esc(t.n)}</span><span class="pill" style="color:${colFor(komp(t.id))}">${komp(t.id)} %</span></div></div>`);
 const hidden=T.filter(t=>calib(t.id)<-25);
 if(hidden.length)h+=`<h2>💎 Versteckte Schätze</h2><p class="mut">Hier bist du besser, als du denkst: ${hidden.map(t=>t.id+" "+esc(t.n)).join(", ")}.</p>`;
 return h;
};

/* ---------- PLAN ---------- */
V.plan=()=>{
 if(!S.chosen)return `<h1>📜 Lernplan</h1><p>Erst das Orakel befragen und einen Schwerpunkt wählen.</p><button onclick="go('orakel')">Zum Orakel</button>`;
 const sp=BYID[S.chosen];
 const weak=T.filter(t=>t.id!==sp.id).sort((a,b)=>(komp(a.id)??50)-(komp(b.id)??50));
 const w=weak.map(t=>`${t.id} ${t.n}`);
 const mid=weak.slice(4,10).map(t=>t.id).join(", ");
 const rest=weak.slice(10).map(t=>t.id).join(", ");
 let h=`<h1>📜 Die Schatzkarte</h1><p class="sub">Schwerpunkt: <b>${sp.ic} ${sp.id} ${esc(sp.n)}</b> · ca. 3–6 Std./Woche · ${daysLeft()} Tage</p>`;
 h+=dlg("🗺️","DR. JÄGER, KARTOGRAF","Vier Etappen. Jede Woche: <b>täglich 10 Min. Kisten-Training</b> (verteilt + gemischt) plus <b>3 Einheiten à 60 Min.</b> Das sind gut 4 Stunden – passt in dein Budget und lässt Puffer für Unterrichtsvorbereitung.");
 h+=`<div class="card"><div class="week"><h3>Etappe 1 · 09.–15.11.</h3><ul>
 <li>✍️ <b>Formblatt</b>: Schwerpunkt ${sp.id} eintragen/abgeben (Frist prüfen!)</li>
 <li>📘 Schwerpunkt: Skript-Kapitel ${sp.id} mit Leitfragen-Methode, alle Leitfragen schriftlich aus dem Kopf</li>
 <li>🚧 Baustelle 1+2: ${esc(w[0])}, ${esc(w[1])} – Leitfragen + Mini-Fall</li>
 <li>🗃️ täglich Kisten-Training (10 Min.)</li></ul></div>
 <div class="week"><h3>Etappe 2 · 16.–22.11.</h3><ul>
 <li>🎯 Schwerpunkt vertiefen: 3-Minuten-Einstieg laut, drei Schaubilder aus dem Gedächtnis zeichnen, 2 eigene Praxisbeispiele aus deinen Klassen ausformulieren</li>
 <li>⇄ Brücken üben: ${sp.links.slice(0,3).map(esc).join(" · ")}</li>
 <li>🚧 Baustelle 3+4: ${esc(w[2])}, ${esc(w[3])}</li>
 <li>🗃️ täglich Kisten-Training</li></ul></div>
 <div class="week"><h3>Etappe 3 · 23.–29.11.</h3><ul>
 <li>🎙️ Fall-Theater: alle Fälle einmal laut (ideal: Tandem mit Mitreferendar*in, sich gegenseitig prüfen)</li>
 <li>🔀 Mittelfeld nur über Leitfragen: ${esc(mid)}</li>
 <li>✅ Stärken kurz anschauen: ${esc(rest)}</li>
 <li>🔁 Expedition „Alles nochmal“ – Ziel: überall ≥ 70 %</li></ul></div>
 <div class="week"><h3>Finale · 30.11.</h3><ul>
 <li>► Einstieg Schwerpunkt 3× laut</li><li>✏️ Querbezugs-Netz aus dem Gedächtnis zeichnen</li><li>😴 Früh schlafen – Konsolidierung ist Teil des Lernens</li></ul></div></div>`;
 h+=`<div class="say">„Bei ${esc(sp.n)} sehe ich drei zentrale Aspekte: erstens ${esc(sp.drei[0])}, zweitens ${esc(sp.drei[1])}, drittens ${esc(sp.drei[2])}. Soll ich einen davon vertiefen?“</div>`;
 h+=`<button class="sec" onclick="go('orakel')">Schwerpunkt ändern</button>`;
 return h;
};

/* ---------- TRAINING (Leitner) ---------- */
const INT=[0,1,2,4,7,14];
function dueCards(){const n=today();return Object.entries(S.leit).filter(([k,v])=>v.due<=n&&!k.startsWith("F_")).map(([k])=>k);}
V.train=()=>{
 if(tmp.tr)return trainRun();
 const due=dueCards();const boxes=[1,2,3,4,5].map(b=>Object.values(S.leit).filter(v=>v.box===b).length);
 const falls=Object.entries(S.leit).filter(([k,v])=>k.startsWith("F_")&&v.due<=today()).map(([k])=>k.slice(2));
 let h=`<h1>🗃️ Die Leitner-Truhe</h1>`;
 h+=dlg("🦜","PAPAGEI PÄDAGOGIUS","Jeden Tag ein paar Karten. Richtig → eine Kiste weiter, längere Pause. Falsch → zurück in Kiste 1 und <b>noch in derselben Runde nochmal</b>, bis es einmal sitzt. Das nennt man successive relearning. Klingt fancy, ist Papageien-Weisheit!");
 h+=`<div class="card"><div class="row">${boxes.map((n,i)=>`<div style="flex:1;text-align:center"><div class="pill">K${i+1}</div><div class="big">${n}</div><div class="mut">${INT[i+1]} T</div></div>`).join("")}</div></div>`;
 h+=due.length?`<button onclick="startTrain()">${due.length} fällige Karten trainieren 🔀</button>`:`<p>Heute nichts fällig. ${Object.keys(S.leit).length?"Morgen wieder! ☀️":"Starte zuerst die Expedition – deine Fehler füllen die Truhe."}</p>`;
 if(falls.length)h+=`<h2>🎙️ Fälle zum Wiederholen</h2>`+falls.map(id=>`<div class="card" style="padding:10px 14px" onclick="delete S.leit['F_${id}'];save();go('fallrun','${id}')">${BYID[id].ic} <b>${id}</b> ${esc(BYID[id].n)}</div>`).join("");
 return h;
};
function startTrain(){const items=shuffle(dueCards().map(k=>{const [id,i]=k.split("_");return {id,i:+i,k};}));view="train";tmp={tr:true,items,pos:0,pick:null,phase:"ask",ok:0,retry:{}};render();}
function trainRun(){
 if(tmp.pos>=tmp.items.length){return `<h1>🏆 Runde geschafft!</h1><div class="card"><p class="big">${tmp.ok} Karten aufgestiegen.</p><p class="mut">Pause machen. Das Vergessen bis morgen ist kein Bug, sondern Feature: Abrufen nach etwas Vergessen festigt stärker („wünschenswerte Erschwernis“).</p></div><button onclick="tmp={};go('train')">Zurück</button>`;}
 const it=tmp.items[tmp.pos],t=BYID[it.id],q=t.q[it.i];
 let h=`<div class="row" style="justify-content:space-between"><span class="prog">KARTE ${tmp.pos+1}/${tmp.items.length} · K${S.leit[it.k].box}</span><button class="ghost" onclick="tmp={};go('train')">Stopp</button></div>`;
 h+=`<div class="card fade">${fTag(t)}<p class="big">${esc(q.q)}</p>`;
 if(tmp.phase==="ask"&&!tmp.reveal){h+=`<p class="mut">Erst im Kopf beantworten (Generierungs-Effekt!), dann aufdecken.</p><button onclick="tmp.reveal=true;render()">Optionen zeigen</button>`;return h+"</div>";}
 const order=tmp.order||(tmp.order=shuffle(q.o.map((_,i)=>i)));
 order.forEach(oi=>{let cls="opt";if(tmp.phase==="fb"){if(oi===q.a)cls+=" right";else if(oi===tmp.pick)cls+=" wrong";}
  h+=`<button class="${cls}" ${tmp.phase==="fb"?"disabled":""} onclick="trainAns(${oi})">${esc(q.o[oi])}</button>`;});
 if(tmp.phase==="fb")h+=`<div class="merk">💡 ${esc(q.e)}</div><button onclick="tmp.pos++;tmp.phase='ask';tmp.reveal=false;tmp.order=null;render();window.scrollTo(0,0)">Weiter ➜</button>`;
 return h+"</div>";
}
function trainAns(oi){const it=tmp.items[tmp.pos],q=BYID[it.id].q[it.i],L=S.leit[it.k];tmp.pick=oi;tmp.phase="fb";
 if(oi===q.a){if(!tmp.retry[it.k]){L.box=Math.min(5,L.box+1);tmp.ok++;}L.due=today()+INT[L.box]*DAY;if(L.box===5&&!tmp.retry[it.k])toast("🏅 Karte gemeistert!");}
 else{L.box=1;L.due=today()+DAY;if(!tmp.retry[it.k]){tmp.retry[it.k]=1;tmp.items.push({...it});}}
 save();render();}

function resetAll(){if(tmp.confirmReset){S=blank();save();tmp={};toast("Neustart ⚓");render();}else{tmp.confirmReset=true;toast("Nochmal tippen zum Löschen");}}

render();
</script>
